<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151d">
<title>學爽P組五人｜計分板</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1a222c;--panel2:#202b37;--line:#384554;--text:#f3f5f8;--muted:#aebaca;--accent:#68d6c7;--accentbg:rgba(104,214,199,.12);--orange:#efbf71;--danger:#ec9191}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1920px;margin:auto;padding:clamp(16px,2.7vw,40px)}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.heading h1{font-size:clamp(28px,3vw,42px);font-weight:850;letter-spacing:.02em;margin:0}.heading p{margin:5px 0 0;color:var(--muted);font-size:14px}
.header-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.count-pill{font-size:14px;color:var(--muted);padding:9px 15px;border:1px solid var(--line);border-radius:9px}.count-pill strong{font-size:19px;color:var(--text);padding-left:7px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;min-height:40px;padding:8px 14px;font-weight:650;transition:background .12s ease, border-color .12s ease;white-space:nowrap}
.btn:hover:not(:disabled){background:#2a3745;border-color:#647485}.btn.primary{background:var(--accent);border-color:var(--accent);color:#10221f}.btn.primary:hover:not(:disabled){background:#8be3d7}.btn.danger{color:#ffb6b6}.btn.outline{background:transparent}.btn.small{min-height:34px;padding:5px 10px;font-size:14px}.btn.icon-btn{min-width:40px;padding:7px 10px}
.section-label{display:flex;gap:12px;align-items:center;margin:0 0 14px}.section-label h2{font-size:18px;margin:0;font-weight:750}.section-label span{color:var(--muted);font-size:13px}
.battle-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:26px}
.battle-row{display:grid;grid-template-columns:1fr 76px 1fr;gap:12px;align-items:stretch}
.competitor{min-width:0;background:var(--panel2);border:1px solid #41505d;border-radius:11px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.competitor .role{color:var(--muted);font-size:13px}.competitor .battle-name{font-size:clamp(20px,2.2vw,32px);font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.competitor .battle-score{font-size:clamp(32px,3vw,48px);font-weight:850;line-height:1}.competitor .score-sub{font-size:14px;color:var(--muted)}
.vs{display:flex;align-items:center;justify-content:center;font-size:clamp(20px,2.2vw,28px);font-weight:850;color:#bdc7d1}
.battle-actions{display:flex;justify-content:center;gap:10px;margin-top:6px}.battle-actions .btn{min-width:128px;min-height:42px}
.champion{display:none;border:1px solid var(--accent);background:var(--accentbg);color:#c5fff5;padding:15px;border-radius:10px;text-align:center;font-size:clamp(17px,2vw,23px);font-weight:750;margin-bottom:16px}.champion.show{display:block}
.board-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.board-header .section-label{margin:0}.board-ctrl{display:flex;gap:8px}
.board-scroller{overflow-x:auto;overflow-y:hidden;scrollbar-color:#526573 transparent;scrollbar-width:thin;scroll-behavior:smooth;padding:6px 3px 18px;overscroll-behavior-x:contain}
.board{display:flex;gap:12px;align-items:stretch;min-width:max-content;padding:2px}
.player{--w:130px;position:relative;flex:0 0 var(--w);width:var(--w);min-height:245px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 11px;display:flex;flex-direction:column;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.player.active{border-color:var(--accent);background:#1e3035}.player.active::after{content:"對戰中";position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:2px 8px;border-radius:5px;background:var(--accent);color:#10201e;font-size:11px;font-weight:800;white-space:nowrap}
.player.winner{border-color:var(--orange)}.player.drag-origin{opacity:.32}.player.drop-target{outline:3px solid var(--accent);outline-offset:2px}
.player-top{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:28px}.order{font-size:14px;color:var(--muted);font-weight:800}.grip{border:0;background:transparent;color:#a7b7c4;cursor:grab;font-size:23px;letter-spacing:-2px;line-height:1;border-radius:5px;width:34px;height:30px;touch-action:none;display:flex;align-items:center;justify-content:center}.grip:active{cursor:grabbing}.grip:hover{background:var(--panel2);color:white}
.avatar{width:46px;height:46px;background:#344453;border-radius:50%;display:grid;place-items:center;color:#e2eaf0;font-size:19px;font-weight:780;flex-shrink:0}
.pname{width:100%;min-height:33px;display:flex;align-items:center;justify-content:center;gap:3px;text-align:center}.name-text{font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;min-width:0}.rename{background:none;color:var(--muted);border:0;border-radius:5px;padding:2px 3px;font-size:13px;flex-shrink:0}.rename:hover{background:var(--panel2);color:white}
.seven-bars{display:flex;flex-direction:column;gap:5px;width:100%;padding:0 3px}.bar{height:8px;border-radius:999px;background:#3b4956}.bar.filled{background:var(--accent)}
.p-score{font-size:27px;font-weight:850;line-height:1.15}.scorer{display:flex;gap:6px;width:100%;justify-content:center;margin-top:auto}.scorer button{height:32px;flex:1;padding:2px;min-width:0;font-size:18px}
.hint{color:var(--muted);font-size:13px;margin:7px 0 21px}.admin{padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.admin-label{font-size:15px;font-weight:750;white-space:nowrap}.admin-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.admin-group .label{font-size:13px;color:var(--muted);margin-right:2px}.count-number{font-weight:850;min-width:35px;text-align:center;font-size:19px}.separator{height:31px;width:1px;background:var(--line)}.footnote{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}
.drag-ghost{position:fixed!important;margin:0!important;pointer-events:none!important;z-index:9999;opacity:.94;box-shadow:0 14px 34px rgba(0,0,0,.6);border-color:var(--accent);transform:scale(1.045)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border:1px solid var(--line);background:#2c3946;color:white;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .22s;z-index:10000;max-width:90vw;text-align:center}.toast.visible{opacity:1}
.project-mode .admin,.project-mode .hint,.project-mode .scorer,.project-mode .grip,.project-mode .rename,.project-mode .board-ctrl,.project-mode .footnote,.project-mode .battle-actions{display:none!important}
.project-mode .player{min-height:205px}.project-mode .pname{min-height:34px}
@media(min-width:1100px){.player{--w:clamp(125px,7.55vw,152px)}.player{min-height:258px}}
@media(max-width:680px){.wrap{padding:16px}.header{margin-bottom:15px}.heading h1{font-size:27px}.battle-box{padding:14px;margin-bottom:23px}.battle-row{grid-template-columns:minmax(0,1fr) 31px minmax(0,1fr);gap:6px}.competitor{padding:14px 7px;gap:8px}.competitor .battle-name{font-size:19px}.competitor .battle-score{font-size:33px}.vs{font-size:19px}.battle-actions .btn{min-width:0;flex:1;font-size:13px;padding:9px 6px}.section-label span{display:none}.admin{gap:12px}.separator{display:none}.player{--w:130px}}
@media(prefers-reduced-motion:reduce){.btn,.toast,.board-scroller{transition:none;scroll-behavior:auto}}

/* Tablet-first 4 × 3 scoreboard: all 12 cards stay visible without horizontal scrolling. */
.wrap{max-width:1500px;padding:12px 20px}
.header{margin-bottom:10px;flex-wrap:nowrap}.heading h1{font-size:clamp(23px,3.3vw,35px)}
.count-pill{padding:5px 11px}.header-right .btn{min-height:35px;padding:6px 10px}
.battle-box{padding:10px 14px;margin-bottom:12px}
.section-label{margin-bottom:8px}.section-label h2{font-size:16px}
.battle-row{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:9px}
.competitor{padding:7px 10px;gap:3px}.competitor .battle-name{font-size:clamp(18px,2vw,25px)}
.competitor .battle-score{font-size:clamp(23px,2.8vw,34px)}.competitor .score-sub{display:none}
.battle-actions{margin-top:7px}.battle-actions .btn{min-height:34px;padding:5px 12px}
.board-header{margin-bottom:8px}.board-scroller{overflow:visible;padding:2px 2px 3px;scroll-behavior:auto}
.board{min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:1px}
.player,.project-mode .player{--w:auto;min-width:0;width:100%;min-height:0;height:clamp(125px,18vh,153px);flex:none;padding:7px 11px;gap:4px;touch-action:none;-webkit-tap-highlight-color:transparent}
.player.active::after{top:-7px;font-size:9px;padding:1px 6px}
.player.selected{outline:3px solid var(--orange);outline-offset:-3px;background:#3b3225}
.player-top{min-height:17px;height:17px}.order{font-size:13px}.grip{font-size:11px;letter-spacing:0;width:auto;min-width:50px;height:22px;padding:0 7px;background:#2b3947;border-radius:5px;color:#e1e8f0;cursor:grab}
.avatar{display:none}.pname{min-height:22px;height:22px}.name-text{font-size:clamp(13px,1.8vw,17px)}.rename{font-size:16px}
.seven-bars{flex-direction:row;gap:5px;width:100%;padding:0}.bar{flex:1;min-width:0;height:9px}
.p-score{font-size:27px;line-height:1.05}.scorer{margin-top:auto;gap:9px}.scorer button{height:30px;min-height:30px;font-size:19px}
.hint{margin:5px 0 9px;font-size:12px}.admin{padding:9px 12px;gap:10px}.footnote{margin-top:6px;font-size:11px}
.drag-ghost{max-width:380px}.drag-ghost .grip{pointer-events:none}
.project-mode .player{height:clamp(120px,20vh,170px)}
@media(min-width:700px) and (max-height:850px){
 .wrap{padding:8px 18px}.header{margin-bottom:7px}.battle-box{padding:8px 12px;margin-bottom:8px}
 .battle-actions{margin-top:5px}.board-header{margin-bottom:5px}.player{height:clamp(117px,16vh,133px);gap:2px;padding:5px 10px}.player-top{min-height:16px;height:16px}.pname{min-height:20px;height:20px}.p-score{font-size:24px}.scorer button{height:28px;min-height:28px}
 .hint{margin:3px 0 6px}.footnote{display:none}.admin{padding:6px 10px}
}
@media(max-width:760px){
 .wrap{padding:10px}.header{flex-wrap:wrap;gap:8px}.heading h1{font-size:24px}
 .board{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .player{height:140px;padding:7px 5px}.name-text{font-size:13px}
 .battle-row{grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:5px}
 .competitor{padding:8px 5px}.competitor .battle-name{font-size:17px}.competitor .battle-score{font-size:24px}
 .battle-actions .btn{font-size:12px}.section-label span{display:inline;font-size:11px}
 .admin{gap:8px}.admin-label{display:none}
}
@media(max-width:420px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.player{height:136px}.header-right{gap:5px}}

/* The five advancing dancers are always displayed after the active grid. */
.player{position:relative}.player-top{align-self:stretch}.player-top .order{align-self:center}.player .grip{font-size:11px}
  .player.drag-origin{opacity:.28;border:2px dashed var(--accent);background:var(--accentbg)}
  /* Normal card touches scroll the document; only the handle may capture touch movement. */
  .player,.project-mode .player{touch-action:pan-y}
  .player .grip{touch-action:none;user-select:none;-webkit-user-select:none;min-width:63px}
  .player .grip.holding{background:#536274;color:#fff;outline:2px solid var(--orange)}
  .player .grip.ready{background:var(--accent);color:#132822;outline:2px solid var(--accent)}
  .battle-actions{flex-wrap:wrap}
  .battle-actions .btn.ot{background:#465260;border-color:#778492;color:#fff}
  .battle-actions .btn.ot:hover:not(:disabled){background:#596877}

.drag-ghost{opacity:.82;transform:scale(1.018)}
.qualified-panel{margin:9px 0 4px;border:1px solid #58625a;border-radius:11px;background:#17241f;padding:10px 13px}
.qualified-title{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.qualified-title h2{font-size:16px;margin:0}.qualified-title strong{color:var(--accent);font-size:18px}.qualified-title span{color:var(--muted);font-size:12px}
.qualified-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.qualified-slot{min-width:0;min-height:48px;border:1px dashed #415449;border-radius:8px;display:flex;gap:5px;align-items:center;justify-content:center;padding:5px 7px;color:#91a89a;font-size:12px}
.qualified-slot.filled{border-style:solid;border-color:#528b72;background:#22372b;color:var(--text);justify-content:flex-start}
.qualified-rank{color:var(--accent);font-weight:850;flex-shrink:0}
.qualified-name{font-weight:700;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(11px,1.7vw,15px)}
.qualified-edit{border:0;background:transparent;color:#b8dccc;cursor:pointer;padding:3px;font-size:14px}
.project-mode .qualified-panel{display:block}
@media(max-width:760px){.qualified-list{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.qualified-slot{padding:4px;gap:3px}.qualified-title span{display:none}}
@media(max-width:520px){.qualified-list{grid-template-columns:repeat(3,minmax(0,1fr))}}

@media (min-width:700px) and (max-height:850px){
 .wrap{padding:7px 15px}
 .header{margin-bottom:5px}.heading h1{font-size:26px}
 .battle-box{padding:6px 11px;margin-bottom:6px}
 .competitor{padding:2px 8px;gap:1px}
 .competitor .role{font-size:11px}
 .competitor .battle-name{font-size:20px}.competitor .battle-score{font-size:26px}
 .battle-actions{margin-top:3px}.battle-actions .btn{min-height:30px;padding:3px 9px}
 .section-label{margin-bottom:4px}.board-header{margin-bottom:3px}
 .player{height:117px;padding:4px 9px;gap:1px}
 .player-top{min-height:15px;height:15px}.pname{min-height:19px;height:19px}
 .p-score{font-size:23px}.scorer button{height:27px;min-height:27px}
 .hint{margin:2px 0 5px}.admin{padding:5px 9px}
 .qualified-panel{margin-top:6px;padding:6px 10px}
 .qualified-title{margin-bottom:4px}.qualified-slot{min-height:39px}
}

/* 90-minute countdown timer, clearly readable on tablets and phones. */
.timer-panel{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:9px 13px;margin:0 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.timer-main{display:flex;align-items:center;gap:13px;min-width:0}
.timer-label{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.timer-time{font-size:clamp(28px,3.6vw,38px);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.1}
.timer-time.ending{color:var(--danger)}
.timer-controls{display:flex;gap:7px;align-items:center}
.timer-controls .btn{min-width:70px;min-height:35px;padding:5px 12px}
@media(max-width:530px){.timer-panel{padding:10px}.timer-controls{width:100%}.timer-controls .btn{flex:1}}
/* Small games-played badge beside the score, separate from seven-win progress. */
.games-badge{position:absolute;right:7px;bottom:37px;padding:2px 4px;min-height:17px;border-radius:5px;background:#2d3a49;border:1px solid #495969;color:#d3dfe9;font-size:11px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;z-index:1}
.games-badge:active{background:#42556b}
.qualified-games{color:#b8cfc2;font-size:11px;white-space:nowrap}
@media(max-width:420px){.games-badge{font-size:10px;right:4px;bottom:37px;padding:2px 3px}}

/* Fullscreen safe area: leave space above for iPad/browser close controls. */
html:fullscreen,
html:-webkit-full-screen{overflow:auto;background:var(--bg)}
html:fullscreen .wrap,
html:-webkit-full-screen .wrap{
  max-width:min(1400px,94vw);
  padding-top:max(72px,calc(env(safe-area-inset-top,0px) + 44px));
  padding-left:clamp(18px,2.3vw,32px);
  padding-right:clamp(18px,2.3vw,32px);
  padding-bottom:max(20px,env(safe-area-inset-bottom,0px));
}
@media(max-height:700px){
 html:fullscreen .wrap,
 html:-webkit-full-screen .wrap{padding-top:max(56px,calc(env(safe-area-inset-top,0px) + 36px))}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="header">
    <div class="heading"><h1>學爽P組五人</h1></div>
    <div class="header-right"><div class="count-pill">候場 <strong id="total">12</strong> 人</div><button id="viewBtn" class="btn outline">投影模式</button><button id="fullBtn" class="btn outline">全螢幕</button></div>
  </header>
  <section class="timer-panel" aria-label="90 分鐘倒數計時">
    <div class="timer-main"><span class="timer-label">90 分鐘倒數</span><span class="timer-time" id="timerDisplay" role="timer" aria-live="off">90:00</span></div>
    <div class="timer-controls"><button class="btn primary" type="button" id="timerStart">開始</button><button class="btn" type="button" id="timerPause">暫停</button><button class="btn" type="button" id="timerReset">重置</button></div>
  </section>
  <div class="champion" id="champion" role="status" aria-live="polite"></div>
  <section class="battle-box" aria-label="目前對戰">
    <div class="section-label"><h2>目前對戰</h2><span>勝者留場；OT 雙方下場，由後面選手遞補</span></div>
    <div class="battle-row">
      <div class="competitor"><div class="role">擂主 · 第 1 位</div><div class="battle-name" id="leftName">選手 01</div><div class="battle-score" id="leftScore">0</div><div class="score-sub">勝場</div></div>
      <div class="vs">VS</div>
      <div class="competitor"><div class="role">挑戰者 · 第 2 位</div><div class="battle-name" id="rightName">選手 02</div><div class="battle-score" id="rightScore">0</div><div class="score-sub">勝場</div></div>
    </div>
    <div class="battle-actions"><button class="btn primary" id="leftWin">擂主勝出 ＋1</button><button class="btn ot" id="otBtn">OT · 雙方下場</button><button class="btn primary" id="rightWin">挑戰者勝出 ＋1</button></div>
  </section>
  <section aria-label="所有選手">
    <div class="board-header"><div class="section-label"><h2>選手順序與分數</h2></div></div>
    <div class="board-scroller" id="scroller" aria-label="所有選手，平板四欄三列顯示"><div class="board" id="board"></div></div>
  </section>
  <section class="admin" aria-label="管理功能">
    <div class="admin-label">管理設定</div>
    <div class="admin-group"><span class="label">參賽人數</span><button class="btn small icon-btn" id="minusPlayer" aria-label="減少一位選手">−</button><span class="count-number" id="countText">12</span><button class="btn small icon-btn" id="addPlayer" aria-label="增加一位選手">＋</button></div>
    <div class="separator"></div>
    <div class="admin-group"><button id="undo" class="btn small">↶ 復原上一步</button><button id="resetScores" class="btn small">分數／場次歸零</button><button id="resetAll" class="btn small danger">全部重設</button></div>
  </section>
  <section class="qualified-panel" aria-label="五位晉級選手">
    <div class="qualified-title"><h2>晉級名單</h2><strong id="qualifiedCount">0 / 5</strong><span>依照取得第 7 勝的先後排列</span></div>
    <div class="qualified-list" id="qualifiedList"></div>
  </section>
  <p class="footnote">規則：一般對戰贏家＋1 勝並留在第 1 順位，輸家排到隊尾，下一位上場挑戰。OT 不計分，雙方一起排隊尾，擂主仍排在挑戰者前面；例如 12 人時擂主第 11、挑戰者第 12 順位。選手滿 7 勝即自動晉級，最先 5 人晉級後比賽結束。資料儲存在本裝置瀏覽器。</p>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY='seven_to_smoke_minimal_v1';
  const MAX_PLAYERS=40;
  const $=id=>document.getElementById(id);
  const TARGET=5;
  const initial=()=>({players:Array.from({length:12},(_,i)=>({id:'p'+(i+1),name:'選手 '+String(i+1).padStart(2,'0'),score:0,games:0})),qualified:[],nextId:13});
  function load(){
    try{
      const obj=JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!obj||!Array.isArray(obj.players)||obj.players.length>MAX_PLAYERS)return initial();
      // 舊版只有 players + championId：無損保留名字、分數與排列，7 勝者轉入晉級欄。
      const players=obj.players.slice();
      const qualified=Array.isArray(obj.qualified)?obj.qualified.slice():[];
      if(qualified.length>TARGET||qualified.length+players.length>MAX_PLAYERS)return initial();
      const seen=new Set();
      for(const p of [...players,...qualified]){
        if(!p||typeof p.id!=='string'||seen.has(p.id)||typeof p.name!=='string'||!Number.isInteger(p.score)||p.score<0||p.score>7)return initial();
        // Older rounds recorded only wins; use those as a minimum and allow manual correction.
        if(!Number.isInteger(p.games)||p.games<0||p.games>9999)p.games=p.score;
        seen.add(p.id);
      }
      if(qualified.length<TARGET){
        const legacyWinner=obj.championId ? players.find(p=>p.id===obj.championId&&p.score>=7) : null;
        const migration=[...(legacyWinner?[legacyWinner]:[]),...players.filter(p=>p.score>=7&&p!==legacyWinner)];
        for(const p of migration){if(qualified.length>=TARGET)break;players.splice(players.indexOf(p),1);qualified.push(p)}
      }
      return {players,qualified,nextId:Number.isInteger(obj.nextId)?obj.nextId:13};
    }catch{return initial()}
  }
  let state=load(),history=[],project=false,toastTimer,selectedId=null;
  const clone=v=>JSON.parse(JSON.stringify(v));
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{showToast('瀏覽器無法儲存資料，請勿關閉頁面')}}
  function apply(fn){history.push(clone(state));if(history.length>50)history.shift();fn();save();render()}
  function showToast(message){const t=$('toast');t.textContent=message;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2500)}
  function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
  function nameInitial(name){return name.trim().slice(0,1)||'人'}
  function makePlayer(p,index){
    const card=el('div','player'+(index<2&&state.qualified.length<TARGET?' active':''));card.dataset.id=p.id;
    const top=el('div','player-top');top.append(el('span','order',String(index+1).padStart(2,'0')));
    const grip=el('button','grip','移動');grip.type='button';grip.title='請長按此按鈕約 0.2 秒後拖曳移動';grip.setAttribute('aria-label',`長按 0.2 秒後移動 ${p.name}；使用方向鍵可逐格移動`);grip.dataset.dragId=p.id;grip.addEventListener('pointerdown',startDrag);grip.addEventListener('contextmenu',e=>e.preventDefault());grip.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const offset=e.key==='ArrowLeft'?-1:1,idx=state.players.findIndex(x=>x.id===p.id),other=idx+offset;if(other>=0&&other<state.players.length){apply(()=>moveInsert(idx,other));requestAnimationFrame(()=>{const b=document.querySelector(`[data-drag-id="${CSS.escape(p.id)}"]`);b?.focus();b?.scrollIntoView({block:'nearest',inline:'nearest'})})}}});
    top.append(grip);card.append(top);
    card.append(el('div','avatar',nameInitial(p.name)));
    const name=el('div','pname');const label=el('div','name-text',p.name);label.title=p.name;name.append(label);
    const rename=el('button','rename','✎');rename.title=`修改 ${p.name} 的名字`;rename.setAttribute('aria-label',rename.title);rename.addEventListener('click',()=>renamePlayer(p.id));name.append(rename);card.append(name);
    const bars=el('div','seven-bars');bars.setAttribute('aria-label',`7 格分數，目前 ${p.score} 勝`);
    for(let i=0;i<7;i++)bars.append(el('div','bar'+(i<p.score?' filled':'')));card.append(bars);
    card.append(el('div','p-score',String(p.score)));
    const played=el('button','games-badge',`場 ${p.games}`);
    played.type='button';
    played.title=`${p.name}：已打 ${p.games} 場（點此修正）`;
    played.setAttribute('aria-label',`${p.name} 已打 ${p.games} 場，點擊可修正場次`);
    played.addEventListener('click',()=>editGames(p.id));
    card.append(played);
    const controls=el('div','scorer');const minus=el('button','btn small','−'),plus=el('button','btn small','＋');minus.title=`${p.name} 減一分`;plus.title=`${p.name} 加一分`;minus.setAttribute('aria-label',minus.title);plus.setAttribute('aria-label',plus.title);minus.disabled=p.score===0;plus.disabled=p.score>=7;minus.addEventListener('click',()=>changeScore(p.id,-1));plus.addEventListener('click',()=>changeScore(p.id,1));controls.append(minus,plus);card.append(controls);
    return card;
  }
  function render(){
    const n=state.players.length,q=state.qualified.length,complete=q>=TARGET;
    $('total').textContent=n;$('countText').textContent=n;
    $('minusPlayer').disabled=n===0;$('addPlayer').disabled=n+q>=MAX_PLAYERS;$('undo').disabled=history.length===0;
    const [a,b]=state.players;
    $('leftName').textContent=a?.name||'等待選手';$('rightName').textContent=b?.name||'等待選手';
    $('leftScore').textContent=a?.score??'—';$('rightScore').textContent=b?.score??'—';
    $('leftWin').disabled=n<2||complete;$('rightWin').disabled=n<2||complete;$('otBtn').disabled=n<2||complete;
    const c=$('champion');
    if(complete){c.textContent='五位晉級者已產生，比賽完成！';c.classList.add('show')}
    else{c.textContent='';c.classList.remove('show')}
    const holder=$('board'),fragment=document.createDocumentFragment();
    state.players.forEach((p,i)=>fragment.append(makePlayer(p,i)));holder.replaceChildren(fragment);
    $('qualifiedCount').textContent=`${q} / ${TARGET}`;
    const slots=document.createDocumentFragment();
    for(let i=0;i<TARGET;i++){
      const slot=el('div','qualified-slot'+(i<q?' filled':''));
      if(i<q){
        const p=state.qualified[i];
        slot.append(el('span','qualified-rank',String(i+1)+'.'));
        slot.append(el('span','qualified-name',p.name));
        const played=el('span','qualified-games',`場 ${p.games}`);
        played.title=`已打 ${p.games} 場`;
        slot.append(played);
        const edit=el('button','qualified-edit','✎');edit.title=`修改 ${p.name} 名稱`;edit.setAttribute('aria-label',edit.title);edit.addEventListener('click',()=>renamePlayer(p.id));slot.append(edit);
      }else slot.textContent=`第 ${i+1} 位`;
      slots.append(slot);
    }
    $('qualifiedList').replaceChildren(slots);
  }
  function qualify(player){
    if(player.score<7||state.qualified.some(p=>p.id===player.id)||state.qualified.length>=TARGET)return false;
    const index=state.players.findIndex(p=>p.id===player.id);
    if(index<0)return false;
    state.players.splice(index,1);state.qualified.push(player);return true;
  }
  // 插入排序：從第 2 位拖到第 4 位，結果是 1,3,4,2,5...，不互換。
  function moveInsert(from,to){
    if(from<0||to<0||from>=state.players.length||to>=state.players.length||from===to)return;
    const [player]=state.players.splice(from,1);state.players.splice(to,0,player);
  }
  function renamePlayer(id){
    const p=[...state.players,...state.qualified].find(p=>p.id===id);if(!p)return;
    const text=prompt('請輸入選手名稱（最多 24 字）',p.name);if(text===null)return;
    const next=text.trim().slice(0,24);if(!next){showToast('名稱不能空白');return}if(next===p.name)return;
    apply(()=>{p.name=next});
  }
  function editGames(id){
    const p=[...state.players,...state.qualified].find(player=>player.id===id);
    if(!p)return;
    const entry=prompt(`修正 ${p.name} 的已打場次（0～9999）`,String(p.games));
    if(entry===null)return;
    const raw=entry.trim();
    if(!/^(0|[1-9]\d{0,3})$/.test(raw)){showToast('請輸入 0～9999 的整數');return}
    const games=Number(raw);
    if(games===p.games)return;
    apply(()=>{p.games=games});
  }
  function changeScore(id,amount){
    const p=state.players.find(p=>p.id===id);if(!p)return;
    if(state.qualified.length>=TARGET&&amount>0){showToast('已產生五位晉級者，請先復原上一場');return}
    const score=Math.max(0,Math.min(7,p.score+amount));if(score===p.score)return;
    apply(()=>{p.score=score;if(score>=7)qualify(p)});
    if(score>=7)showToast(`${p.name} 第 ${state.qualified.length} 位晉級！`);
  }
  function battle(winningIndex){
    if(state.qualified.length>=TARGET||state.players.length<2)return;
    let justQualified=null;
    apply(()=>{
      const [left,right]=state.players.splice(0,2);
      const winner=winningIndex===0?left:right,loser=winningIndex===0?right:left;
      winner.games=Math.min(9999,winner.games+1);
      loser.games=Math.min(9999,loser.games+1);
      winner.score=Math.min(7,winner.score+1);
      // 一般勝負：贏家守擂（第 1 順位），輸家回到隊尾。
      state.players.unshift(winner);
      state.players.push(loser);
      if(winner.score===7 && qualify(winner))justQualified=winner;
    });
    if(justQualified)showToast(`${justQualified.name} 第 ${state.qualified.length} 位晉級！`);
  }
  function otRound(){
    if(state.qualified.length>=TARGET||state.players.length<2)return;
    apply(()=>{
      // OT 雙方均不加分，原第 1 位擂主在前、原第 2 位挑戰者在後。
      const [holder,challenger]=state.players.splice(0,2);
      holder.games=Math.min(9999,holder.games+1);
      challenger.games=Math.min(9999,challenger.games+1);
      state.players.push(holder,challenger);
    });
    showToast('OT：雙方排到隊尾，擂主順位仍在前');
  }
  function addPlayer(){
    if(state.players.length+state.qualified.length>=MAX_PLAYERS){showToast('最多 40 位選手');return}
    apply(()=>{const n=state.nextId++;state.players.push({id:'p'+n,name:'選手 '+String(n).padStart(2,'0'),score:0,games:0})});
  }
  function removePlayer(){
    if(!state.players.length)return;
    const p=state.players.at(-1);
    if(!confirm(`確定要刪除最後一位「${p.name}」嗎？\n這位選手的分數也會刪除。`))return;
    apply(()=>{state.players.pop()});
  }
  $('leftWin').addEventListener('click',()=>battle(0));$('rightWin').addEventListener('click',()=>battle(1));$('otBtn').addEventListener('click',otRound);$('addPlayer').addEventListener('click',addPlayer);$('minusPlayer').addEventListener('click',removePlayer);
  $('undo').addEventListener('click',()=>{if(!history.length)return;state=history.pop();save();render();showToast('已復原上一步')});
  $('resetScores').addEventListener('click',()=>{if(!confirm('確定所有選手分數與場次都歸零？\n晉級者會返回候場名單，名字將保留。'))return;apply(()=>{state.players.push(...state.qualified);state.qualified=[];state.players.forEach(p=>{p.score=0;p.games=0})})});
  $('resetAll').addEventListener('click',()=>{if(!confirm('確定全部重設？\n將恢復 12 位預設選手，所有名稱、順序與分數都會重設。'))return;history.push(clone(state));state=initial();save();render();$('scroller').scrollLeft=0});
  
  $('viewBtn').addEventListener('click',()=>{project=!project;document.body.classList.toggle('project-mode',project);$('viewBtn').textContent=project?'退出投影模式':'投影模式'});
  $('fullBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else showToast('此瀏覽器不支援全螢幕，請使用投影模式')}catch{showToast('瀏覽器未允許全螢幕')}});
  document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'});
  // Only the upper-right handle may reorder. Delay activation to avoid accidental movement on tablets.
  // After activation, slide-to-INSERT moves crossed cards aside one by one.
  const HOLD_MS=200;
  const EARLY_MOVE_TOLERANCE=11;
  let drag=null;
  function startDrag(e){
    if(e.button!==undefined&&e.button!==0)return;
    if(drag)return;
    const handle=e.currentTarget;
    const card=handle.closest('.player');
    if(!card)return;
    e.preventDefault();
    const rect=card.getBoundingClientRect();
    const ghost=card.cloneNode(true);
    ghost.classList.remove('active','winner','selected');ghost.classList.add('drag-ghost');
    Object.assign(ghost.style,{width:rect.width+'px',height:rect.height+'px',left:rect.left+'px',top:rect.top+'px',display:'none'});
    document.body.append(ghost);
    const board=$('board');
    drag={handle,card,board,ghost,id:card.dataset.id,startX:e.clientX,startY:e.clientY,
      lastX:e.clientX,lastY:e.clientY,rect,active:false,pointerId:e.pointerId,timer:null};
    handle.classList.add('holding');handle.textContent='按住…';
    // Capture on the board, which remains stable while cards are reordered.
    board.setPointerCapture(e.pointerId);
    board.addEventListener('pointermove',onMove);
    board.addEventListener('pointerup',endDrag);
    board.addEventListener('pointercancel',endDrag);
    drag.timer=setTimeout(()=>{
      if(!drag||drag.pointerId!==e.pointerId)return;
      drag.active=true;
      drag.card.classList.add('drag-origin');
      drag.handle.classList.remove('holding');drag.handle.classList.add('ready');
      drag.handle.textContent='拖曳中';
      drag.ghost.style.display='flex';
    },HOLD_MS);
  }
  function closestIndex(x,y){
    if(!drag)return -1;
    const cards=[...drag.board.children];let best=-1,dist=Infinity;
    for(let i=0;i<cards.length;i++){
      const r=cards[i].getBoundingClientRect();
      const dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);
      const d=dx*dx+dy*dy;
      if(d<dist){dist=d;best=i}
    }
    return best;
  }
  function onMove(e){
    if(!drag||e.pointerId!==drag.pointerId)return;
    drag.lastX=e.clientX;drag.lastY=e.clientY;
    const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
    if(!drag.active){
      // Sliding before the long press is just an ordinary gesture. Do not reorder.
      if(Math.hypot(dx,dy)>EARLY_MOVE_TOLERANCE)finishDrag(true);
      return;
    }
    drag.ghost.style.left=(drag.rect.left+dx)+'px';
    drag.ghost.style.top=(drag.rect.top+dy)+'px';
    const cards=[...drag.board.children];
    const oldIndex=cards.indexOf(drag.card),nextIndex=closestIndex(e.clientX,e.clientY);
    if(nextIndex<0||oldIndex===nextIndex)return;
    const node=cards[nextIndex];
    if(nextIndex>oldIndex)drag.board.insertBefore(drag.card,node.nextSibling);
    else drag.board.insertBefore(drag.card,node);
    [...drag.board.children].forEach((c,i)=>{c.querySelector('.order').textContent=String(i+1).padStart(2,'0')});
  }
  function finishDrag(cancel){
    if(!drag)return;
    const d=drag;drag=null;
    clearTimeout(d.timer);
    d.board.removeEventListener('pointermove',onMove);
    d.board.removeEventListener('pointerup',endDrag);
    d.board.removeEventListener('pointercancel',endDrag);
    if(d.board.hasPointerCapture?.(d.pointerId))d.board.releasePointerCapture(d.pointerId);
    d.ghost.remove();d.card.classList.remove('drag-origin');
    d.handle.classList.remove('holding','ready');d.handle.textContent='移動';
    if(cancel||!d.active){if(d.active)render();return}
    const ordered=[...d.board.children].map(n=>n.dataset.id);
    if(ordered.every((id,i)=>state.players[i].id===id)){render();return}
    const byId=new Map(state.players.map(p=>[p.id,p]));
    apply(()=>{state.players=ordered.map(id=>byId.get(id))});
    showToast(`已滑動插入第 ${ordered.indexOf(d.id)+1} 位`);
  }
  function endDrag(e){
    if(!drag||e.pointerId!==drag.pointerId)return;
    finishDrag(e.type==='pointercancel');
  }
  render();

  // Countdown is separate from match data. Wall-clock timestamps prevent timer drift
  // when the browser reduces interval frequency or the iPad locks its screen.
  const TIMER_STORAGE_KEY='seven_to_smoke_90min_timer_v1';
  const TIMER_DURATION_MS=90*60*1000;
  let timerRemainingMs=TIMER_DURATION_MS;
  let timerEndTimestamp=null;
  try{
    const saved=JSON.parse(localStorage.getItem(TIMER_STORAGE_KEY));
    if(saved && Number.isFinite(saved.remainingMs) && saved.remainingMs>=0 && saved.remainingMs<=TIMER_DURATION_MS){
      timerRemainingMs=saved.remainingMs;
      if(Number.isFinite(saved.endTimestamp) && saved.endTimestamp>0){
        timerEndTimestamp=saved.endTimestamp;
      }
    }
  }catch{}
  function timeLeftMs(){
    return timerEndTimestamp===null ? timerRemainingMs : Math.max(0,timerEndTimestamp-Date.now());
  }
  function saveTimer(){
    try{localStorage.setItem(TIMER_STORAGE_KEY,JSON.stringify({
      remainingMs:timeLeftMs(),endTimestamp:timerEndTimestamp
    }))}catch{}
  }
  function renderTimer(){
    const remaining=timeLeftMs();
    if(timerEndTimestamp!==null && remaining===0){
      timerRemainingMs=0;timerEndTimestamp=null;
      saveTimer();
      showToast('90 分鐘倒數結束');
    }
    const seconds=Math.ceil(remaining/1000);
    const m=String(Math.floor(seconds/60)).padStart(2,'0');
    const s=String(seconds%60).padStart(2,'0');
    const display=$('timerDisplay');
    display.textContent=m+':'+s;
    display.classList.toggle('ending',seconds<=60);
    $('timerStart').disabled=timerEndTimestamp!==null;
    $('timerPause').disabled=timerEndTimestamp===null;
  }
  $('timerStart').addEventListener('click',()=>{
    if(timerEndTimestamp!==null)return;
    if(timerRemainingMs<=0)timerRemainingMs=TIMER_DURATION_MS;
    timerEndTimestamp=Date.now()+timerRemainingMs;
    saveTimer();renderTimer();
  });
  $('timerPause').addEventListener('click',()=>{
    if(timerEndTimestamp===null)return;
    timerRemainingMs=timeLeftMs();
    timerEndTimestamp=null;
    saveTimer();renderTimer();
  });
  $('timerReset').addEventListener('click',()=>{
    timerEndTimestamp=null;
    timerRemainingMs=TIMER_DURATION_MS;
    saveTimer();renderTimer();
  });
  setInterval(renderTimer,250);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderTimer()});
  renderTimer();
})();
</script>
</body>
