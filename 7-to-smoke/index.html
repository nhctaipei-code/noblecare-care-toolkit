<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151d">
<title>學爽P組五人｜計分板</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1a222c;--panel2:#202b37;--line:#384554;--text:#f3f5f8;--muted:#aebaca;--accent:#68d6c7;--accentbg:rgba(104,214,199,.12);--orange:#efbf71;--danger:#ec9191}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1920px;margin:auto;padding:clamp(16px,2.7vw,40px)}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.heading h1{font-size:clamp(28px,3vw,42px);font-weight:850;letter-spacing:.02em;margin:0}.heading p{margin:5px 0 0;color:var(--muted);font-size:14px}
.header-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.count-pill{font-size:14px;color:var(--muted);padding:9px 15px;border:1px solid var(--line);border-radius:9px}.count-pill strong{font-size:19px;color:var(--text);padding-left:7px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;min-height:40px;padding:8px 14px;font-weight:650;transition:background .12s ease, border-color .12s ease;white-space:nowrap}
.btn:hover:not(:disabled){background:#2a3745;border-color:#647485}.btn.primary{background:var(--accent);border-color:var(--accent);color:#10221f}.btn.primary:hover:not(:disabled){background:#8be3d7}.btn.danger{color:#ffb6b6}.btn.outline{background:transparent}.btn.small{min-height:34px;padding:5px 10px;font-size:14px}.btn.icon-btn{min-width:40px;padding:7px 10px}
.section-label{display:flex;gap:12px;align-items:center;margin:0 0 14px}.section-label h2{font-size:18px;margin:0;font-weight:750}.section-label span{color:var(--muted);font-size:13px}
.battle-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:26px}
.battle-row{display:grid;grid-template-columns:1fr 76px 1fr;gap:12px;align-items:stretch}
.competitor{min-width:0;background:var(--panel2);border:1px solid #41505d;border-radius:11px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.competitor .role{color:var(--muted);font-size:13px}.competitor .battle-name{font-size:clamp(20px,2.2vw,32px);font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.competitor .battle-score{font-size:clamp(32px,3vw,48px);font-weight:850;line-height:1}.competitor .score-sub{font-size:14px;color:var(--muted)}
.vs{display:flex;align-items:center;justify-content:center;font-size:clamp(20px,2.2vw,28px);font-weight:850;color:#bdc7d1}
.battle-actions{display:flex;justify-content:center;gap:10px;margin-top:6px}.battle-actions .btn{min-width:128px;min-height:42px}
.champion{display:none;border:1px solid var(--accent);background:var(--accentbg);color:#c5fff5;padding:15px;border-radius:10px;text-align:center;font-size:clamp(17px,2vw,23px);font-weight:750;margin-bottom:16px}.champion.show{display:block}
.board-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.board-header .section-label{margin:0}.board-ctrl{display:flex;gap:8px}
.board-scroller{overflow-x:auto;overflow-y:hidden;scrollbar-color:#526573 transparent;scrollbar-width:thin;scroll-behavior:smooth;padding:6px 3px 18px;overscroll-behavior-x:contain}
.board{display:flex;gap:12px;align-items:stretch;min-width:max-content;padding:2px}
.player{--w:130px;position:relative;flex:0 0 var(--w);width:var(--w);min-height:245px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 11px;display:flex;flex-direction:column;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.player.active{border-color:var(--accent);background:#1e3035}.player.active::after{content:"對戰中";position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:2px 8px;border-radius:5px;background:var(--accent);color:#10201e;font-size:11px;font-weight:800;white-space:nowrap}
.player.winner{border-color:var(--orange)}.player.drag-origin{opacity:.32}.player.drop-target{outline:3px solid var(--accent);outline-offset:2px}
.player-top{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:28px}.order{font-size:14px;color:var(--muted);font-weight:800}.grip{border:0;background:transparent;color:#a7b7c4;cursor:grab;font-size:23px;letter-spacing:-2px;line-height:1;border-radius:5px;width:34px;height:30px;touch-action:none;display:flex;align-items:center;justify-content:center}.grip:active{cursor:grabbing}.grip:hover{background:var(--panel2);color:white}
.avatar{width:46px;height:46px;background:#344453;border-radius:50%;display:grid;place-items:center;color:#e2eaf0;font-size:19px;font-weight:780;flex-shrink:0}
.pname{width:100%;min-height:33px;display:flex;align-items:center;justify-content:center;gap:3px;text-align:center}.name-text{font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;min-width:0}.rename{background:none;color:var(--muted);border:0;border-radius:5px;padding:2px 3px;font-size:13px;flex-shrink:0}.rename:hover{background:var(--panel2);color:white}
.seven-bars{display:flex;flex-direction:column;gap:5px;width:100%;padding:0 3px}.bar{height:8px;border-radius:999px;background:#3b4956}.bar.filled{background:var(--accent)}
.p-score{font-size:27px;font-weight:850;line-height:1.15}.scorer{display:flex;gap:6px;width:100%;justify-content:center;margin-top:auto}.scorer button{height:32px;flex:1;padding:2px;min-width:0;font-size:18px}
.hint{color:var(--muted);font-size:13px;margin:7px 0 21px}.admin{padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.admin-label{font-size:15px;font-weight:750;white-space:nowrap}.admin-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.admin-group .label{font-size:13px;color:var(--muted);margin-right:2px}.count-number{font-weight:850;min-width:35px;text-align:center;font-size:19px}.separator{height:31px;width:1px;background:var(--line)}.footnote{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}
.drag-ghost{position:fixed!important;margin:0!important;pointer-events:none!important;z-index:9999;opacity:.94;box-shadow:0 14px 34px rgba(0,0,0,.6);border-color:var(--accent);transform:scale(1.045)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border:1px solid var(--line);background:#2c3946;color:white;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .22s;z-index:10000;max-width:90vw;text-align:center}.toast.visible{opacity:1}
.project-mode .admin,.project-mode .hint,.project-mode .scorer,.project-mode .grip,.project-mode .rename,.project-mode .board-ctrl,.project-mode .footnote,.project-mode .battle-actions{display:none!important}
.project-mode .player{min-height:205px}.project-mode .pname{min-height:34px}
@media(min-width:1100px){.player{--w:clamp(125px,7.55vw,152px)}.player{min-height:258px}}
@media(max-width:680px){.wrap{padding:16px}.header{margin-bottom:15px}.heading h1{font-size:27px}.battle-box{padding:14px;margin-bottom:23px}.battle-row{grid-template-columns:minmax(0,1fr) 31px minmax(0,1fr);gap:6px}.competitor{padding:14px 7px;gap:8px}.competitor .battle-name{font-size:19px}.competitor .battle-score{font-size:33px}.vs{font-size:19px}.battle-actions .btn{min-width:0;flex:1;font-size:13px;padding:9px 6px}.section-label span{display:none}.admin{gap:12px}.separator{display:none}.player{--w:130px}}
@media(prefers-reduced-motion:reduce){.btn,.toast,.board-scroller{transition:none;scroll-behavior:auto}}

/* Tablet-first 4 × 3 scoreboard: all 12 cards stay visible without horizontal scrolling. */
.wrap{max-width:1500px;padding:12px 20px}
.header{margin-bottom:10px;flex-wrap:nowrap}.heading h1{font-size:clamp(23px,3.3vw,35px)}
.count-pill{padding:5px 11px}.header-right .btn{min-height:35px;padding:6px 10px}
.battle-box{padding:10px 14px;margin-bottom:12px}
.section-label{margin-bottom:8px}.section-label h2{font-size:16px}
.battle-row{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:9px}
.competitor{padding:7px 10px;gap:3px}.competitor .battle-name{font-size:clamp(18px,2vw,25px)}
.competitor .battle-score{font-size:clamp(23px,2.8vw,34px)}.competitor .score-sub{display:none}
.battle-actions{margin-top:7px}.battle-actions .btn{min-height:34px;padding:5px 12px}
.board-header{margin-bottom:8px}.board-scroller{overflow:visible;padding:2px 2px 3px;scroll-behavior:auto}
.board{min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:1px}
.player,.project-mode .player{--w:auto;min-width:0;width:100%;min-height:0;height:clamp(125px,18vh,153px);flex:none;padding:7px 11px;gap:4px;touch-action:none;-webkit-tap-highlight-color:transparent}
.player.active::after{top:-7px;font-size:9px;padding:1px 6px}
.player.selected{outline:3px solid var(--orange);outline-offset:-3px;background:#3b3225}
.player-top{min-height:17px;height:17px}.order{font-size:13px}.grip{font-size:11px;letter-spacing:0;width:auto;min-width:50px;height:22px;padding:0 7px;background:#2b3947;border-radius:5px;color:#e1e8f0;cursor:grab}
.avatar{display:none}.pname{min-height:22px;height:22px}.name-text{font-size:clamp(13px,1.8vw,17px)}.rename{font-size:16px}
.seven-bars{flex-direction:row;gap:5px;width:100%;padding:0}.bar{flex:1;min-width:0;height:9px}
.p-score{font-size:27px;line-height:1.05}.scorer{margin-top:auto;gap:9px}.scorer button{height:30px;min-height:30px;font-size:19px}
.hint{margin:5px 0 9px;font-size:12px}.admin{padding:9px 12px;gap:10px}.footnote{margin-top:6px;font-size:11px}
.drag-ghost{max-width:380px}.drag-ghost .grip{pointer-events:none}
.project-mode .player{height:clamp(120px,20vh,170px)}
@media(min-width:700px) and (max-height:850px){
 .wrap{padding:8px 18px}.header{margin-bottom:7px}.battle-box{padding:8px 12px;margin-bottom:8px}
 .battle-actions{margin-top:5px}.board-header{margin-bottom:5px}.player{height:clamp(117px,16vh,133px);gap:2px;padding:5px 10px}.player-top{min-height:16px;height:16px}.pname{min-height:20px;height:20px}.p-score{font-size:24px}.scorer button{height:28px;min-height:28px}
 .hint{margin:3px 0 6px}.footnote{display:none}.admin{padding:6px 10px}
}
@media(max-width:760px){
 .wrap{padding:10px}.header{flex-wrap:wrap;gap:8px}.heading h1{font-size:24px}
 .board{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .player{height:140px;padding:7px 5px}.name-text{font-size:13px}
 .battle-row{grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:5px}
 .competitor{padding:8px 5px}.competitor .battle-name{font-size:17px}.competitor .battle-score{font-size:24px}
 .battle-actions .btn{font-size:12px}.section-label span{display:inline;font-size:11px}
 .admin{gap:8px}.admin-label{display:none}
}
@media(max-width:420px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.player{height:136px}.header-right{gap:5px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="header">
    <div class="heading"><h1>學爽P組五人</h1></div>
    <div class="header-right"><div class="count-pill">選手人數 <strong id="total">12</strong></div><button id="viewBtn" class="btn outline">投影模式</button><button id="fullBtn" class="btn outline">全螢幕</button></div>
  </header>
  <div class="champion" id="champion" role="status" aria-live="polite"></div>
  <section class="battle-box" aria-label="目前對戰">
    <div class="section-label"><h2>目前對戰</h2><span>第一位為守擂者，第二位為挑戰者</span></div>
    <div class="battle-row">
      <div class="competitor"><div class="role">守擂者 · 第 1 位</div><div class="battle-name" id="leftName">選手 01</div><div class="battle-score" id="leftScore">0</div><div class="score-sub">勝場</div></div>
      <div class="vs">VS</div>
      <div class="competitor"><div class="role">挑戰者 · 第 2 位</div><div class="battle-name" id="rightName">選手 02</div><div class="battle-score" id="rightScore">0</div><div class="score-sub">勝場</div></div>
    </div>
    <div class="battle-actions"><button class="btn primary" id="leftWin">左方勝出 ＋1</button><button class="btn primary" id="rightWin">右方勝出 ＋1</button></div>
  </section>
  <section aria-label="所有選手">
    <div class="board-header"><div class="section-label"><h2>選手順序與分數</h2><span>直接點兩位選手即可交換，也可按住卡片拖曳</span></div></div>
    <div class="board-scroller" id="scroller" aria-label="所有選手，平板四欄三列顯示"><div class="board" id="board"></div></div>
    <div class="hint">交換順序：依序點選兩張選手卡片，或按住卡片拖到另一張上方。點「✎」可改名。</div>
  </section>
  <section class="admin" aria-label="管理功能">
    <div class="admin-label">管理設定</div>
    <div class="admin-group"><span class="label">參賽人數</span><button class="btn small icon-btn" id="minusPlayer" aria-label="減少一位選手">−</button><span class="count-number" id="countText">12</span><button class="btn small icon-btn" id="addPlayer" aria-label="增加一位選手">＋</button></div>
    <div class="separator"></div>
    <div class="admin-group"><button id="undo" class="btn small">↶ 復原上一步</button><button id="resetScores" class="btn small">分數歸零</button><button id="resetAll" class="btn small danger">全部重設</button></div>
  </section>
  <p class="footnote">規則：按「勝出」後，勝者保留在最前方、敗者移到隊伍最後，下一位選手自動遞補挑戰。先拿到 7 勝者獲勝。要交換順序可直接連點兩張卡片；也可以使用每張卡的＋／−修正分數。所有資料會自動儲存在這台裝置的瀏覽器中。</p>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY='seven_to_smoke_minimal_v1';
  const MAX_PLAYERS=40;
  const $=id=>document.getElementById(id);
  const initial=()=>({players:Array.from({length:12},(_,i)=>({id:'p'+(i+1),name:'選手 '+String(i+1).padStart(2,'0'),score:0})),nextId:13,championId:null});
  function load(){try{const obj=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!obj||!Array.isArray(obj.players)||obj.players.length<2||obj.players.length>MAX_PLAYERS)return initial();const seen=new Set();for(const p of obj.players){if(!p||typeof p.id!=='string'||seen.has(p.id)||typeof p.name!=='string'||!Number.isInteger(p.score)||p.score<0||p.score>7)return initial();seen.add(p.id)}return {players:obj.players,nextId:Number.isInteger(obj.nextId)?obj.nextId:13,championId:obj.championId??null}}catch{return initial()}}
  let state=load(),history=[],project=false,toastTimer,selectedId=null;
  const clone=v=>JSON.parse(JSON.stringify(v));
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{showToast('瀏覽器無法儲存資料，請勿關閉頁面')}}
  function apply(fn){history.push(clone(state));if(history.length>50)history.shift();fn();syncChampion();save();render()}
  function syncChampion(){if(state.championId&&!state.players.some(p=>p.id===state.championId&&p.score>=7))state.championId=null;if(!state.championId){let p=state.players.find(p=>p.score>=7);if(p)state.championId=p.id}}
  function showToast(message){const t=$('toast');t.textContent=message;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2500)}
  function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
  function nameInitial(name){return name.trim().slice(0,1)||'人'}
  function makePlayer(p,index){
    const card=el('div','player'+(index<2?' active':'')+(state.championId===p.id?' winner':'')+(selectedId===p.id?' selected':''));card.dataset.id=p.id;card.addEventListener('pointerdown',startDrag);
    const top=el('div','player-top');top.append(el('span','order',String(index+1).padStart(2,'0')));
    const grip=el('button','grip','移動');grip.type='button';grip.title='點選兩名選手交換，或按住拖曳';grip.setAttribute('aria-label',`移動 ${p.name} 的順序，使用方向鍵可向左右交換`);grip.dataset.dragId=p.id;grip.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const offset=e.key==='ArrowLeft'?-1:1,idx=state.players.findIndex(x=>x.id===p.id),other=idx+offset;if(other>=0&&other<state.players.length){apply(()=>swap(idx,other));requestAnimationFrame(()=>{const b=document.querySelector(`[data-drag-id="${CSS.escape(p.id)}"]`);b?.focus();b?.scrollIntoView({block:'nearest',inline:'nearest'})})}}});
    top.append(grip);card.append(top);
    card.append(el('div','avatar',nameInitial(p.name)));
    const name=el('div','pname');const label=el('div','name-text',p.name);label.title=p.name;name.append(label);
    const rename=el('button','rename','✎');rename.title=`修改 ${p.name} 的名字`;rename.setAttribute('aria-label',rename.title);rename.addEventListener('click',()=>renamePlayer(p.id));name.append(rename);card.append(name);
    const bars=el('div','seven-bars');bars.setAttribute('aria-label',`7 格分數，目前 ${p.score} 勝`);
    for(let i=0;i<7;i++)bars.append(el('div','bar'+(i<p.score?' filled':'')));card.append(bars);
    card.append(el('div','p-score',String(p.score)));
    const controls=el('div','scorer');const minus=el('button','btn small','−'),plus=el('button','btn small','＋');minus.title=`${p.name} 減一分`;plus.title=`${p.name} 加一分`;minus.setAttribute('aria-label',minus.title);plus.setAttribute('aria-label',plus.title);minus.disabled=p.score===0;plus.disabled=p.score>=7;minus.addEventListener('click',()=>changeScore(p.id,-1));plus.addEventListener('click',()=>changeScore(p.id,1));controls.append(minus,plus);card.append(controls);
    return card;
  }
  function render(){
    $('total').textContent=state.players.length;$('countText').textContent=state.players.length;
    $('minusPlayer').disabled=state.players.length<=2;$('addPlayer').disabled=state.players.length>=MAX_PLAYERS;$('undo').disabled=history.length===0;
    const [a,b]=state.players; $('leftName').textContent=a.name;$('rightName').textContent=b.name;$('leftScore').textContent=a.score;$('rightScore').textContent=b.score;
    $('leftWin').disabled=!!state.championId;$('rightWin').disabled=!!state.championId;
    const c=$('champion');if(state.championId){const winner=state.players.find(p=>p.id===state.championId);c.textContent=winner?`冠軍：${winner.name}（7 勝）`:'本場比賽已結束';c.classList.add('show')}else{c.textContent='';c.classList.remove('show')}
    const holder=$('board'),previousX=$('scroller').scrollLeft;const fragment=document.createDocumentFragment();state.players.forEach((p,i)=>fragment.append(makePlayer(p,i)));holder.replaceChildren(fragment);$('scroller').scrollLeft=previousX;
  }
  function swap(i,j){[state.players[i],state.players[j]]=[state.players[j],state.players[i]]}
  function renamePlayer(id){const p=state.players.find(p=>p.id===id);if(!p)return;const text=prompt('請輸入選手名稱（最多 24 字）',p.name);if(text===null)return;const next=text.trim().slice(0,24);if(!next){showToast('名稱不能空白');return}if(next===p.name)return;apply(()=>{p.name=next})}
  function changeScore(id,amount){const p=state.players.find(p=>p.id===id);if(!p)return;if(state.championId&&amount>0){showToast('比賽已結束。如需修正請先扣除冠軍分數');return}const score=Math.max(0,Math.min(7,p.score+amount));if(score===p.score)return;apply(()=>{p.score=score;if(score>=7)state.championId=p.id})}
  function battle(winningIndex){if(state.championId)return;apply(()=>{const winner=state.players[winningIndex];winner.score=Math.min(7,winner.score+1);if(winningIndex===0){const loser=state.players.splice(1,1)[0];state.players.push(loser)}else{const loser=state.players.shift();state.players.push(loser)}if(winner.score===7)state.championId=winner.id})}
  function addPlayer(){if(state.players.length>=MAX_PLAYERS){showToast('最多 40 位選手');return}apply(()=>{const n=state.nextId++;state.players.push({id:'p'+n,name:'選手 '+String(n).padStart(2,'0'),score:0})});$('scroller').scrollTo({left:$('scroller').scrollWidth,behavior:'smooth'})}
  function removePlayer(){if(state.players.length<=2)return;const p=state.players.at(-1);if(!confirm(`確定要移除最後一位「${p.name}」嗎？\n已累積的分數也會一併移除。`))return;apply(()=>{state.players.pop()})}
  $('leftWin').addEventListener('click',()=>battle(0));$('rightWin').addEventListener('click',()=>battle(1));$('addPlayer').addEventListener('click',addPlayer);$('minusPlayer').addEventListener('click',removePlayer);
  $('undo').addEventListener('click',()=>{if(!history.length)return;state=history.pop();save();render();showToast('已復原上一步')});
  $('resetScores').addEventListener('click',()=>{if(!confirm('確定所有選手分數歸零？\n名字與目前排列順序會保留。'))return;apply(()=>{state.players.forEach(p=>p.score=0);state.championId=null})});
  $('resetAll').addEventListener('click',()=>{if(!confirm('確定全部重設？\n將恢復 12 位預設選手，所有名稱、順序與分數都會重設。'))return;history.push(clone(state));state=initial();save();render();$('scroller').scrollLeft=0});
  
  $('viewBtn').addEventListener('click',()=>{project=!project;document.body.classList.toggle('project-mode',project);$('viewBtn').textContent=project?'退出投影模式':'投影模式'});
  $('fullBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else showToast('此瀏覽器不支援全螢幕，請使用投影模式')}catch{showToast('瀏覽器未允許全螢幕')}});
  document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'});
   // Touch-friendly interaction: tap two cards to swap, or drag a card onto another.
   let drag=null;
   function startDrag(e){
     if(e.button!==undefined&&e.button!==0)return;
     if(e.target.closest('.rename,.scorer'))return;
     const card=e.currentTarget;if(!card.classList.contains('player'))return;
     e.preventDefault();
     const rect=card.getBoundingClientRect();const ghost=card.cloneNode(true);
     ghost.classList.remove('active','winner','selected');ghost.classList.add('drag-ghost');
     Object.assign(ghost.style,{width:rect.width+'px',height:rect.height+'px',left:rect.left+'px',top:rect.top+'px',display:'none'});
     document.body.append(ghost);
     drag={handle:card,card,ghost,id:card.dataset.id,startX:e.clientX,startY:e.clientY,rect,targetId:null,moving:false};
     card.setPointerCapture(e.pointerId);
     card.addEventListener('pointermove',onMove);card.addEventListener('pointerup',endDrag);card.addEventListener('pointercancel',endDrag);
   }
   function findTarget(x,y){
     if(!drag)return;
     document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));
     const target=document.elementFromPoint(x,y)?.closest('.player');
     drag.targetId=target&&target!==drag.card?target.dataset.id:null;
     if(target&&target!==drag.card)target.classList.add('drop-target');
   }
   function onMove(e){
     if(!drag)return;
     const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
     if(!drag.moving&&Math.hypot(dx,dy)<9)return;
     if(!drag.moving){drag.moving=true;drag.card.classList.add('drag-origin');drag.ghost.style.display='flex'}
     drag.ghost.style.left=(drag.rect.left+dx)+'px';drag.ghost.style.top=(drag.rect.top+dy)+'px';
     findTarget(e.clientX,e.clientY);
   }
   function endDrag(e){
     if(!drag)return;
     const d=drag;
     d.handle.removeEventListener('pointermove',onMove);
     d.handle.removeEventListener('pointerup',endDrag);
     d.handle.removeEventListener('pointercancel',endDrag);
     d.ghost.remove();d.card.classList.remove('drag-origin');
     document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));
     drag=null;
     if(e.type==='pointercancel')return;
     if(!d.moving){
       if(selectedId===d.id){selectedId=null;render();showToast('已取消選取');return}
       if(!selectedId){selectedId=d.id;render();showToast('已選取，請點另一位選手交換');return}
       const a=state.players.findIndex(p=>p.id===selectedId),b=state.players.findIndex(p=>p.id===d.id);
       selectedId=null;if(a>=0&&b>=0&&a!==b){apply(()=>swap(a,b));showToast('已交換選手位置')}else render();return;
     }
     selectedId=null;
     if(!d.targetId||d.id===d.targetId){render();return}
     const from=state.players.findIndex(p=>p.id===d.id),to=state.players.findIndex(p=>p.id===d.targetId);
     if(from<0||to<0){render();return}
     apply(()=>swap(from,to));showToast('已交換選手位置');
   }
  syncChampion();render();
})();
</script>
