<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>居服員專業資料庫｜照顧・復能運動・異常事件・法律</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#12343B; --ink2:#4A6168; --line:#DCE4E2;
  --care:#028090; --move:#C7791A; --event:#D8432A; --law:#2B5F8C;
  --accent:#E8552D; --amber:#F4A93C;
  --shadow:0 1px 0 rgba(18,52,59,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1F24; --surface:#17292F; --ink:#EEF3F2; --ink2:#A9BBC0; --line:#2B3E45;
    --care:#3FB7C4; --move:#E7A34A; --event:#F26A4F; --law:#6FA5D6;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1F24; --surface:#17292F; --ink:#EEF3F2; --ink2:#A9BBC0; --line:#2B3E45;
  --care:#3FB7C4; --move:#E7A34A; --event:#F26A4F; --law:#6FA5D6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:18px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:26px;border-radius:3px;background:linear-gradient(180deg,var(--care) 0 25%,var(--move) 25% 50%,var(--event) 50% 75%,var(--law) 75%)}
.search{flex:1;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;gap:8px}
.search input{flex:1;border:0;background:transparent;font-size:16px;color:var(--ink);min-width:0}
.search input:focus{outline:0}
.search button{border:0;background:transparent;color:var(--ink2);padding:0 4px;font-size:18px}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:15px;white-space:nowrap}

/* nav */
.nav{max-width:1100px;margin:0 auto;padding:10px 16px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav button .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.nav button[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.nav button[aria-current="true"] .dot{background:#fff}

main{max-width:1100px;margin:0 auto;padding:16px 16px 100px}

/* home */
.hero{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0 22px}
.hero h1{font-size:clamp(26px,5vw,38px);line-height:1.2;margin:0;font-weight:900;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink2);font-size:16px;max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{position:relative;display:block;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:14px solid var(--c);border-radius:14px;padding:18px 18px 16px;min-height:150px;transition:transform .12s}
.tile:active{transform:scale(.985)}
.tile .n{font-size:44px;font-weight:900;line-height:1;color:var(--c)}
.tile .n small{font-size:14px;font-weight:700;color:var(--ink2);margin-left:6px}
.tile h2{margin:6px 0 4px;font-size:22px;font-weight:900}
.tile p{margin:0;color:var(--ink2);font-size:15px}
.tile .cats{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tile .cats span{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.strip{margin-top:22px;background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.strip h3{margin:0;font-size:17px}
.strip ol{margin:0;padding-left:22px;display:grid;gap:4px;font-size:15px}
:root[data-theme="dark"] .strip, :root:not([data-theme="light"]) .strip{background:#1F3A42}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .strip{background:var(--ink)} }

/* db view */
.dbhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 12px;padding-left:14px;border-left:8px solid var(--c)}
.dbhead h1{margin:0;font-size:26px;font-weight:900}
.dbhead p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;margin-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .chips button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#0F1F24}
.count{color:var(--ink2);font-size:14px;margin:0 0 10px}
.list{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:860px){ .list{grid-template-columns:1fr 1fr} .list .card[open]{grid-column:1/-1} }

/* entry card */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.card summary{list-style:none;cursor:pointer;padding:14px 16px 14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.card summary::-webkit-details-marker{display:none}
.card .bar{width:6px;border-radius:3px;background:var(--c);align-self:stretch}
.card .ttl{font-weight:900;font-size:18px;line-height:1.35}
.card .sub{color:var(--ink2);font-size:15px;margin-top:2px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card .meta span{font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.card .meta span.db{color:var(--c);border-color:var(--c)}
.card .tog{color:var(--ink2);font-size:22px;line-height:1;transition:transform .2s}
.card[open] .tog{transform:rotate(45deg)}
.body{padding:0 16px 16px 16px;border-top:1px dashed var(--line)}
.sec{margin-top:14px}
.sec h4{margin:0 0 6px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px;color:var(--ink)}
.sec h4::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.sec.why h4::before{background:var(--ink2)}
.sec.no h4::before{background:var(--event)}
.sec.rep h4::before{background:var(--amber)}
.sec.ref h4::before{background:var(--law)}
.sec ol,.sec ul{margin:0;padding-left:22px;display:grid;gap:5px;font-size:16px}
.sec p{margin:0;font-size:16px}
.sec.why p{color:var(--ink2)}
.ask{margin-top:14px;background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.ask b{font-size:14px;color:var(--ink2)}
.ask p{margin:0;font-size:15.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14.5px;font-weight:700}
.acts button.on{background:var(--amber);border-color:var(--amber);color:#12343B}
.empty{padding:40px 16px;text-align:center;color:var(--ink2);background:var(--surface);border:1.5px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* AI tab */
.ai{display:grid;gap:14px}
.ai .card{padding:16px}
.ai h2{margin:0 0 6px;font-size:20px}
.ai p{margin:0 0 8px;font-size:16px}
.ai ul{margin:0;padding-left:22px;display:grid;gap:5px}
.tpl{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.tpl h3{margin:0 0 6px;font-size:16px}
.tpl pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.6;color:var(--ink)}
.tpl button{margin-top:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700}

/* hotline */
.hot{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:20}
.hot a{text-decoration:none;font-weight:900;font-size:14px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line)}
.hot a.e{background:var(--event);border-color:var(--event);color:#fff}
.hot a small{font-weight:500;color:inherit;opacity:.8;margin-left:4px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
.note{font-size:13.5px;color:var(--ink2);margin-top:22px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.nav,.hot,.acts,.ask,.chips{display:none!important}
  body{background:#fff;color:#000} .card{break-inside:avoid;border-color:#999}
  .card summary{grid-template-columns:auto 1fr} .card .tog{display:none}
  .body{display:block!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="brand" id="home" style="border:0;background:transparent;padding:0" aria-label="回首頁"><i></i>居服員專業資料庫</button>
    <label class="search" for="q">
      <span aria-hidden="true">🔎</span>
      <input id="q" type="search" placeholder="搜尋四個資料庫：跌倒、灌食、性騷擾、坐站…" autocomplete="off">
      <button id="clear" aria-label="清除搜尋" hidden>✕</button>
    </label>
    <button class="icon-btn" id="theme" aria-label="切換深淺色">🌙</button>
  </div>
  <nav class="nav" id="nav" aria-label="資料庫"></nav>
</header>

<main id="main"></main>

<div class="hot" aria-label="緊急與求助電話">
  <a class="e" href="tel:119">119<small>救護</small></a>
  <a href="tel:110">110<small>警察</small></a>
  <a href="tel:113">113<small>保護專線</small></a>
  <a href="tel:1966">1966<small>長照專線</small></a>
  <a href="tel:1955">1955<small>勞工諮詢</small></a>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 資料庫定義 ===================== */
const DBS = [
 {id:'care', name:'照顧', full:'照顧網頁資料庫', color:'var(--care)', icon:'🤲',
  desc:'日常身體照顧的正確做法、順序、禁忌與該通報的時機。',
  cats:['移位與擺位','清潔與皮膚','口腔照護','飲食與吞嚥','生活協助','排泄與管路','用藥與觀察','失智與溝通','外出與陪伴','環境與安全']},
 {id:'move', name:'復能運動', full:'復能運動活動網頁資料庫', color:'var(--move)', icon:'🏃',
  desc:'把復能帶進日常：不代勞的協助方式、可在家做的運動，以及運動前後的安全把關。',
  cats:['復能原則','肌力','平衡與步行','床上活動','生活功能訓練','認知與口腔','安全與監測']},
 {id:'event', name:'異常事件', full:'異常事件處理網頁資料庫', color:'var(--event)', icon:'🚨',
  desc:'現場先做什麼、什麼不能做、何時打 119、怎麼通報與記錄。',
  cats:['通報流程','跌倒與外傷','急症','管路與用藥','行為與拒絕','環境與人身','特殊事件']},
 {id:'law', name:'法律問題', full:'法律問題網頁資料庫', color:'var(--law)', icon:'⚖️',
  desc:'不法侵害、性騷擾、通報責任、個資、服務界線、金錢往來、責任與勞動權益。',
  cats:['不法侵害與性騷擾','通報責任','個資與隱私','服務界線','金錢與財產','責任與免責','勞動權益']},
];

/* ===================== 資料內容 =====================
   欄位：db, cat, t 標題, s 一句摘要, tags, why 情境, steps 怎麼做, no 不要做, rep 通報轉介, ref 依據, ask 問 AI
*/
const E = [];
const add = (o)=>E.push(o);

/* ---------- 照顧 ---------- */
add({db:'care',cat:'移位與擺位',t:'翻身與擺位',s:'臥床者至少每 2 小時翻身一次，側臥 30 度，骨突處要減壓。',tags:['翻身','壓傷','擺位','BA10'],
why:'長時間壓在同一部位，2 小時內就可能出現壓傷前兆；翻身是最便宜、最有效的壓傷預防。',
steps:['先告訴案主要做什麼，確認床欄拉起、床高適合你的腰。','用中單或翻身巾整片移動身體，不要拖拉皮膚。','側臥採 30 度（不要 90 度正側躺），背後放長枕支撐，兩膝間、兩踝間放軟枕。','床頭抬高盡量不超過 30 度，避免身體下滑造成剪力（進食時除外）。','翻身後看骶骨、髖骨、足跟、肩胛、耳朵：是否發紅、按了不變白。','記錄翻身時間與皮膚狀況。'],
no:['不要直接拉手臂或腳踝翻身。','不要讓鼻胃管、尿管壓在身體下面。','不要用甜甜圈型座墊，會讓中央更缺血。','發紅按壓不褪色，不要按摩該處。'],
rep:'皮膚出現不褪色紅斑、水泡、破皮 → 當日通報督導，請單位轉介居家護理評估。',
ref:'衛福部壓傷預防原則；長照給付及支付基準 BA10 翻身拍背。',
ask:'我照顧的案主臥床、側臥 30 度後仍抱怨髖部痛，還可以怎麼調整枕頭位置？'});

add({db:'care',cat:'移位與擺位',t:'床與輪椅之間移位',s:'先鎖煞車、翹腳踏板、綁移位腰帶，用「站—轉—坐」而不是用抱的。',tags:['移位','輪椅','轉位','腰帶'],
why:'移位是居服員腰傷與案主跌倒最常發生的時刻。九成意外來自沒鎖煞車、沒收腳踏板、或抱起來時腰用力。',
steps:['輪椅停在案主好側、與床成 30–45 度，鎖煞車、翹起或拆掉腳踏板、移開扶手。','案主先坐床緣，雙腳平放地面、屁股靠床緣，觀察 30 秒有沒有頭暈。','幫案主綁移位腰帶，你抓腰帶不抓衣服；你的雙腳一前一後、膝蓋微彎。','口令「一、二、三，起」，讓案主用手推床面、身體前傾，站起後以腳為軸轉身。','確認膝後碰到輪椅座面再慢慢坐下，扶正臀部，放回腳踏板。'],
no:['不要抓腋下往上拉（會拉傷肩關節）。','不要在案主頭暈、血壓還沒穩時移位。','不要一個人移位完全無法承重又超過自己體重的案主，改用移位板或兩人協助。'],
rep:'移位過程中案主疼痛、跌坐、或你自己閃到腰 → 依異常事件流程通報，並記錄。',
ref:'衛福部照顧服務員訓練教材：移位技巧；職業安全衛生法雇主應提供安全作業方法。',
ask:'案主偏癱、只有一側能用力，床到輪椅移位時輪椅應該放在哪一側，步驟怎麼改？'});

add({db:'care',cat:'清潔與皮膚',t:'沐浴與皮膚觀察',s:'水溫 38–40℃，先沖你的手腕再沖案主，洗完擦乾皺褶處，同時「看皮膚」。',tags:['沐浴','洗澡','皮膚','水溫','BA07'],
why:'沐浴是唯一能完整看到全身皮膚的機會，也是燙傷與跌倒的高風險時段。',
steps:['先關窗、開暖氣或熱風，浴室鋪防滑墊，備好毛巾與換洗衣物再開始。','水溫 38–40℃，用自己手腕內側試溫；糖尿病與感覺遲鈍的案主一律用溫度計。','順序：臉→上肢→軀幹→下肢→背部→會陰→臀部，由乾淨處往骯髒處。','洗的同時看：骨突處紅斑、腳趾間潰爛、腋下與腹股溝濕疹、不明瘀青。','洗完 3 分鐘內擦乾並保暖，皺褶處（乳下、腹股溝、腳趾間）要完全乾。','乾燥處薄擦乳液；不要抹在腳趾間。'],
no:['不要讓案主獨自站著沖水；站姿沐浴要有扶手或沐浴椅。','不要用太熱的水泡腳「促進循環」，糖尿病足會燙傷而不自知。','發現不明瘀青、指印狀傷痕，不要追問責備，先記錄。'],
rep:'新出現的傷口、水泡、不明瘀青、腳趾間潰爛 → 當日通報督導；懷疑不當對待依通報責任處理。',
ref:'照顧服務員訓練課程：身體清潔；長照給付及支付基準 BA07 協助沐浴及洗頭。',
ask:'案主拒絕洗澡、一提到洗澡就生氣，有什麼不強迫的引導方法？'});

add({db:'care',cat:'口腔照護',t:'口腔清潔總則（含禁食與管灌者）',s:'每天至少早晚各一次，含牙齦、舌頭與口腔黏膜；假牙睡前拿下泡水。',tags:['口腔','假牙','刷牙','肺炎'],
why:'口腔細菌被吞入或吸入是長者吸入性肺炎的主因之一，口腔清潔就是在預防肺炎。',
steps:['案主坐起或床頭抬高 30 度以上，頭偏一側，脖子圍毛巾。','軟毛牙刷沾少量水或含氟牙膏，刷牙齒、牙齦、舌頭；黏膜用海綿棒或紗布擦拭。','鼻胃管或禁食的案主一樣要清潔，用棉棒沾水少量、每次擰乾，避免嗆入。','假牙：用假牙刷與清水（或假牙清潔錠）刷洗，睡前取下泡清水，不要泡熱水。','清潔時觀察：口臭、白斑、潰瘍、牙齦出血、假牙鬆脫磨破。'],
no:['不要用力刷牙齦已萎縮、容易出血的案主，改用海綿棒。','不要讓案主躺平清潔口腔。','不要用漱口水代替刷牙。'],
rep:'口腔潰瘍超過 2 週不癒、白斑、假牙磨破 → 通報督導，建議家屬安排牙科。',
ref:'照顧服務員訓練課程：口腔照護；衛福部口腔健康指引。',
ask:'案主咬緊牙關不讓我刷牙，有什麼安全打開口腔或替代清潔的方式？'});

add({db:'care',cat:'清潔與皮膚',t:'壓傷的分期辨識',s:'一期是「按了不變白」的紅斑；一旦有破皮或水泡就是二期以上，一律通報。',tags:['壓傷','褥瘡','分期','皮膚'],
why:'居服員是最常看到皮膚的人，看得懂分期才知道什麼時候是「還能靠翻身逆轉」、什麼時候「一定要護理介入」。',
steps:['一期：皮膚完整，但出現按壓不褪色的紅斑（深膚色者看不出紅，可能是紫色或觸感較硬較熱）→ 加強減壓、翻身、當日通報。','二期：表皮破損、淺層潰瘍、或水泡 → 不要弄破水泡，通報並請護理評估。','三期：全層皮膚缺損，可看到皮下脂肪 → 通報，護理處置。','四期：深達肌肉、肌腱或骨頭 → 通報，需醫療處置。','無法分期／深部組織損傷：被黑痂覆蓋或呈紫黑色 → 通報。','每次清潔、翻身、換尿布都用眼睛掃過骶骨、髖、足跟、坐骨。'],
no:['不要自行使用偏方、藥膏或消毒水塗傷口。','不要按摩發紅處。','不要把有傷口的部位繼續當受壓面。'],
rep:'任何一期以上壓傷 → 當日通報督導與居家護理；四期或有臭味、發燒 → 立即通報。',
ref:'NPIAP 壓傷分期；衛福部壓傷預防與照護指引。',
ask:'案主骶骨有一塊紫黑色皮膚但沒有破，這是哪一期，我在等護理來之前可以先做什麼？'});

add({db:'care',cat:'飲食與吞嚥',t:'協助進食與吞嚥安全',s:'坐直 90 度、下巴微收、一次一小口、確認吞完再下一口，餐後坐 30 分鐘。',tags:['餵食','吞嚥','嗆咳','進食','BA04','BA05'],
why:'嗆咳與吸入性肺炎是長者住院的主因之一，而大部分嗆咳來自姿勢與速度。',
steps:['進食前確認案主清醒、能回應；床上者床頭抬高至少 60 度，頭後放枕頭讓下巴微收。','你坐在案主視線高度或稍低，不要站著由上往下餵。','一次一小口（約一茶匙），看到喉結上下動、嘴巴清空再給下一口。','固體與液體分開給；清水容易嗆的案主，依專業指示使用增稠劑。','進食中出現咳嗽、聲音變濕、流淚、呼吸急促 → 暫停，讓案主咳乾淨。','餐後保持坐姿至少 30 分鐘，再協助口腔清潔。'],
no:['不要在案主想睡或躺平時餵食。','不要用吸管給容易嗆的案主喝水（吸管會讓水太快進到喉嚨）。','不要為了趕時間加快速度或加大湯匙。','不要餵有假牙但沒戴上的案主吃需要咀嚼的食物。'],
rep:'反覆嗆咳、餐後發燒、進食時間明顯拉長、體重下降 → 通報督導，建議轉介語言治療吞嚥評估。',
ref:'長照給付及支付基準 BA04 協助進食或管灌餵食、BA05 餐食照顧；語言治療吞嚥安全原則。',
ask:'案主每次喝水都嗆，但吃粥不會，我可以怎麼調整水的質地與姿勢？'});

add({db:'care',cat:'飲食與吞嚥',t:'水分與便秘照顧',s:'沒有限水醫囑的長者，每天目標約 1500 cc；便秘先從水、纖維、活動、如廁時間下手。',tags:['水分','便秘','脫水','排便'],
why:'長者口渴感變差，脫水會造成意識混亂、跌倒、尿路感染；便秘則會引起腹脹、拒食、譫妄。',
steps:['把 1500 cc 拆成看得見的容器：例如三個 500 cc 水壺，喝完一個就記錄。','早上起床、每次活動後、每餐前後各一杯，不要一次灌很多。','不愛喝水的案主：湯、無糖豆漿、水果、水凍、溫開水加一點檸檬都算。','便秘：早餐後 30 分鐘固定坐馬桶，腳下墊小凳子讓膝蓋高於臀部。','每天順時針按摩腹部 5–10 分鐘，配合走動或坐站運動。','記錄排便日期、性狀（硬、軟、水），超過 3 天沒解要留意。'],
no:['心衰竭、洗腎、限水醫囑的案主，先問清楚每天可以喝多少。','不要自行給予瀉藥或浣腸，要依醫囑或護理指示。','不要因為怕頻尿就故意少給水。'],
rep:'3 天以上未解便合併腹脹嘔吐、或血便、黑便 → 通報督導並建議就醫。',
ref:'自立支援照顧四大基本照顧（水分、營養、運動、排便）。',
ask:'案主一天只喝 500 cc，怎麼設計一個他做得到的喝水提醒方法？'});

add({db:'care',cat:'排泄與管路',t:'鼻胃管灌食注意事項',s:'灌食前抬高床頭、確認管路刻度與固定、反抽看殘餘量；灌完保持坐姿 30–60 分鐘。',tags:['鼻胃管','灌食','管路','反抽'],
why:'灌食是居服員可執行、但最容易因為姿勢與速度出事的項目；管路位移灌食會直接灌進肺部。',
steps:['灌食前：床頭抬高 30–45 度，看管路外露刻度是否和平常一樣、鼻翼固定是否鬆脫。','依單位規定反抽檢查胃殘餘量；殘餘量超過單位設定值（常見 100–150 cc）先不灌並通報。','灌食溫度接近體溫，用重力慢慢流，一餐至少 15–20 分鐘，不要用力推。','灌完再灌 30–50 cc 溫開水沖管，蓋好管口。','灌食後保持坐姿或床頭抬高 30–60 分鐘，再協助翻身。','灌食中若咳嗽、呼吸急促、臉色改變 → 立即停止。'],
no:['不要在案主躺平時灌食。','管路刻度和平常不一樣、或看到管子在口腔內盤繞，不要灌，先通報。','不要自己把脫落的鼻胃管放回去。','不要把藥物直接與配方奶混在同一針筒。'],
rep:'殘餘量過多、管路位移或脫落、灌食中嗆咳 → 立即停止並通報督導；管路脫落請護理或就醫重新置放。',
ref:'長照給付及支付基準 BA04 協助進食或管灌餵食（須完成相關訓練）；單位灌食作業標準。',
ask:'案主鼻胃管灌食後常腹脹，除了放慢速度還可以檢查哪些原因？'});

add({db:'care',cat:'排泄與管路',t:'導尿管與尿袋照護',s:'尿袋永遠低於膀胱、管子不打折、每天清潔尿道口，觀察尿色與尿量。',tags:['導尿管','尿袋','尿路感染','管路'],
why:'導尿管是尿路感染的主要來源，多數感染來自尿袋放太高造成回流，或清潔不確實。',
steps:['尿袋固定於床沿或輪椅下方，永遠低於膀胱，不可放地上。','管路固定在大腿內側，留一點鬆度，翻身或移位前先確認管子不會被拉扯。','每天以清水或依單位指示清潔尿道口與管路近端，由內往外。','尿袋滿 1/2 到 2/3 就倒掉，出口不要碰到容器。','觀察並記錄：尿色（深黃、混濁、血尿）、尿量（一天少於 500 cc 要注意）、有無沉澱。'],
no:['不要為了方便把尿袋掛在床頭或高於身體。','不要自行沖洗膀胱或拔除、更換導尿管。','不要在案主抱怨下腹脹痛、8 小時沒有尿時等下一班再處理。'],
rep:'尿液混濁有異味合併發燒、血尿、無尿超過 6–8 小時、管路脫落 → 通報督導，請居家護理處理或就醫。',
ref:'長照給付及支付基準 管路照護相關項目；居家護理導尿管照護指引。',
ask:'案主的尿袋今天出現淡紅色尿，沒有發燒，我該先觀察什麼再通報？'});

add({db:'care',cat:'排泄與管路',t:'尿布更換與失禁皮膚保護',s:'濕了就換、由前往後清潔、擦乾後再穿；紅疹不要用痱子粉。',tags:['尿布','失禁','皮膚','會陰','BA07'],
why:'尿液與糞便在皮膚上超過 1 小時就會破壞角質，失禁性皮膚炎與壓傷經常一起出現。',
steps:['準備好尿布、濕巾或溫水、乾毛巾、隔離乳膏再開始，過程中盡量不要離開。','解開尿布，用溫水或無酒精濕巾由前往後（尿道→肛門）清潔，女性分開陰唇清潔皺褶。','側翻清潔臀部與肛門，同時看骶骨與臀部皮膚。','完全擦乾，薄擦含氧化鋅或皮膚保護膜的乳膏，不要厚塗。','尿布尺寸要對、腰貼不要過緊，腹股溝處鬆緊以能放進一指為準。','記錄排尿排便次數與性狀。'],
no:['不要用痱子粉，濕了會結塊摩擦皮膚。','不要用有酒精或香精的濕巾。','不要為了省尿布讓案主濕著等。','不要一次拉開整條尿布讓案主暴露太久，注意保暖與隱私。'],
rep:'皮膚破皮、水泡、真菌感染樣紅疹（邊緣有小衛星狀紅點）、血便 → 通報督導。',
ref:'長照給付及支付基準 基本身體清潔與排泄協助相關項目；失禁性皮膚炎預防原則。',
ask:'案主會陰部反覆紅疹，我已經每次都擦乾了，還有哪些原因可以檢查？'});

add({db:'care',cat:'用藥與觀察',t:'協助服藥的界線與方法',s:'居服員可提醒、拿藥、確認吃下去；不可自行決定劑量、停藥或給非處方藥。',tags:['用藥','服藥','藥盒','三讀五對'],
why:'長者常同時吃多種藥，漏吃、重複吃、把家人的藥吃錯是很常見的異常事件。',
steps:['拿藥前確認：對的人、對的藥（藥袋名字）、對的劑量、對的時間、對的方法。','用藥盒或藥袋分裝的，只依藥師或護理分裝好的內容給，不自行拆藥。','看著案主把藥吞下去，喝足夠的水（吞嚥困難者依指示磨粉或改劑型）。','記錄服藥時間；若案主拒服，記錄並通報，不強灌。','注意藥物副作用：頭暈、嗜睡、走路不穩、跌倒風險上升。'],
no:['不要自己判斷「今天血壓正常就不用吃血壓藥」。','不要給案主你自己或家屬的成藥、中藥。','不要把藥磨粉混進整碗飯裡讓案主沒吃完就漏藥。'],
rep:'發現重複用藥、漏藥超過一次、疑似副作用 → 通報督導，建議家屬回診或藥師諮詢。',
ref:'藥事法與醫師法：非醫事人員不得執行調劑與處方；長照給付及支付基準 基本日常照顧之服藥提醒。',
ask:'案主早上的藥有 8 種，家屬把藥都倒在一個罐子裡，我該怎麼協助整理才安全？'});

add({db:'care',cat:'用藥與觀察',t:'生命徵象測量與異常值',s:'量之前休息 5 分鐘、袖帶對位；血壓 ≥180/110 或 <90/60、血糖 <70 或 >300、體溫 ≥38℃ 要通報。',tags:['血壓','血糖','體溫','血氧','BA03'],
why:'數字本身不會救人，看懂數字並知道「什麼時候要通報」才會。',
steps:['血壓：坐著休息 5 分鐘，手臂與心臟同高，袖帶下緣在肘窩上 2–3 公分；兩次相差大就再量一次。','脈搏：數 1 分鐘，注意規不規則；每分鐘 <50 或 >120 要注意。','體溫：耳溫或額溫，同一案主固定同一種方式；≥38℃ 為發燒，長者 37.5℃ 以上就要留意。','血糖：依指示於餐前或餐後量，記錄時間；<70 mg/dL 立即處理低血糖，>300 通報。','血氧：SpO₂ <92% 或比平常低 3% 以上，合併呼吸急促要通報。','每次都記錄日期時間與數值，異常時記錄案主的症狀。'],
no:['不要在案主剛活動、剛喝咖啡、剛洗完澡後馬上量。','不要在有動靜脈瘻管（洗腎）或乳癌手術側的手臂量血壓。','不要只記數字不記症狀。'],
rep:'血壓 ≥180/110 或合併頭痛胸悶、<90/60 合併頭暈；心跳 <50 或 >120；血糖 <70 或 >300；發燒；血氧 <92% → 通報督導；有意識改變、胸痛、呼吸困難直接 119。',
ref:'長照給付及支付基準 BA03 測量生命徵象；台灣高血壓治療指引之居家血壓測量方式。',
ask:'案主血壓每次量都 160/95，但沒有不舒服，我應該多久記錄一次、怎麼跟督導回報？'});

add({db:'care',cat:'失智與溝通',t:'與失智長者溝通',s:'先進入他的世界再帶他出來：不糾正、不爭辯、簡短句子、一次一件事。',tags:['失智','溝通','情緒','照顧技巧'],
why:'失智者的記憶會消失，但情緒會留下來。你講什麼他可能忘了，你怎麼講他會記得。',
steps:['從正面靠近，先叫名字、自我介紹、視線同高，等他看到你再開口。','一句話一個訊息，用肯定句：「我們來喝水」而不是「要不要喝水？」','把「做什麼」拆成小步驟示範，並給他時間反應（等 10 秒再說一次，不要換句話）。','他說的事情和事實不符時，回應感受而不是糾正內容：「妳很想媽媽對嗎？」','情緒激動時先離開一下、轉移到他喜歡的事物、再回來。','用他熟悉的稱呼、老歌、老物件建立安全感。'],
no:['不要說「你剛剛已經問過了」「你記錯了」。','不要從背後拍他或突然碰觸。','不要在他面前跟家屬討論他的狀況像他不存在。','不要用命令句或幼稚化的語氣。'],
rep:'行為在短時間內突然變差（幾天內明顯混亂、嗜睡、拒食）→ 可能是譫妄或感染，通報督導建議就醫。',
ref:'台灣失智症協會照顧手冊；衛福部失智照護服務原則。',
ask:'案主每天下午都說要「回家」（其實就在家），我可以用哪幾句話回應？'});

add({db:'care',cat:'失智與溝通',t:'遊走、日落症候群與拒絕行為',s:'先找原因（痛、尿、餓、無聊、太吵），再調整環境與作息，最後才是安撫。',tags:['失智','遊走','日落','行為','拒絕'],
why:'失智者的「問題行為」多半是需求無法用語言表達，行為就是他的語言。',
steps:['發生時先排除身體原因：疼痛、想上廁所、餓、太熱太冷、便秘、藥物副作用。','日落症候群：下午 3 點後把家裡燈打亮、拉上窗簾、減少電視噪音，安排規律的傍晚活動（摺衣服、聽老歌）。','遊走：確認門有安全裝置、身上有聯絡資訊（愛心手鍊、衣物內標籤），白天安排足夠活動與曬太陽。','拒絕（洗澡、吃飯、換衣）：換個時間、換個人、換個說法，用他熟悉的順序。','記錄行為發生的時間、前後發生什麼、你做了什麼有效，交給督導與家屬。'],
no:['不要用鎖房間、綁束帶處理遊走。','不要跟他爭辯或強迫，會升高攻擊行為。','不要在他吃飯或洗澡時一直催促。'],
rep:'走失一次、攻擊行為造成受傷、持續拒食超過一天 → 通報督導；走失立即報警並通知家屬。',
ref:'衛福部失智症照護指引；老人福利法第 51 條（禁止對老人妨害自由、留置於危險環境）。',
ask:'案主晚上 8 點以後一直要出門「上班」，家屬已經很累了，我可以建議哪些不用約束的做法？'});

add({db:'care',cat:'環境與安全',t:'居家跌倒環境檢視',s:'每次到案家用眼睛掃一圈：地板、光線、動線、鞋子、浴室、床高。',tags:['跌倒','環境','居家安全','檢核'],
why:'居家跌倒有一半以上發生在浴室與臥室到廁所的動線，居服員是最能發現危險的人。',
steps:['地板：小地毯、電線、雜物、濕滑處移開或固定；門檻可裝斜坡板。','光線：夜間動線加小夜燈，床邊有隨手開的燈。','動線：從床到廁所的路清空，沿途有可以扶的固定物（不是折疊椅或活動桌）。','浴室：防滑墊、扶手、沐浴椅，馬桶旁扶手或增高座。','鞋子：後跟包覆、鞋底防滑，不穿拖鞋走路。','床與椅高度：坐下時腳能平放、膝蓋約 90 度。','看到危險當場能改就改（移電線），不能改的記錄並回報。'],
no:['不要為了怕跌倒而讓案主減少走動，肌力下降跌得更兇。','不要在案主吃了安眠藥、降血壓藥剛起床時讓他自己走去廁所。'],
rep:'案主近 3 個月跌倒過、走路明顯不穩、需要扶著牆走 → 通報督導，建議轉介居家復能或輔具評估。',
ref:'衛福部長者防跌指引；長照輔具與居家無障礙環境改善服務。',
ask:'案家浴室沒有扶手也不肯裝，還有哪些便宜或暫時的替代做法？'});

add({db:'care',cat:'環境與安全',t:'不約束的照顧',s:'約束是醫療行為，需要醫囑與家屬同意；居服員不主動約束，且應通報不當約束。',tags:['約束','綁','束帶','自由'],
why:'研究反覆證明約束不會減少跌倒，反而增加肌力下降、壓傷、譫妄與死亡風險。',
steps:['先找原因：拔管是因為癢或不舒服？躁動是因為疼痛、想上廁所？','替代方法：分散注意的物品（毛巾、抱枕）、坐在可看得到人的地方、規律活動消耗體力。','管路可用衣物遮蓋、固定牢一點、或請護理評估是否可移除。','床邊改用低床、地墊、床邊感應器，而不是床欄與束帶。','看到家屬自行約束，先了解原因、說明風險，並回報督導處理。'],
no:['不要用綁手、綁腳、綁在椅子上或關房間的方式「保護」案主。','不要把床欄四面全拉起（會翻越跌落更嚴重）。'],
rep:'發現案主被長時間約束、有勒痕或皮膚傷、被鎖在房內 → 依通報責任處理，通報督導與 113。',
ref:'長期照顧服務法之尊嚴照顧原則；老人福利法第 51 條；身心障礙者權益保障法第 75 條。',
ask:'家屬因為怕案主半夜跌倒，把他綁在床上，我該怎麼跟家屬談替代方案？'});

add({db:'care',cat:'排泄與管路',t:'口腔內分泌物抽吸',s:'限口腔內（懸雍垂以前），需完成訓練；一次不超過 10 秒，抽前抽後給氧或休息。',tags:['抽痰','分泌物','BA18','口腔'],
why:'口腔抽吸能減少嗆入，但抽太深、太久會缺氧或傷黏膜；氣管內抽吸屬於另一項目與訓練。',
steps:['確認你已完成單位認可的訓練且本案有此項目。','洗手，案主坐起或側臥頭偏一側，備好抽吸機、無菌抽痰管、清水。','抽痰管只進入口腔（不超過懸雍垂），邊旋轉邊往外抽，一次不超過 10 秒。','兩次抽吸之間讓案主休息、深呼吸，觀察臉色與血氧。','抽完清潔管路與口腔，記錄分泌物顏色、量與案主反應。'],
no:['不要把口腔抽吸管伸進咽喉深處或鼻腔。','不要在案主臉色發紫、血氧掉時繼續抽。','沒有訓練與核定不要執行。'],
rep:'分泌物呈黃綠色、帶血、量突然增加、抽後血氧不回升 → 通報督導或 119。',
ref:'長照給付及支付基準 BA18 口腔內（懸雍垂以前）分泌物抽吸（需完成訓練）；BA17 人工氣道管內分泌物抽吸另有規範。',
ask:'案主痰很多但口腔抽吸抽不到，還有哪些讓痰容易咳出的照顧做法？'});

/* ---------- 復能運動 ---------- */
add({db:'move',cat:'復能原則',t:'復能（自立支援）四個基本',s:'水分 1500 cc、營養、運動、規律排便——先把身體條件顧好，功能才練得起來。',tags:['自立支援','復能','水分','營養','運動','排便'],
why:'很多「不肯動」其實是脫水、營養不良、便秘讓人沒力氣、沒精神。先照顧基本，運動才有效。',
steps:['水分：無限水醫囑者每天約 1500 cc，用看得見的容器計量。','營養：每餐有蛋白質（蛋、豆腐、魚、肉），一天約每公斤體重 1–1.2 公克蛋白質；牙口不好就改軟質而不是減量。','運動：每天有站起來、走動、動手做事的機會，不是「躺著休息就會好」。','排便：固定時間坐馬桶，記錄排便。','把這四件事寫進每天的服務紀錄，讓督導與家屬看到變化。'],
no:['不要用「案主不想動」當作結案的理由，先問是不是身體條件不夠。','不要為了方便把所有事情做完，讓案主整天沒有機會用力。'],
rep:'兩週內明顯吃不下、體重下降、水喝不到 1000 cc → 通報督導，建議營養或醫療評估。',
ref:'自立支援照顧基本照顧四原則；長照復能服務原則。',
ask:'案主 72 公斤、牙口不好、只吃稀飯，每天要怎麼補足蛋白質？請給我具體菜單。'});

add({db:'move',cat:'復能原則',t:'做中學：不代勞的三段式協助',s:'先口語提示，再示範或手勢，最後才用手協助，而且只協助做不到的那一段。',tags:['不代勞','協助','ADL','引導'],
why:'代勞最快，但每代勞一次，案主就少練一次；復能就是把每天的生活動作變成訓練。',
steps:['先問自己：這個動作案主哪一段做得到、哪一段做不到？','第一段：口語提示（「手扶著扶手」「屁股往前」），等 10 秒。','第二段：示範或碰一下要動的部位當提示。','第三段：只協助做不到的那一段（例如扣最上面的扣子），其他讓他自己做。','完成後具體稱讚做到的部分：「你今天自己站起來三次！」','記錄協助程度的變化（全協助→部分協助→口頭提示）。'],
no:['不要在案主還在嘗試時就出手。','不要因為時間壓力而每次都全做完；可以和督導討論調整服務時段。'],
rep:'案主能力明顯提升或下降 → 回報督導，作為服務計畫調整依據。',
ref:'長照復能服務理念：生活即復能、做中學。',
ask:'案主穿褲子每次都要我全程幫忙，請幫我把穿褲子拆成小步驟，找出他可以自己做的部分。'});

add({db:'move',cat:'肌力',t:'椅子坐站訓練',s:'雙腳踩穩、身體前傾、推膝站起、慢慢坐下；一天 10 次×3 回，是最有效的下肢肌力訓練。',tags:['坐站','下肢','肌力','大腿'],
why:'坐站是「能不能自己上廁所」的關鍵動作；30 秒坐站次數是全世界通用的長者體能指標。',
steps:['用有靠背、不會滑的椅子，高度讓膝蓋約 90 度；前方不放桌子擋住。','雙腳與肩同寬、腳跟稍微往後收；鼻子超過腳尖（身體前傾）。','雙手放大腿或交叉胸前站起；做不到就先扶椅子扶手或前方穩固桌面。','站直後停 2 秒，再用 3–4 秒慢慢坐下，不要「摔」進椅子。','一回 8–10 次，休息 1 分鐘，做 2–3 回；一週至少 3 天。','進階：手不扶、拿水瓶、椅子降低。'],
no:['不要用有輪子或折疊的椅子。','不要在案主頭暈、血壓不穩時做。','不要讓案主憋氣用力，站起時吐氣。'],
rep:'運動中胸痛、明顯喘、頭暈、膝蓋劇痛 → 停止並依運動安全指標處理。',
ref:'30 秒坐站測試（Senior Fitness Test）；長者肌力訓練指引。',
ask:'案主坐站只能扶著做 3 次，請幫我設計 4 週的漸進計畫。'});

add({db:'move',cat:'肌力',t:'坐姿抬腿與踝泵',s:'坐著把小腿伸直停 3 秒、腳踝上下勾伸，預防肌力下降與小腿血栓。',tags:['抬腿','踝泵','小腿','循環','水腫'],
why:'長時間坐著的長者股四頭肌先退化、小腿血液循環變差，這兩個動作幾乎沒有禁忌、坐著就能做。',
steps:['坐穩椅子，背靠好，雙手扶椅面。','一腳慢慢伸直、腳尖往自己勾，停 3 秒再放下；兩腳輪流各 10 次。','踝泵：雙腳腳尖用力往上勾 2 秒、再往下踩 2 秒，做 20 次。','進階：腳踝綁沙包或用彈力帶。','每天 2–3 回，看電視、等餐時都可以做。'],
no:['膝蓋剛開刀或急性腫痛時不要做抬腿。','不要憋氣。'],
rep:'單側小腿突然腫、痛、發熱發紅 → 可能是血栓，通報督導並建議立即就醫。',
ref:'長者居家運動指引；深部靜脈血栓預防原則。',
ask:'案主雙腳有水腫，抬腿踝泵之外還有哪些安全的居家做法？'});

add({db:'move',cat:'肌力',t:'毛巾上肢操',s:'用一條毛巾做拉伸、擰、舉高、拉背，練肩、手臂與手部力氣，對應穿衣洗澡。',tags:['上肢','毛巾','肩膀','手','穿衣'],
why:'穿脫上衣、洗頭、擦背都需要肩關節活動度與握力，毛巾是家家都有的訓練工具。',
steps:['雙手抓毛巾兩端往兩側拉緊，舉高到頭頂再放下，10 次。','毛巾放背後上下拉（像擦背），兩手上下互換，各 10 次。','擰毛巾：雙手反方向擰 10 次，練握力與前臂。','雙手拉緊毛巾往前推、往胸口拉，10 次。','進階：毛巾沾濕加重量。'],
no:['肩膀有急性疼痛或五十肩發作期，不要硬拉到痛。','不要聳肩用力，脖子放鬆。'],
rep:'肩膀活動時疼痛超過兩週、夜間痛醒 → 通報督導建議就醫。',
ref:'長者上肢功能訓練與 ADL 對應原則。',
ask:'案主右肩舉不到耳朵，穿套頭衣很吃力，請建議 3 個對應的毛巾動作與穿衣技巧。'});

add({db:'move',cat:'平衡與步行',t:'扶椅平衡訓練',s:'雙手扶椅背→單手→手放開，練站姿平衡；重點是「有東西可以抓但盡量不抓」。',tags:['平衡','站立','跌倒預防','單腳'],
why:'平衡是跌倒風險最直接的指標，而且只要練 2–3 週就會進步。',
steps:['站在穩固椅子後方，雙手扶椅背，雙腳與肩同寬站 30 秒。','雙腳併攏站 30 秒。','一腳在前、一腳在後（腳跟接腳尖）站 30 秒，換腳。','單腳站：抬起一腳離地 5–10 秒，換腳，各 5 次。','每一級做得穩了，才進到單手扶、再到手放開（手仍放在椅背上方 5 公分待命）。','旁邊一定要有人在。'],
no:['不要在濕滑地面或穿拖鞋做。','不要在案主剛服用安眠藥或降壓藥、頭暈時做。','不要一次跳好幾級難度。'],
rep:'單腳站不到 5 秒、近 3 個月跌倒過 → 通報督導，建議轉介復能評估。',
ref:'Otago 運動計畫平衡訓練原則；台灣長者防跌運動指引。',
ask:'案主雙腳併攏站都會晃，請幫我列出從最簡單開始的平衡練習順序。'});

add({db:'move',cat:'平衡與步行',t:'步行訓練與輔具檢查',s:'先檢查輔具高度與止滑，再從室內短距離開始，用「一起走」而不是「扶著走」。',tags:['步行','走路','助行器','拐杖','輔具'],
why:'很多長者不是不能走，是輔具高度錯、止滑墊磨平、或照顧者一直用扶的讓他失去自己的平衡。',
steps:['拐杖／助行器高度：手自然下垂時，握把在手腕橫紋處，握住時手肘微彎約 15–30 度。','檢查止滑腳墊有沒有磨平、螺絲有沒有鬆。','助行器：先推出一步的距離→患側腳→好側腳；拐杖拿在好側手。','你走在案主患側稍後方，手放在他腰後但不抓，讓他自己控制平衡。','從室內 5–10 公尺開始，每天累加，目標能走到廁所、餐桌、門口。','穿包鞋，記錄每天走的距離與有沒有停下來休息。'],
no:['不要用扶手臂拉著走。','不要一開始就到戶外或不平的路面。','不要讓案主拿雨傘、掃把代替拐杖。'],
rep:'走路時突然變得明顯不穩、單側無力、或走幾步就喘 → 通報督導，建議就醫評估。',
ref:'輔具使用原則；長照復能步行訓練。',
ask:'案主的助行器是家人網購的，怎麼幫他快速確認高度對不對？'});

add({db:'move',cat:'平衡與步行',t:'上下樓梯與門檻',s:'口訣「好上壞下」：上樓好腳先，下樓壞腳先；拐杖跟著壞腳。',tags:['樓梯','門檻','BA12','好上壞下'],
why:'樓梯是居家跌倒後果最嚴重的地方，順序對了風險就少一半。',
steps:['上樓：手扶扶手，好腳先上，壞腳與拐杖跟上，一階一階。','下樓：拐杖與壞腳先下，好腳跟下。','你站在案主下方一階（上樓在後、下樓在前），手護在腰後。','門檻：先站穩、抬高腳跨過，不要拖腳；可裝斜坡板。','一次只走能力範圍內的階數，中途可以休息。'],
no:['不要邊走邊聊天分心。','不要抱著案主上下樓（兩個人一起摔）。','不要穿拖鞋、赤腳上下樓。'],
rep:'無法安全上下樓造成無法出門就醫 → 通報督導，評估爬梯機或交通接送資源。',
ref:'長照給付及支付基準 BA12 協助上下樓梯；復能步行訓練原則。',
ask:'案主家門口有五階樓梯沒有扶手，他左腳無力，我要怎麼協助他安全出門？'});

add({db:'move',cat:'床上活動',t:'臥床者的橋式與自主翻身',s:'躺著也能練：抬臀橋式、抓床欄翻身、床上坐起，是離開床的第一步。',tags:['臥床','橋式','翻身','坐起','床上運動'],
why:'臥床一週肌力就會掉一到兩成，床上運動是為了讓他有力氣坐起來、下床。',
steps:['橋式：屈膝踩床，屁股抬離床面停 3 秒放下，10 次；可先從抬 1 公分開始。','自主翻身：要翻的方向拉床欄，另一側膝蓋彎起往同方向推，你只協助肩膀。','床上坐起：側躺→手撐床→腳放下床緣，分三步驟，每一步等他自己用力。','坐床緣後雙腳踩地，坐 3–5 分鐘看有沒有頭暈，再做坐姿運動。','每天有坐床緣的時間，逐步延長。'],
no:['不要在有骶骨壓傷時做橋式摩擦傷口。','不要拉手臂把案主拉坐起來。','剛開始坐起時不要離開，注意姿勢性低血壓。'],
rep:'坐起時頭暈嚴重、血壓下降超過 20 mmHg、或案主完全無法參與 → 回報督導評估復能介入。',
ref:'長照復能床上活動訓練；姿勢性低血壓預防原則。',
ask:'案主臥床三個月，家屬想讓他坐輪椅出門，請幫我規劃從床上運動到坐床緣的四週漸進計畫。'});

add({db:'move',cat:'床上活動',t:'關節活動運動（ROM）',s:'每個關節慢慢做到底、停 3 秒、做 10 次，不要超過疼痛點；能自己動就不要被動做。',tags:['關節','ROM','攣縮','BA11','被動運動'],
why:'關節超過幾週不動就會攣縮，攣縮之後換尿布、穿衣都更難，也更痛。',
steps:['順序：肩（舉高、外展）、肘（彎伸）、腕（上下）、手指（握放）、髖（屈曲、外展）、膝（彎伸）、踝（勾伸）。','一手固定關節近端、一手托住遠端，慢慢做到他能做的最大範圍，停 3 秒。','每個動作 10 次，每天 1–2 回；能自己做的就叫他自己做（主動運動），你只在做不到的地方幫。','邊做邊看表情，皺眉或喊痛就退回一點。','記錄哪些關節活動變小或變緊。'],
no:['不要快速甩動或用力壓到底。','骨折未癒、關節急性紅腫熱痛、剛手術部位不做。','不要在骨質疏鬆嚴重的案主身上做大力度的被動運動。'],
rep:'關節突然變硬、腫脹、活動時劇痛 → 通報督導建議就醫；攣縮進展快 → 建議轉介復能。',
ref:'長照給付及支付基準 BA11 肢體關節活動；被動關節運動原則。',
ask:'案主中風後左手指握緊打不開，做手指 ROM 時要注意什麼、怎麼讓他放鬆？'});

add({db:'move',cat:'生活功能訓練',t:'自己穿脫衣服',s:'口訣「患側先穿、後脫」；用坐姿、寬鬆衣物、魔鬼氈替代扣子，讓案主自己完成。',tags:['穿衣','ADL','偏癱','生活功能'],
why:'穿衣是每天一定會做的動作，本身就是上肢與平衡的訓練。',
steps:['坐穩在椅子或床緣，衣服攤好、正面朝上放在膝上。','上衣：患側手先穿進袖子拉到肩膀，再穿好側；脫的時候好側先脫。','褲子：坐著把患側腳先穿進褲管，再穿好側，拉到膝蓋，扶著站起再拉到腰。','扣子難：改魔鬼氈、大扣子、彈性褲頭；鞋帶難：改彈性鞋帶。','你只在他卡住 10 秒以上時協助，並只協助卡住的那一步。'],
no:['不要為了快而把整件衣服幫他穿好。','不要讓他站著穿褲子（除非平衡很好且有扶手）。'],
rep:'穿衣時反覆跌坐或需要的協助明顯增加 → 回報督導。',
ref:'職能治療 ADL 訓練原則；長照復能生活功能訓練。',
ask:'案主右手偏癱，穿有拉鍊的外套一直失敗，請給我步驟分解與兩種改良做法。'});

add({db:'move',cat:'生活功能訓練',t:'自己吃飯',s:'調整餐具、餐盤、高度與時間，讓案主自己把飯送進嘴裡，你只在旁協助。',tags:['進食','餐具','輔具','ADL','手抖'],
why:'自己吃飯不只是尊嚴，也是手眼協調、上肢肌力與吞嚥的訓練。',
steps:['坐姿：餐桌高度約在肚臍上方一點，腳能踩地。','餐具：加粗握柄湯匙、防滑餐墊、有邊的盤子（防溢餐盤）、輕的杯子。','把菜切成一口大小、湯用寬口碗，減少舀不到的挫折。','手抖或無力：從你握著他的手一起送到嘴（手把手），慢慢減少你的力道。','給足夠時間，一餐 30–40 分鐘是正常的。','記錄能自己吃的比例（幾成）。'],
no:['不要因為吃得慢、掉得多就直接餵。','不要在他吃到一半時清理，會打斷節奏。'],
rep:'進食量明顯減少、嗆咳、體重下降 → 通報督導。',
ref:'職能治療進食訓練與輔具原則。',
ask:'案主帕金森氏症手抖，吃飯常灑出來，有哪些便宜的餐具或改良方法？'});

add({db:'move',cat:'生活功能訓練',t:'如廁自理訓練',s:'從「定時提醒」到「自己走去廁所」，配合馬桶增高座與扶手，減少包尿布時間。',tags:['如廁','馬桶','失禁','BA24','增高座'],
why:'能自己上廁所是長者最在意的自主能力，也是最能減少尿布與皮膚問題的復能目標。',
steps:['先記錄 3 天排尿時間，找出規律（例如每 2 小時）。','在規律時間前 15 分鐘主動提醒去廁所，不要等他喊。','馬桶：增高座、旁邊扶手；晚上可用床邊便盆椅。','衣物改成彈性褲頭，方便快速脫下。','從你陪走→你在門外等→自己去，逐步減少協助。','白天嘗試用褲型尿布或棉墊取代黏貼式尿布，讓他有「自己去」的動機。'],
no:['不要因為怕失禁就整天包尿布、限制喝水。','不要讓他憋尿等你有空。'],
rep:'排尿疼痛、血尿、頻尿合併發燒、突然完全無法解尿 → 通報督導建議就醫。',
ref:'長照給付及支付基準 BA24 協助排泄；自立支援排泄照顧原則。',
ask:'案主白天包尿布但其實能走，請幫我設計兩週的如廁訓練時間表與紀錄表。'});

add({db:'move',cat:'認知與口腔',t:'健口操（吞嚥與口腔運動）',s:'餐前 5 分鐘做：深呼吸、頸部伸展、臉頰鼓氣、舌頭伸縮、發「趴、他、卡、啦」。',tags:['健口操','吞嚥','口腔','發音','肺炎預防'],
why:'吞嚥肌肉也會退化，餐前做健口操能減少嗆咳、增加唾液、提升進食安全。',
steps:['深呼吸 3 次，肩膀上下 5 次。','脖子左右轉、左右側彎各 5 次（慢慢做）。','臉頰鼓氣、吸氣交替 5 次；嘴巴大開「啊」、閉緊「嗯」5 次。','舌頭伸出、縮回、左右頂臉頰各 5 次。','發音：「趴趴趴、他他他、卡卡卡、啦啦啦」各 5 次，清楚有力。','最後咳嗽 2 次、吞口水 1 次。'],
no:['急性脖子痛、頸椎手術後不做頸部動作。','不要做到頭暈。'],
rep:'即使做健口操仍反覆嗆咳、流口水變多、聲音變沙啞 → 通報督導建議語言治療評估。',
ref:'日本健口體操；台灣長者口腔功能促進方案。',
ask:'請把健口操改編成配著一首台灣老歌的節奏做的版本，適合 10 人團體。'});

add({db:'move',cat:'認知與口腔',t:'居家認知活動',s:'懷舊聊天、簡單算數、找東西、分類整理，把認知訓練藏在日常事務裡。',tags:['認知','失智','懷舊','桌遊','大腦'],
why:'認知刺激最有效的形式是「有意義、有互動」，不是做題目。',
steps:['懷舊：用老照片、老歌、老物件開話題，問「那時候…」而不是考他「這是誰」。','算數：買菜找零、算藥有幾顆、算今天喝了幾杯水。','分類整理：摺衣服分顏色、把襪子配對、整理抽屜。','找東西：把 3 個物品放桌上，蓋起來拿走一個，問少了什麼。','桌遊：撲克牌配對、大骰子比大小、簡單的圖卡配對。','每次 15–20 分鐘，以案主有笑容、願意繼續為原則。'],
no:['不要用「考試」語氣或糾正錯誤。','不要選太難的活動讓他挫折，寧可簡單但有成就感。'],
rep:'認知在數週內明顯變差 → 通報督導建議就醫評估。',
ref:'認知刺激治療（CST）原則；失智症非藥物介入指引。',
ask:'案主輕度失智、以前是裁縫師，請設計 5 個和她職業有關的居家認知活動。'});

add({db:'move',cat:'安全與監測',t:'運動前檢查與停止指標',s:'運動前看血壓、症狀、環境；運動中出現胸痛、明顯喘、頭暈、臉色發白立刻停。',tags:['安全','運動前','停止','血壓','心臟'],
why:'運動安全不是「不要動」，是知道哪些情況今天不能動、哪些情況要馬上停。',
steps:['運動前確認：安靜血壓 <160/100、沒有發燒、沒有胸悶、昨晚有睡、今天有吃。','環境：穿包鞋、地面乾、旁邊有穩固物可扶、水在旁邊。','先暖身 5 分鐘（原地踏步、關節活動）。','運動中每幾分鐘問「還好嗎？」看臉色與呼吸。','立即停止：胸痛胸悶、呼吸困難說不出完整句子、頭暈眼花、臉色蒼白冒冷汗、心跳很亂、關節劇痛。','停止後坐下休息 10 分鐘，症狀不消失依急症流程處理。'],
no:['血壓 ≥180/110、休息時就在喘、發燒、血糖 <70 或 >300 的當天不運動。','不要憋氣用力（血壓會飆高）。'],
rep:'運動中出現停止指標且休息不改善、或每次運動都出現 → 通報督導，建議就醫評估後再繼續。',
ref:'ACSM 運動安全指引；台灣長者運動處方原則。',
ask:'案主有心臟裝支架的病史，家屬很擔心，請列出他可以安全做的運動與絕對要避免的情況。'});

add({db:'move',cat:'安全與監測',t:'運動強度：談話測試',s:'能說話但不能唱歌，就是剛好的中等強度；說不出完整一句話就太強。',tags:['強度','談話測試','RPE','心跳'],
why:'居家沒有儀器，談話測試是最簡單也最準確的強度判斷。',
steps:['運動中請案主講一句話，例如「今天天氣很好我想出去走走」。','能順暢講完一句話 → 中等強度，剛好。','邊講邊喘、只能講三四個字 → 太強，放慢。','能唱歌 → 太輕，可以加快或加次數。','自覺用力程度（0–10）：目標在 4–6「有點累但還可以繼續」。','記錄每次運動的強度感受。'],
no:['不要用「累了就是有效」催案主。','不要用年輕人的心跳標準。'],
rep:'中等強度以下就喘或胸悶 → 通報督導建議就醫。',
ref:'談話測試（Talk Test）；Borg 自覺用力量表。',
ask:'請用最白話的方式，寫一段跟 80 歲案主說明什麼是「剛剛好的運動強度」。'});

add({db:'move',cat:'床上活動',t:'呼吸訓練',s:'腹式呼吸與噘嘴吐氣，每天 2 回各 10 次，讓臥床或肺功能差的案主呼吸更有效率。',tags:['呼吸','肺','腹式呼吸','咳嗽','COPD'],
why:'臥床、駝背、肺病都會讓呼吸變淺，痰咳不出來、容易肺炎。',
steps:['半坐臥或坐姿，一手放胸口、一手放肚子。','用鼻子慢慢吸氣 3 秒，感覺肚子鼓起（胸口的手不動）。','噘嘴像吹蠟燭，慢慢吐氣 4–6 秒。','做 10 次休息，一天 2–3 回。','有痰時：深吸氣後用力咳 2 聲（哈氣咳），配合拍背（空心掌由下往上）。','進階：吹氣球、吹泡泡、用吸管吹水。'],
no:['不要做到頭暈。','剛吃飽不做拍背。','血氧偏低、呼吸急促時不做，先通報。'],
rep:'呼吸次數每分鐘 >24、血氧 <92%、痰有血或黃綠色合併發燒 → 通報督導或 119。',
ref:'肺復原呼吸訓練原則；長照給付及支付基準 BA10 翻身拍背。',
ask:'案主有慢性阻塞性肺病，走幾步就喘，請幫我設計坐著就能做的呼吸與運動組合。'});

/* ---------- 異常事件 ---------- */
add({db:'event',cat:'通報流程',t:'異常事件處理六步驟',s:'安全→處置→通報→記錄→交接→檢討。任何異常先確保現場安全，再打電話。',tags:['通報','流程','SOP','督導'],
why:'慌張時最容易漏掉「先確保安全」與「當天記錄」，這兩件事往往決定後續責任與案主結果。',
steps:['確保安全：自己與案主都先脫離危險（火、瓦斯、地上的水、失控的人）。','初步處置：依各事件的做法處理；有生命危險直接打 119，不要先問督導。','通報：立即以電話通報督導（不是只傳訊息），依單位規定通報家屬；必要時 110／113。','記錄：離開案家前完成當日紀錄，用 5W1H 寫事實，不寫推測。','交接：告知下一班或家屬需要繼續觀察的事項與時間點。','檢討：與督導討論原因與預防措施，依單位時限填寫異常事件通報單（多為 24 小時內）。'],
no:['不要為了怕被責備而延後通報或淡化事實。','不要私下與家屬承諾賠償或道歉認錯。','不要在 LINE 群組張貼案主照片討論。'],
rep:'任何跌倒、受傷、急送醫、走失、疑似不當對待、服務員自身受傷、性騷擾／暴力都要通報。',
ref:'單位異常事件通報作業規定；長期照顧服務法之服務品質與通報規範。',
ask:'我剛剛在案家發生了（描述事件），請幫我依 5W1H 整理成一份客觀的通報紀錄草稿。'});

add({db:'event',cat:'通報流程',t:'異常事件紀錄怎麼寫（5W1H）',s:'時間、地點、人、發生什麼、你做了什麼、案主狀況與通報對象——只寫看到聽到的事實。',tags:['紀錄','5W1H','文件','責任'],
why:'紀錄是你最重要的自我保護，也是後續醫療與調查唯一的依據。',
steps:['When：幾點幾分發現或發生（不是大概）。','Where：客廳、浴室、床邊——具體位置。','Who：案主、在場的家屬、你。','What：客觀描述「發現案主坐在浴室地上，右側身體著地，右髖疼痛，意識清楚」。','How／處置：你做了什麼、幾點通報誰、對方怎麼回應、案主後續狀況。','引述案主或家屬的話用引號原文記錄，例如案主說「我自己滑倒的」。','簽名、日期，交給督導；自己留一份紀錄摘要。'],
no:['不要寫「應該是」「可能因為」等推測。','不要用情緒字眼（「家屬很兇」改成「家屬提高音量說……」）。','不要事後補寫日期不實的紀錄。'],
rep:'紀錄完成後交督導；涉及法律事件時紀錄應由單位保存。',
ref:'服務紀錄撰寫原則；民事訴訟中書面紀錄之證據價值。',
ask:'請把這段口語描述改寫成客觀的異常事件紀錄，去掉推測與情緒字眼：（貼上內容）。'});

add({db:'event',cat:'跌倒與外傷',t:'案主跌倒',s:'不要馬上扶起。先問能不能動、看有沒有變形出血、頭有沒有撞到，再決定扶起或叫 119。',tags:['跌倒','骨折','髖','扶起','119'],
why:'跌倒後急著扶起是造成骨折移位與二次傷害的主因；髖部骨折的長者一年內死亡率很高。',
steps:['先讓案主不要動，蹲下與他說話：「不要急著起來，先讓我看看」。','檢查：意識清楚嗎？哪裡痛？腳能動嗎？兩腳長度一樣嗎（一腳外翻縮短→疑似髖骨折）？有沒有出血、變形、頭部撞擊？','有以下任一：意識不清、劇痛、無法移動、變形、頭部撞擊後嘔吐或嗜睡、大量出血 → 不扶起，打 119，保暖並陪伴。','都沒有 → 讓案主自己翻身、跪起、扶穩固物慢慢站，你在旁保護；不要用拉的。','扶起後坐下休息 15 分鐘，再量血壓、觀察。','通報督導與家屬，記錄跌倒原因、地點、傷處；24 小時內持續注意頭痛、嘔吐、意識變化。'],
no:['不要抱起或拉手臂扶起。','不要因為案主說「沒事」就不通報。','不要移動疑似頸椎或髖部受傷的案主。'],
rep:'所有跌倒都要通報督導；有受傷或不確定就 119。頭部撞擊者觀察 24–72 小時。',
ref:'衛福部長者防跌與跌倒後處理指引；單位跌倒通報規範。',
ask:'案主跌倒後說沒事，但走路時右腳明顯縮短外翻，我該怎麼跟 119 描述狀況？'});

add({db:'event',cat:'跌倒與外傷',t:'頭部撞擊後的觀察',s:'撞到頭後 72 小時內出現嘔吐、嗜睡叫不醒、劇烈頭痛、單側無力、瞳孔不一樣大 → 119。',tags:['頭部','撞擊','腦出血','觀察','抗凝血'],
why:'長者腦出血可能在撞到頭後幾小時到幾天才出現症狀，尤其有吃抗凝血藥的人。',
steps:['先確認有沒有立即危險徵象：意識不清、抽搐、耳鼻流血或流清水、瞳孔不一樣大 → 119。','外傷處理：頭皮出血用乾淨紗布壓迫，腫起來冰敷 15 分鐘。','確認是否服用抗凝血或抗血小板藥物（如華法林、阿斯匹靈）→ 告知督導，建議就醫。','向家屬與下一班交接觀察重點：72 小時內每 2–4 小時看一次清醒程度。','出現：反覆嘔吐、越來越想睡叫不太醒、頭痛加劇、說話不清、單側手腳無力、走路不穩 → 119。'],
no:['不要給止痛藥掩蓋症狀。','不要讓案主單獨睡一整夜而沒有人看。'],
rep:'所有頭部撞擊都要通報督導；有危險徵象直接 119。',
ref:'頭部外傷居家觀察指引；抗凝血藥物出血風險。',
ask:'案主撞到頭、有在吃抗凝血藥，家屬不想送醫，我可以怎麼說明風險？'});

add({db:'event',cat:'跌倒與外傷',t:'出血與傷口處理',s:'直接壓迫止血 10 分鐘不放開；壓不住、噴血、傷口深或大 → 119。',tags:['出血','傷口','壓迫','止血','手套'],
why:'長者皮膚薄、常吃抗凝血藥，小傷也可能流很久；正確壓迫是唯一有效的止血。',
steps:['戴手套（保護你也保護他）。','用乾淨紗布或毛巾直接壓在傷口上，持續壓 10 分鐘不要一直掀開看。','壓迫同時抬高受傷部位高於心臟（沒有骨折時）。','血滲出來就再加一層蓋上去，不要拿掉原本的。','小傷口止血後用生理食鹽水或清水沖洗，蓋上乾淨敷料。','記錄出血量（估計）、傷口大小與處理方式。'],
no:['不要用止血帶、不要撒藥粉或牙膏。','不要用棉花直接貼在傷口上。','不要自行拔出插在身體裡的異物。'],
rep:'壓迫 10 分鐘仍止不住、噴射狀出血、傷口深可見脂肪、動物咬傷、傷口在臉或關節 → 119 或就醫；其餘通報督導。',
ref:'基本急救原則；緊急醫療救護法第 14-2 條善意急救免責。',
ask:'案主皮膚很薄，撕開膠帶就破皮流血，請建議適合的固定與敷料方式。'});

add({db:'event',cat:'跌倒與外傷',t:'燙傷',s:'沖脫泡蓋送：流動冷水沖 15–30 分鐘，小心脫衣、水泡不要弄破、蓋乾淨布、送醫。',tags:['燙傷','沖脫泡蓋送','熱水','洗澡'],
why:'長者皮膚薄，40 幾度的水泡久一點就會燙傷；沖水的時間長短決定深度。',
steps:['沖：用流動冷水（不是冰水）沖傷處 15–30 分鐘，直到不痛。','脫：在水中小心脫掉衣物，黏住的部分用剪的、不要撕。','泡：繼續泡冷水，長者與大面積燙傷注意失溫，超過 10% 體表面積不要泡太久。','蓋：用乾淨的濕布或保鮮膜輕輕覆蓋，不要包緊。','送：面積大於手掌、臉部、關節、會陰、出現大水泡或皮膚變白變焦 → 119。','記錄燙傷原因（例如熱水袋、洗澡水溫）並檢討預防。'],
no:['不要抹牙膏、醬油、藥膏、冰塊。','不要弄破水泡。','不要用力擦拭傷處。'],
rep:'所有燙傷通報督導；達送醫標準者 119。',
ref:'衛福部燒燙傷急救「沖脫泡蓋送」。',
ask:'案主用電熱毯睡覺造成小腿紅腫，沒有破皮，我該怎麼處理與預防？'});

add({db:'event',cat:'急症',t:'噎食（哈姆立克法）',s:'能咳就鼓勵咳；不能咳、不能說話、臉色發紫 → 腹部推擠，直到吐出或倒下改 CPR 並打 119。',tags:['噎到','哈姆立克','哽塞','CPR','119'],
why:'長者噎食從發生到缺氧只有幾分鐘，你就是第一線。',
steps:['先問「你噎到了嗎？」能咳、能說話 → 鼓勵用力咳，不要拍背。','完全無法咳、無法出聲、雙手抓喉、臉色發紫 → 立刻進行腹部推擠。','站在案主背後，一腳在前一腳在後，一手握拳放在肚臍上方兩指、另一手包住，快速向內向上推。','反覆推擠直到異物排出或案主失去意識。','失去意識 → 讓他平躺，打 119（或請旁人打），開始 CPR；每次吹氣前先看口中有無異物可取出。','排出後仍要通報督導並建議就醫（可能有內臟受傷）。'],
no:['不要用手指盲目掏喉嚨。','不要拍背（會讓異物更深）。','坐輪椅無法站立者：可在椅子上從背後做腹部推擠，或懷孕、肥胖者改胸部推擠。'],
rep:'所有噎食事件通報督導；失去意識或推擠後仍不適 → 119。',
ref:'台灣急救指引哽塞處置；緊急醫療救護法第 14-2 條。',
ask:'案主坐輪椅、我一個人在場，他噎到了，請一步一步告訴我怎麼做腹部推擠。'});

add({db:'event',cat:'急症',t:'疑似中風（FAST）',s:'臉歪、手垂、說話不清，其中一項出現就打 119，並記下「最後正常的時間」。',tags:['中風','FAST','119','黃金時間','臉歪'],
why:'中風治療的黃金時間以小時計，多等一小時就多一分失能；最後正常時間決定能不能打溶栓。',
steps:['F 臉：請案主笑一個，看兩邊嘴角是否對稱。','A 手：閉眼雙手平舉 10 秒，看是否一手下垂。','S 說話：請他講一句話，看是否口齒不清或答非所問。','T 時間：任一項異常 → 立刻打 119，說「疑似中風」，並告訴救護員最後看到案主正常是幾點。','等待期間：讓案主側躺或半坐、不給食物飲水、不給藥、保持呼吸道通暢、記錄症狀變化。','通報督導與家屬，把用藥清單與健保卡準備好。'],
no:['不要「先觀察一下看會不會好」。','不要自己開車送醫（救護車可直送有中風處理能力的醫院）。','不要給水或藥（吞嚥可能已受影響）。'],
rep:'任何 FAST 陽性直接 119，再通報督導。',
ref:'台灣腦中風學會 FAST 辨識口訣；緊急醫療救護法。',
ask:'案主突然單側手無力但十分鐘後好了，他說不用叫救護車，我該怎麼辦？'});

add({db:'event',cat:'急症',t:'低血糖',s:'血糖 <70 或出現冒汗、手抖、心悸、意識混亂：意識清楚給 15 克糖，15 分鐘後再量；意識不清 119。',tags:['低血糖','糖尿病','冒冷汗','15 法則','胰島素'],
why:'低血糖比高血糖更危險，幾十分鐘內就可能昏迷；居家最常見原因是打了胰島素卻沒吃。',
steps:['症狀：冒冷汗、手抖、心跳快、頭暈、突然發脾氣或答非所問、嗜睡。','有血糖機立刻量；沒有血糖機但症狀明顯，先當低血糖處理。','意識清楚、能吞：給 15 克糖——3 顆方糖、150 cc 含糖果汁或汽水、1 湯匙蜂蜜（不要給無糖或代糖）。','15 分鐘後再量，仍 <70 再給一次；回升後給一份含澱粉的點心（餅乾、麵包）。','意識不清、無法吞嚥、抽搐 → 不要餵任何東西，側躺、打 119。','通報督導與家屬，記錄時間、血糖值、給了什麼；找原因（沒吃、藥量、活動太多）。'],
no:['不要在意識不清時餵糖水（會嗆入）。','不要給巧克力（脂肪多吸收慢）。','不要讓案主處理完就獨自睡覺，要有人觀察。'],
rep:'所有低血糖事件通報督導；意識不清或反覆發生 → 119／建議回診調藥。',
ref:'糖尿病衛教學會低血糖處理 15 法則。',
ask:'案主有糖尿病且吞嚥困難，低血糖時可以用哪些安全的含糖食物？'});

add({db:'event',cat:'急症',t:'胸痛、呼吸困難',s:'胸口悶痛超過 5 分鐘、冒冷汗、痛到肩膀下巴、或休息時就喘 → 直接 119，不要自己送醫。',tags:['胸痛','心肌梗塞','呼吸困難','喘','119'],
why:'心肌梗塞的長者常常「只是胸悶、噁心、很累」，症狀不典型；等待就是心肌壞死。',
steps:['讓案主停止活動，半坐姿（呼吸困難者不要平躺），鬆開衣領腰帶。','觀察：胸痛位置、持續多久、冒冷汗、噁心、嘴唇發紫、說話會不會喘。','以下任一 → 119：胸痛超過 5 分鐘或休息不改善、痛到左肩／下巴／背、冒冷汗、呼吸急促說不出完整句子、血氧 <90%。','有醫師開的舌下含片（硝化甘油）且血壓不低，依醫囑協助使用。','等待期間陪伴、量血壓、準備用藥清單，不給食物。','若失去意識且無呼吸 → CPR。'],
no:['不要讓案主自己走去廁所或上下樓。','不要「先躺一下」拖延。','不要自行給止痛藥或家人的心臟藥。'],
rep:'直接 119，再通報督導與家屬。',
ref:'心肌梗塞急救指引；緊急醫療救護法。',
ask:'案主有心臟病史，今天說「胸口悶悶的、有點噁心」但不肯叫救護車，我可以怎麼做？'});

add({db:'event',cat:'急症',t:'抽搐、癲癇發作',s:'不要壓住、不要塞東西進嘴；移開危險物、記錄時間；超過 5 分鐘或第一次發作 → 119。',tags:['抽搐','癲癇','痙攣','119','側躺'],
why:'發作本身通常幾分鐘會停，真正危險的是撞傷、嗆入與持續超過 5 分鐘。',
steps:['看時鐘記下開始時間。','移開周圍會撞到的東西，頭下墊軟物，鬆開衣領。','不要壓制、不要塞東西、不要餵水或藥。','抽搐停止後讓他側躺（復甦姿勢），清口水，保持呼吸道通暢。','觀察清醒過程，通常會很累、混亂，陪伴不要離開。','發作超過 5 分鐘、連續發作、第一次發作、發作後 15 分鐘仍未清醒、受傷、有呼吸困難 → 119。'],
no:['不要試圖打開嘴巴或塞湯匙。','不要用力按住四肢。','發作中不要移動案主（除非在危險處）。'],
rep:'所有抽搐通報督導；符合條件者 119。',
ref:'台灣癲癇醫學會發作處置原則。',
ask:'案主有癲癇病史，發作後很混亂想起來走，我要怎麼安全陪伴？'});

add({db:'event',cat:'急症',t:'發燒與感染徵象',s:'長者發燒可能只有「怪怪的」：食慾差、嗜睡、混亂、跌倒。體溫 ≥38℃ 或比平常高 1℃ 以上就要通報。',tags:['發燒','感染','肺炎','尿路感染','譫妄'],
why:'長者免疫反應弱，肺炎或尿路感染時可能不會明顯發燒，先出現的是意識或行為改變。',
steps:['量體溫並記錄；同時看呼吸次數、血氧、脈搏。','找可能來源：咳嗽有痰（肺）、尿混濁頻尿（泌尿）、傷口紅腫（皮膚）、腹瀉嘔吐（腸胃）。','補充水分、減少衣物、溫水擦拭；不要蓋厚被「逼汗」。','以下 → 119：體溫 ≥39℃ 合併意識改變、呼吸急促、血氧 <92%、血壓下降、皮膚出現紫斑。','其餘通報督導，建議家屬就醫；退燒藥依醫囑。','記錄時間、體溫、症狀與處置。'],
no:['不要自行給退燒藥或抗生素。','不要用酒精擦身體。','不要因為「沒發燒」就忽略突然的混亂或嗜睡。'],
rep:'發燒合併意識改變、呼吸困難、血壓低 → 119；一般發燒通報督導並建議就醫。',
ref:'長者感染徵象辨識原則；譫妄篩檢。',
ask:'案主這兩天突然變得很混亂但體溫正常，除了發燒還可以看哪些感染徵象？'});

add({db:'event',cat:'急症',t:'意識改變、叫不醒',s:'叫不醒或突然反應變差：確認呼吸→側躺→119。有呼吸但叫不醒也要 119。',tags:['意識','昏迷','叫不醒','CPR','復甦姿勢'],
why:'意識改變的原因很多（中風、低血糖、藥物、感染、腦出血），你不需要判斷原因，只需要判斷「要不要打 119」。',
steps:['拍肩大聲叫名字，看有沒有反應。','沒反應：看胸口 10 秒有沒有呼吸；沒有呼吸或只有喘息 → 打 119、開始 CPR（壓胸每分鐘 100–120 下，深度 5 公分）。','有呼吸 → 側躺（復甦姿勢）防嗆入，打 119。','有血糖機時量血糖；有糖尿病且 <70 → 不餵食，等救護。','把用藥清單、健保卡、身分證準備好，通報督導與家屬。','記錄發現時間、當時狀態、你做了什麼。'],
no:['不要搖晃頭頸部。','不要餵水、餵藥。','不要因為「他常常睡很久」就不確認。'],
rep:'直接 119；再通報督導與家屬。',
ref:'基本救命術（BLS）流程；緊急醫療救護法第 14-2 條。',
ask:'案主有簽 DNR（不施行心肺復甦術），我發現他沒有呼吸，我該做什麼？'});

add({db:'event',cat:'管路與用藥',t:'鼻胃管或導尿管脫落',s:'不要自己放回去。鼻胃管脫落停止灌食、記錄外露長度；導尿管脫落看有無出血，通報並安排重新置放。',tags:['鼻胃管','導尿管','脫落','管路','自拔'],
why:'居服員不能執行管路置入；錯誤放回會造成灌食入肺或尿道受傷。',
steps:['鼻胃管完全脫落：暫停灌食與給藥，保留管子給護理看，記錄時間與案主狀況（有無嗆咳）。','鼻胃管部分滑出（刻度和平常不同）：不要推回去、不要灌食，固定好通報。','導尿管脫落：檢查尿道口有無出血，鼓勵喝水，記錄有無自行解尿；8 小時未解尿或下腹脹 → 就醫。','通報督導，依單位流程聯繫居家護理重新置放或安排就醫。','找出脫落原因（案主自拔、固定鬆脫、移位拉扯），與督導討論預防。'],
no:['不要自己把管子塞回去。','脫落後不要繼續灌食。','不要責備案主自拔。'],
rep:'所有管路脫落通報督導；合併出血、呼吸急促、嚴重腹脹 → 119。',
ref:'護理人員法：管路置入屬護理／醫療行為；單位管路異常處理流程。',
ask:'案主一直自拔鼻胃管，不約束的情況下有哪些可以減少自拔的做法？'});

add({db:'event',cat:'管路與用藥',t:'用藥錯誤',s:'發現漏吃、重複吃、吃錯人的藥：不要「補吃」或「催吐」，立刻通報並觀察症狀。',tags:['用藥','吃錯藥','漏藥','重複','藥師'],
why:'處理錯誤的第一反應常是自行補救，但補吃可能變成過量，催吐可能嗆入。',
steps:['確認：吃了什麼、幾顆、幾點、應該吃的是什麼。','立刻通報督導，由單位聯繫藥師、居家護理或醫師判斷是否需要處理。','觀察案主：頭暈、嗜睡、心跳異常、血壓血糖變化、呼吸。','出現意識改變、呼吸困難、抽搐 → 119，並告知吃了什麼藥。','記錄事件與觀察，把藥袋留好。','事後與督導、家屬檢討分藥方式。'],
no:['不要自行補吃或減藥。','不要催吐。','不要隱瞞或把藥藏起來。'],
rep:'所有用藥錯誤通報督導；有症狀 → 119 或毒物諮詢。',
ref:'單位用藥異常通報規範；藥事法。',
ask:'案主早上吃了兩次降血壓藥，目前沒有不舒服，我接下來幾小時要觀察什麼？'});

add({db:'event',cat:'行為與拒絕',t:'案主拒絕服務',s:'先了解原因（身體不適、心情、對人的不信任），可以改方式改時間，不強迫；記錄並通報。',tags:['拒絕','不配合','溝通','服務'],
why:'強迫會傷害關係與案主權益；但完全不處理會讓案主的基本需求被忽略。',
steps:['先確認有沒有身體原因：痛、不舒服、想睡、想上廁所。','用他熟悉的方式再邀請一次：換說法、換順序、先做他喜歡的事。','仍拒絕：尊重，但確認基本安全（有喝水、有吃、環境安全），做可以做的其他項目。','記錄拒絕的項目、你的邀請方式、案主的說法。','通報督導，討論是否需要調整服務內容、時間或人選。','連續拒絕多次，由督導與家屬、個管討論。'],
no:['不要用威脅（「你不洗澡我就回報」）。','不要偷偷做、或在案主睡覺時做。','不要把拒絕記成「案主不配合」而沒有寫原因。'],
rep:'連續拒絕影響基本照顧（不吃、不喝、不清潔超過一天）→ 通報督導；懷疑因病拒絕 → 建議就醫。',
ref:'長期照顧服務法之服務使用者自主權；單位服務規範。',
ask:'案主每次都拒絕我幫他洗澡，但接受另一位服務員，我可以怎麼調整？'});

add({db:'event',cat:'行為與拒絕',t:'情緒激動與攻擊行為',s:'保持距離與出口、降低刺激、不爭辯；有立即危險就離開現場，打電話給督導或 110。',tags:['攻擊','暴力','激動','失智','安全','不法侵害'],
why:'你的安全優先。多數攻擊來自恐懼、疼痛或誤解，降低刺激通常比壓制有效。',
steps:['站在案主側面、保持一個手臂以上的距離，讓自己在靠近門的一側。','語氣放慢放低，說短句：「我知道你很生氣，我先退開一下」。','關掉電視、請旁人離開，減少刺激。','不搶奪、不壓制；他手上有危險物就離開房間。','情緒緩和後再回來，不要追究剛才的事。','有受傷或有立即危險 → 離開現場打 110，並通報督導；事後依不法侵害流程處理與記錄。'],
no:['不要背對案主或把自己困在角落。','不要嘗試單獨制伏。','不要事後獨自承受，這是職場不法侵害，單位有責任處理。'],
rep:'所有攻擊行為通報督導並記錄；受傷 → 就醫留診斷書，依職災與不法侵害程序處理。',
ref:'職業安全衛生法第 6 條第 2 項（執行職務因他人行為遭受身體或精神不法侵害之預防）；失智症行為處理原則。',
ask:'案主失智且有打人紀錄，請幫我列出每次進門前可以做的 5 個安全準備。'});

add({db:'event',cat:'環境與人身',t:'無人應門、失聯',s:'打電話、敲門、問鄰居、聯繫緊急聯絡人與督導；獨居且有異狀（燈開、有異味、有聲音）→ 110／119。',tags:['失聯','獨居','沒開門','安全看視'],
why:'獨居長者在家中倒下無人發現是最令人遺憾的事件，你可能是唯一會發現的人。',
steps:['敲門、按鈴、打案主電話各 2–3 次，間隔幾分鐘。','觀察：燈有沒有開、鞋子在不在、有無異味、有無呼救或電視聲。','打電話給緊急聯絡人／家屬確認是否外出、住院。','聯繫督導，由單位決定是否請家屬開門或請警消協助。','有明顯異狀（聽到呻吟、聞到瓦斯或腐敗味）→ 直接 110／119。','記錄到達時間、嘗試聯繫的方式與結果。'],
no:['不要自行破門或爬窗。','不要只留紙條就離開而沒有通報。'],
rep:'所有失聯通報督導；有異狀直接 110／119。',
ref:'單位服務異常處理規範；長照給付及支付基準 BA22 安全看視相關。',
ask:'我到案家 20 分鐘沒人應門，家屬電話也不接，請幫我列出接下來要做的事與順序。'});

add({db:'event',cat:'環境與人身',t:'瓦斯味、火災、觸電',s:'瓦斯：不開電器、開窗、關總開關、帶案主離開再打 119。火災：先帶人離開，關門，到安全處再報案。',tags:['瓦斯','火災','觸電','逃生','119'],
why:'居家火災與瓦斯外洩多發生在有長者的家庭，你的一個動作（開燈）可能引爆。',
steps:['瓦斯味：不開關任何電器（包含燈與抽風機）、不打火機；輕輕開窗、關瓦斯總開關，帶案主到屋外再打 119 與瓦斯公司。','小火（鍋子起火）：關火源、蓋鍋蓋，不要潑水。','火勢無法控制：帶案主離開，離開時關門（減緩火勢），不搭電梯，到安全處打 119。','行動不便者：用棉被包裹拖行或用輪椅、椅子搬運；濃煙時放低身體。','觸電：先切斷電源（總開關）再碰案主，不能切斷就用乾木棍撥開；無呼吸 → CPR、119。','通報督導與家屬，記錄。'],
no:['不要為了搶救財物回到火場。','不要在瓦斯味中開燈或打電話（到屋外再打）。','不要直接用手拉觸電的人。'],
rep:'直接 119；事後通報督導。',
ref:'消防署居家防火與逃生指引。',
ask:'案主家瓦斯爐常常忘記關，除了叮嚀還有哪些安全裝置或做法可以建議家屬？'});

add({db:'event',cat:'特殊事件',t:'疑似受虐、疏忽或不當對待',s:'看到傷痕、長期不潔、被鎖、被辱罵、財物被侵占：不追問、不對質，記錄事實，24 小時內通報。',tags:['虐待','疏忽','113','通報','老人保護'],
why:'居服員是法律上的責任通報人員，看見而不通報不只是道德問題，也有法律責任。',
steps:['觀察並記錄事實：傷痕位置形狀（指印、勒痕、燙痕）、時間、案主的說法（用引號原文）、環境狀況（有無食物、清潔、藥物）。','不對家屬對質、不責備、不承諾「我不會說出去」。','確認案主當下安全；有立即危險 → 110。','立即通報督導，由單位依規定 24 小時內通報 113 或地方主管機關；你也可以直接打 113。','保護案主與自己的隱私，不在群組討論。','後續依單位與社工指示配合。'],
no:['不要拍案主傷處上傳群組（可依單位指示由督導處理）。','不要因為「家屬平常人很好」就不通報。','不要自己去「教訓」家屬。'],
rep:'通報督導＋113（保護專線），24 小時內完成法定通報。',
ref:'老人福利法第 43 條（責任通報，至遲 24 小時內）；身心障礙者權益保障法第 76 條；家庭暴力防治法第 50 條。',
ask:'我看到案主手臂有像手指抓握的瘀青，家屬說是自己撞到的，請幫我寫一份客觀的觀察紀錄。'});

add({db:'event',cat:'特殊事件',t:'發現案主疑似死亡',s:'確認無呼吸無脈搏：無 DNR 就 CPR＋119；有 DNR 或明顯死亡徵象則不移動、不整理現場，通報 119／110 與督導。',tags:['死亡','DNR','屍僵','119','110'],
why:'居服員無法宣告死亡；現場處理方式會影響後續法律程序，也要照顧自己的心情。',
steps:['叫不醒、無呼吸、無脈搏：若無明顯死亡徵象（屍僵、屍斑、身體冰冷）且無 DNR → 打 119 並 CPR。','有 DNR（安寧緩和意願）或明顯死亡徵象 → 不施救、不移動身體、不整理現場、不拔管。','打 119（由救護或醫師確認），非自然死亡或情況不明時警方會到場，配合說明。','立即通報督導與家屬；不要自己一個人待太久，請督導或家屬到場。','記錄發現時間、當時狀態、你做的事、通報對象。','事後與督導談一談，單位應提供心理支持。'],
no:['不要移動遺體或清理環境。','不要自行通知殯葬業者。','不要對外談論案主死因。'],
rep:'119／110＋督導＋家屬。',
ref:'安寧緩和醫療條例（DNR）；刑事訴訟法非自然死亡報驗程序。',
ask:'我第一次遇到案主過世，事後一直很難過，有哪些方法可以幫助自己，單位應該提供什麼支持？'});

add({db:'event',cat:'特殊事件',t:'服務員自身受傷（閃到腰、被咬、針扎、跌倒）',s:'先處理傷口、就醫留診斷書、當天通報，這是職業災害，有公傷假與給付。',tags:['職災','受傷','針扎','腰傷','診斷書'],
why:'很多居服員受傷不通報、自己貼藥布，結果變成慢性傷害還拿不到任何保障。',
steps:['先確保案主安全（若你無法繼續服務，通報督導安排接替）。','傷口處理：出血壓迫、針扎立即擠血並用清水沖洗、動物咬傷沖洗 15 分鐘。','當天就醫，告訴醫師「工作時受傷」，取得診斷書。','當天通報督導，填寫職災通報；針扎要抽血追蹤。','保留病歷、收據、當天服務紀錄與相關證據。','依勞工職業災害保險及保護法申請給付，請公傷病假（不扣薪）。'],
no:['不要「休息幾天就好」而不記錄。','不要自己吃止痛藥繼續工作。','不要因為怕麻煩單位而不通報。'],
rep:'通報督導、職災通報；需要時向勞工局或 1955 諮詢。',
ref:'勞工職業災害保險及保護法；勞工請假規則第 6 條（公傷病假）；職業安全衛生法。',
ask:'我搬案主時閃到腰，已經看過醫生，請告訴我申請職災給付要準備哪些文件與流程。'});

add({db:'event',cat:'特殊事件',t:'疥瘡、傳染病與隔離',s:'案主有不明全身癢、夜間更癢、指縫紅疹 → 疑似疥瘡；戴手套穿隔離衣，通報並安排就醫，衣物熱水處理。',tags:['疥瘡','傳染病','隔離','防護','手套'],
why:'疥瘡在居家與機構傳播很快，服務員本身也是傳播鏈的一環。',
steps:['防護：一次性手套、隔離衣或工作服，服務後洗手並更換衣物。','疑似疥瘡：通報督導，建議就醫確診；案主與同住者要同時治療。','衣物、床單用 60℃ 以上熱水洗或密封塑膠袋 7 天以上。','你自己出現癢或紅疹也要就醫，這屬於職業病。','其他傳染病（流感、腸胃炎、COVID）：戴口罩、勤洗手、有症狀依單位規範調整服務。'],
no:['不要在未防護下處理案主衣物床單。','不要隱瞞自己有症狀繼續服務。'],
rep:'通報督導；依單位感染管制規範。',
ref:'疾管署疥瘡防治指引；單位感染管制規範。',
ask:'案家有人確診疥瘡，我今天服務完該做哪些清潔與後續追蹤？'});

/* ---------- 法律問題 ---------- */
add({db:'law',cat:'不法侵害與性騷擾',t:'什麼是「執行職務遭受不法侵害」',s:'案主或家屬對你的言語辱罵、恐嚇、肢體暴力、性騷擾，都是職場不法侵害；雇主有法定預防與處理義務。',tags:['不法侵害','職安法','暴力','辱罵','雇主義務'],
why:'很多居服員以為「被案主罵是工作的一部分」，法律不是這樣看的。',
steps:['四種型態：肢體暴力（打、推、丟東西）、心理暴力（辱罵、恐嚇、羞辱）、語言暴力、性騷擾。','事件當下：確保安全、離開現場、通報督導（電話）。','當天記錄：時間、地點、對方言行（原文）、你的反應、有無目擊者、有無錄音。','單位依法應：受理、調查、提供協助（醫療、心理、法律）、必要時更換服務員或終止服務、預防再發。','你可以要求單位提供處理結果；單位不處理可向勞工局申訴。','受傷就醫留診斷書，屬職災。'],
no:['不要覺得「忍一忍就好」而不記錄。','不要與對方單獨對質。','不要私下和解或接受金錢息事寧人。'],
rep:'通報督導＋書面記錄；單位未處理 → 地方勞工局申訴或 1955。',
ref:'職業安全衛生法第 6 條第 2 項第 3 款；職業安全衛生設施規則第 324-3 條（雇主應訂定執行職務遭受不法侵害預防計畫）；勞動部《執行職務遭受不法侵害預防指引》。',
ask:'請幫我把這段經歷整理成不法侵害通報紀錄，並列出我可以向單位主張的處理項目：（描述事件）。'});

add({db:'law',cat:'不法侵害與性騷擾',t:'遭案主或家屬性騷擾',s:'性騷擾不是你的錯。明確拒絕、離開、當天通報單位；單位依性別平等工作法必須受理調查並保護你。',tags:['性騷擾','性平法','申訴','拒絕服務','錄音'],
why:'居服員在私人住宅工作、身體接觸多，是性騷擾高風險職業；2024 年修法後雇主責任更明確。',
steps:['當下：明確說「請你停止，這是性騷擾」，離開現場，不需要繼續服務。','當天：電話通報督導並書面記錄（時間、地點、言行原文、身體接觸部位、目擊者）。','向單位提出申訴；單位應立即採取有效糾正及補救措施（調整服務、更換案主、協助就醫或心理支持）。','可同時向地方勞工局申訴（雇主未處理），或依性騷擾防治法向縣市主管機關申訴、向警方報案。','申訴時效：性平法規定自知悉起 2 年內、事件發生起 5 年內；建議盡快。','嚴重（強制觸摸）可提刑事告訴（性騷擾防治法第 25 條）。'],
no:['不要因為對方失智或年紀大就「算了」——仍應通報，由單位評估處理方式。','不要刪除訊息、照片等證據。','不要自己一個人再回去同一個案家。'],
rep:'通報督導＋申訴；勞工局／1955／113／110。',
ref:'性別平等工作法第 12、13 條（雇主防治義務與知悉後之處理）；性騷擾防治法；職業安全衛生法第 6 條第 2 項。',
ask:'案主家屬多次對我說有性暗示的話，我已經跟督導講但沒下文，我還可以怎麼做？'});

add({db:'law',cat:'不法侵害與性騷擾',t:'遭肢體暴力受傷',s:'先就醫驗傷取得診斷書，報警備案，通報單位；傷害罪是告訴乃論，6 個月內要提告。',tags:['暴力','傷害罪','驗傷','報警','告訴乃論'],
why:'受傷後最重要的是「證據」與「時間」，錯過就無法追究。',
steps:['離開現場確保安全，打 110（有立即危險）。','當天就醫驗傷，向醫師說明是被他人所傷，取得診斷書。','向警方報案備案（不一定要立刻提告，但要有紀錄）。','通報督導，填寫不法侵害與職災通報。','保留證據：傷勢照片、對話紀錄、目擊者聯絡方式。','是否提告與單位、法扶討論；傷害罪（刑法第 277 條）告訴乃論，需在知悉起 6 個月內提出。'],
no:['不要回手（會變互毆）。','不要接受口頭道歉就撤回通報。'],
rep:'110＋就醫＋通報督導；法律諮詢可找法律扶助基金會或勞工局。',
ref:'刑法第 277 條傷害罪；刑事訴訟法第 237 條告訴期間 6 個月；勞工職業災害保險及保護法。',
ask:'案主家屬推我撞到桌角瘀青，我要不要提告？請列出提告與不提告各自的後果。'});

add({db:'law',cat:'通報責任',t:'老人受虐、疏忽的責任通報',s:'居服員屬責任通報人員：知悉老人疑似受虐、疏忽、遺棄、財物侵占，至遲 24 小時內通報。',tags:['老人福利法','責任通報','24 小時','113','罰鍰'],
why:'責任通報是法律義務，未通報可處罰鍰；通報後由主管機關處理，你不需要自己調查。',
steps:['通報情形：身體虐待、精神虐待、疏忽（不給食物、藥、清潔）、遺棄、財物侵占、留置於危險環境。','發現後記錄事實，立即通報督導，由單位向地方主管機關通報（也可直接撥 113），至遲 24 小時內。','通報內容：案主基本資料、你觀察到的事實、時間、可能的加害人（只寫觀察不下結論）。','通報人資料受保密保護。','後續配合社工訪視。'],
no:['不要等「確定是虐待」才通報，法律要求的是「疑似」就通報。','不要因為擔心家屬報復而不通報，通報人身分是保密的。'],
rep:'督導＋113（24 小時內）。',
ref:'老人福利法第 43 條（醫事、社工、村里長、警察、其他執行老人福利業務相關人員之責任通報；未通報處新臺幣 6,000 元以上 30,000 元以下罰鍰）；第 41、51 條。',
ask:'案主家裡冰箱沒有食物、藥都過期，家屬一週才來一次，這算疏忽嗎？我要怎麼通報？'});

add({db:'law',cat:'通報責任',t:'身心障礙者與家暴事件通報',s:'身心障礙案主受虐同樣 24 小時內通報；同住家人間的暴力屬家庭暴力，也是責任通報。',tags:['身權法','家暴','通報','113','保護令'],
why:'案主不一定是老人，也可能是身心障礙者；施暴者若是家人，同時涉及家暴防治。',
steps:['身心障礙者：疑似遺棄、虐待、身心侵害、財物侵占、留置危險環境 → 24 小時內通報。','家庭暴力：家人間的身體、精神、經濟虐待 → 通報 113，被害人可聲請保護令。','記錄事實、通報督導、由單位或你直接撥 113。','案主有立即危險 → 110。','通報後配合社工與主管機關。'],
no:['不要試圖調解家庭糾紛。','不要在加害人面前討論通報事宜。'],
rep:'督導＋113；立即危險 110。',
ref:'身心障礙者權益保障法第 76 條（責任通報 24 小時）、第 75 條（禁止行為）；家庭暴力防治法第 50 條。',
ask:'案主是 50 歲身心障礙者，他哥哥常大聲辱罵他並扣住他的補助款，這屬於什麼通報範圍？'});

add({db:'law',cat:'個資與隱私',t:'案主個資與隱私保護',s:'案主的病情、住址、家庭狀況、照片都是個資：不拍照上傳、不在群組討論、不對外透露。',tags:['個資','個資法','隱私','照片','LINE'],
why:'把案主照片傳到群組「請教同事」是最常見的違法情形，可能涉及刑責與民事賠償。',
steps:['服務紀錄只寫在單位系統或指定表單，不存在個人手機。','需要拍照（傷口、環境）時依單位規範由督導指示，且不拍臉、不上傳私人群組。','案主資料不透露給非授權的人，包含鄰居、其他案家、自己的家人。','離職或結案後不保留案主資料。','案主或家屬詢問其他案主狀況一律不回答。','發現同事違規，向督導反映。'],
no:['不要在社群媒體發案主的照片、影片，即使沒露臉。','不要用私人 LINE 傳案主病歷、身分證影本。','不要因為「是為了案主好」就把資料給非授權的人。'],
rep:'發現個資外洩通報督導，由單位依個資法處理。',
ref:'個人資料保護法第 5、20、41 條（非法利用個資可處刑責）；長期照顧服務法保密義務；單位資訊安全規範。',
ask:'家屬要求我把每天服務時案主的照片傳給他，這樣做有沒有問題？我可以怎麼回應？'});

add({db:'law',cat:'個資與隱私',t:'錄音錄影自保的法律界線',s:'你在場參與的對話可錄音自保；但不得偷拍案主身體、私密空間，不得公開或散布。',tags:['錄音','錄影','蒐證','刑法 315-1','妨害秘密'],
why:'錄音是遭辱罵、性騷擾時最有效的證據，但方式錯了自己反而觸法。',
steps:['原則：你本人參與的對話，為了保護自己的權益而錄音，實務上多認為不構成妨害秘密。','錄音內容只提供給單位、警方、法院，不放到網路、不傳群組。','不得拍攝案主更衣、如廁、沐浴等私密活動，即使是為了「證明我有做」。','案家有監視器：家屬有權在自家裝設，但若拍攝浴室或用來羞辱、散布，可反映單位處理。','錄到的內容妥善保存，並在通報時告知督導有錄音。'],
no:['不要放錄音設備在案家後離開（非本人參與的對話屬偷錄）。','不要用錄音威脅對方。','不要剪接或只提供片段。'],
rep:'錄音證據交由督導與單位保存；涉及訴訟由律師或法扶協助。',
ref:'刑法第 315-1 條（無故竊錄他人非公開活動、言論、談話或身體隱私部位）；通訊保障及監察法第 29 條第 3 款；個人資料保護法。',
ask:'我想在每次服務時用手機錄音保護自己，需要先告知案主嗎？有哪些情況不能錄？'});

add({db:'law',cat:'服務界線',t:'居服員不能做的醫療行為',s:'打針、換管、抽血、換藥（深層傷口）、決定藥量、氣管內深抽痰等屬醫療或護理行為，不能做，即使家屬拜託。',tags:['醫療行為','護理','醫師法','界線','家屬要求'],
why:'做了不該做的醫療行為，出事時是刑事責任（密醫罪），單位保險也不會保。',
steps:['可以做（且需訓練）：協助進食與鼻胃管灌食、口腔內分泌物抽吸、翻身拍背、肢體關節活動、測量生命徵象、協助服藥（提醒與確認）。','不能做：注射（含胰島素）、更換鼻胃管或導尿管、抽血、傷口清創與縫合、決定或調整藥物劑量、氣管內管深部抽痰（除非完成 BA17 訓練且核定）、灌腸。','家屬要求時：明確說明「這個項目依規定要由護理師執行，我可以幫忙聯繫居家護理」，並回報督導。','不確定就問督導，不要當場答應。','記錄家屬的要求與你的回應。'],
no:['不要因為「家屬平常都自己打」就幫忙打胰島素。','不要在家屬指導下執行不熟悉的操作。'],
rep:'家屬持續要求 → 通報督導，由單位說明並轉介居家護理。',
ref:'醫師法第 28 條（非醫師執行醫療業務之處罰）；護理人員法第 24 條；長照給付及支付基準所列照顧服務員可執行項目。',
ask:'家屬希望我幫案主打胰島素，說他們都是這樣做的，我要怎麼拒絕又不傷關係？'});

add({db:'law',cat:'服務界線',t:'核定項目以外的要求（幫全家打掃、代照顧其他人）',s:'只做核定給案主本人的項目；幫家屬打掃、顧小孩、照顧其他長輩都超出範圍，婉拒並回報。',tags:['服務範圍','核定','家務','家屬要求','越界'],
why:'超出核定範圍不只是不能申報，出事沒有保障，也會讓案主真正需要的服務被排擠。',
steps:['服務前看清楚核定的項目與時數。','家務協助限案主本人使用的空間與物品（案主房間、案主餐具）。','遇到要求：「這個項目不在核定範圍內，我不方便做，需要的話可以請督導評估」。','當天回報督導，記錄要求內容。','若案主本人有其他需求，由督導與個管員討論調整計畫。'],
no:['不要「偶爾幫一下」——一次就會變常態。','不要接受額外付費私下服務（違反單位規定並失去保障）。'],
rep:'回報督導處理。',
ref:'長期照顧服務申請及給付辦法之給付項目；單位服務契約。',
ask:'家屬每次都要我順便煮全家的晚餐，請給我三種不同語氣的拒絕說法。'});

add({db:'law',cat:'金錢與財產',t:'金錢、饋贈與代購',s:'不收禮金、不代管存摺印章提款卡、不借貸；代購一律留收據、當面交付、記錄。',tags:['金錢','饋贈','代購','存摺','侵占'],
why:'金錢糾紛是居服員被指控最常見的原因；一旦被指控，沒有紀錄幾乎無法自證。',
steps:['禮物：小額食物可依單位規定收受並回報；現金、紅包、貴重物品一律婉拒。','代購（核定項目時）：先拿錢、購買後當面交付找零與收據，紀錄品項與金額。','不代管案主的存摺、印章、提款卡、密碼；家屬要求也不行。','不借錢給案主、不向案主借錢。','案主主動要給錢、要「留東西給你」，當天回報督導並記錄。'],
no:['不要用自己的錢先墊付再請款（容易有爭議）。','不要幫案主領錢、轉帳、操作網路銀行。','不要接受案主「幫我保管」任何有價物品。'],
rep:'案主或家屬主動給予金錢 → 回報督導；被指控侵占 → 立即通報，保留所有收據紀錄。',
ref:'刑法第 335 條侵占罪、第 339 條詐欺罪；單位廉潔與收受饋贈規範。',
ask:'案主每次都硬要塞紅包給我，我已經拒絕很多次，請幫我想一個溫和但堅定的回應。'});

add({db:'law',cat:'金錢與財產',t:'遺囑見證、財產與保險受益人',s:'不擔任遺囑見證人、不介入財產分配、不成為受益人；被要求時回報督導。',tags:['遺囑','見證','財產','受益人','繼承'],
why:'居服員與案主有信賴關係，一旦涉及財產就容易被家屬質疑不當影響，甚至遺囑無效。',
steps:['案主提到要立遺囑、要把財產或保險給你 → 說明「我不能涉入這些事」，並當天回報督導。','不簽任何與財產、借據、契約有關的文件（包括當見證人）。','家屬之間的財產糾紛不表態、不傳話。','案主需要法律協助時，建議由家屬或社工聯繫法扶或律師。'],
no:['不要因為「案主堅持」就簽名。','不要幫案主保管遺囑或重要文件。'],
rep:'回報督導處理。',
ref:'民法第 1198 條（受遺贈人及其配偶、直系血親不得為遺囑見證人）；單位倫理規範。',
ask:'案主說要把房子留給我，因為家人都不理他，我該怎麼回應才不傷他的心？'});

add({db:'law',cat:'責任與免責',t:'案主在服務中受傷，我的責任？',s:'依標準作業執行、有記錄、有通報，就不會構成過失；未依規定操作或隱瞞才有責任。',tags:['責任','過失傷害','民事','刑法 284','保險'],
why:'害怕被告是居服員最大的壓力來源，但法律看的是「有沒有照規定做」，不是「有沒有出事」。',
steps:['過失責任的判斷：你有沒有做到一個合格居服員應做的注意（依訓練與 SOP）。','保護自己的三件事：依 SOP 操作、每次服務有紀錄、異常立即通報。','受傷發生時：先處理案主，再通報，記錄事實（不寫「我的錯」也不寫「不是我的錯」）。','單位通常有公共意外責任險，賠償與談判由單位處理，你不要私下承諾。','若被家屬提告，立即通知單位並請求法律協助（法扶、單位法律顧問）。','刑法過失傷害為告訴乃論，民事則可能求償醫療費等。'],
no:['不要私下向家屬道歉認錯或承諾賠償。','不要修改或補寫紀錄。','不要與家屬單獨協商。'],
rep:'通報督導；被提告時通知單位並尋求法扶。',
ref:'刑法第 284 條過失傷害（告訴乃論）；民法第 184、188 條侵權行為與雇用人責任；單位責任保險。',
ask:'案主在我協助移位時跌坐地上，家屬說要告我，我現在應該做什麼、不應該做什麼？'});

add({db:'law',cat:'責任與免責',t:'急救免責（善意救助）',s:'非救護人員為了救人做急救（CPR、哈姆立克、止血），法律有緊急避難免責規定，不用怕做錯被告。',tags:['急救','免責','CPR','緊急避難','善意'],
why:'不少人因為怕壓斷肋骨被告而不敢 CPR，但法律鼓勵你救人。',
steps:['緊急醫療救護法規定：救護人員以外之人，為免除他人生命之急迫危險而施予急救措施，適用民法、刑法緊急避難免責。','做急救時依你受過的訓練做，並同時打 119。','急救後通報督導、記錄過程。','有 DNR 的案主：尊重意願不施行 CPR，但仍要 119 確認並通報。'],
no:['不要因為怕責任而不施救。','不要做超出你能力的處置（例如自行給藥）。'],
rep:'119＋督導。',
ref:'緊急醫療救護法第 14-2 條；民法第 150 條、刑法第 24 條緊急避難。',
ask:'我做 CPR 時聽到案主肋骨斷的聲音，這樣會有法律責任嗎？'});

add({db:'law',cat:'責任與免責',t:'被指控偷竊或損壞財物',s:'冷靜、不私下和解、立即通報單位；保留當天紀錄，必要時由單位陪同報警釐清。',tags:['偷竊','指控','誣告','財物','督導'],
why:'失智案主常把「找不到」說成「被偷」，家屬也可能誤會；處理方式決定你會不會被拖進法律程序。',
steps:['當場保持冷靜，不要爭吵，說「我了解你很擔心，請讓單位來處理」。','不要答應賠償、不要私下給錢。','立即通報督導，由單位介入溝通。','提供你當天的服務紀錄、到離時間、有無其他人在場。','若對方報警，配合說明，可請單位陪同；若指控不實且持續散布，可諮詢法扶（誹謗、誣告）。','平時預防：貴重物品區不進入、抽屜不翻、案家的錢由案主或家屬自己拿。'],
no:['不要自己翻找證明清白。','不要簽任何承認或賠償的文件。'],
rep:'通報督導處理；必要時警方與法扶。',
ref:'刑法第 320 條竊盜罪、第 169 條誣告罪、第 310 條誹謗罪；單位申訴與處理流程。',
ask:'案主家屬說錢包少了 3000 元，暗示是我拿的，我該怎麼回應與後續處理？'});

add({db:'law',cat:'勞動權益',t:'職業災害的認定與權益',s:'工作中或往返案家途中受傷、因工作得的病（腰傷、疥瘡）都是職災，享有公傷病假與保險給付。',tags:['職災','通勤','公傷假','給付','1955'],
why:'居服員是職災高風險職業，但通報率極低；知道自己的權利才能保護自己。',
steps:['範圍：服務中受傷、兩案家之間或上下班合理路線的交通事故、因工作導致的疾病。','當天就醫並告知醫師是工作受傷，取得診斷書。','通報單位並填職災通報單；雇主有法定通報義務。','請公傷病假：治療、休養期間工資照給。','向勞保局申請職災保險給付（醫療、傷病、失能）；單位應協助。','若單位不協助，可向地方勞工局申訴或撥 1955。'],
no:['不要用普通傷病假處理職災（會扣薪）。','不要在還沒好時被要求提早回來上班。'],
rep:'單位職災通報；勞工局／1955。',
ref:'勞工職業災害保險及保護法；勞工請假規則第 6 條；職業安全衛生法第 37 條（雇主通報義務）。',
ask:'我從甲案家騎車去乙案家途中被撞，這算職災嗎？請告訴我要準備的文件與申請步驟。'});

add({db:'law',cat:'勞動權益',t:'有立即危險時可以退避',s:'案家有立即危險（火災、瓦斯、暴力、嚴重傳染病無防護）時，可以停止作業並退到安全處，不會因此被懲處。',tags:['退避權','職安法','危險','拒絕服務','安全'],
why:'你有權在危險發生時先保護自己，法律明文保障，且雇主不得因此處罰。',
steps:['判斷：現場是否有立即發生危險之虞（人身暴力、火災、瓦斯、結構危險、無防護的傳染病）。','退避到安全處，立即通知督導。','記錄危險情況與退避時間。','後續由單位評估是否更換服務員、改善環境或終止服務。','雇主不得對退避的勞工予以解僱、調職、不給工資或其他不利處分。'],
no:['不要為了「服務時數」硬撐在危險環境。','不要退避後不通知單位。'],
rep:'督導；有危險 110／119。',
ref:'職業安全衛生法第 18 條（勞工退避權，雇主不得予以不利處分）。',
ask:'案主兒子酒後常常在家發脾氣摔東西，我可以拒絕去嗎？要怎麼跟單位說？'});

add({db:'law',cat:'勞動權益',t:'工時、休息與紀錄',s:'居服員適用勞動基準法：出勤要有紀錄、每 4 小時休息 30 分鐘、加班要有加班費，交通時間依約定計算。',tags:['勞基法','工時','加班','出勤','交通'],
why:'排班破碎、案家之間移動時間長，是居服員最常見的勞動爭議。',
steps:['確認勞動契約：是月薪、時薪或按服務時數計酬，交通時間怎麼算。','出勤紀錄要真實（打卡或 APP），不要事後補。','每日工時超過 8 小時或每週超過 40 小時要有加班費或補休。','案家之間的移動時間是否計入工時，依契約與勞動部解釋，有疑義可詢問勞工局。','薪資單要看得懂：基本工資、加班費、勞健保、勞退。','有爭議先與單位溝通，再向勞工局申訴或申請調解（免費）。'],
no:['不要接受「口頭約定」的薪資與工時。','不要簽署自願放棄加班費的文件。'],
rep:'單位人資／勞工局／1955。',
ref:'勞動基準法第 30、32、35 條；勞動事件法（勞資爭議調解）。',
ask:'我一天跑 5 個案家、中間移動 2 小時，單位只算服務時數，這合理嗎？我可以怎麼確認？'});

/* ---------- 補充：行政、交通、推銷、文書 ---------- */
add({db:'event',cat:'通報流程',t:'訪視未遇（到現場但沒遇到案主）',s:'等候並嘗試聯繫、留下到訪紀錄、通報督導；未遇的時段不能登載為服務，也不能補寫。',tags:['訪視未遇','未遇','空跑','紀錄','申報'],
why:'未遇最常出事的不是安全，而是「紀錄」：把沒服務的時段寫成有服務，就是登載不實。另一種風險是把未遇當小事，錯過案主真的倒在屋內的訊號。',
steps:['準時到達後敲門、按鈴、打案主與家屬電話各 2–3 次，等候依單位規定（常見 15–30 分鐘）。','等候時觀察有沒有異狀：燈是否亮、鞋是否在、有沒有聲音或異味——有異狀改依「無人應門、失聯」處理，直接 110／119。','沒有異狀：拍下門口（不拍室內、不拍門牌以外的個資）作為到訪證明，依單位規定留下聯絡便條。','電話通報督導，由督導決定是否等待、改期或安排其他案家。','當天紀錄寫「訪視未遇」：到達與離開時間、嘗試聯繫的方式與結果、督導指示；不登載為服務時數。','連續未遇 2 次以上，由督導與個管員了解原因（住院、出遊、家屬安排、想終止服務）並調整計畫。'],
no:['不要把未遇時段寫成已服務，也不要「改天多做一點補回來」卻仍登載原日期。','不要自行決定「下次再來就好」而不通報。','不要把等候時間拉到超過單位規定卻沒有回報。'],
rep:'督導；連續未遇 → 個管員；有異狀 → 110／119。',
ref:'長期照顧服務申請及給付辦法（服務須實際提供方得申報）；單位訪視未遇處理與交通補助規定；刑法第 215 條業務登載不實。',
ask:'我到案家等了 20 分鐘沒人在，家屬說臨時帶去看醫生，這一次的服務紀錄要怎麼寫才正確？'});

add({db:'event',cat:'環境與人身',t:'服務途中或陪同外出發生交通意外',s:'先確認人員安全並打 110／119，不移車、不私下和解、拍照留證，當天通報單位；往返案家途中的事故屬職災。',tags:['交通意外','車禍','職災','陪同外出','和解','BA13','BA14'],
why:'居服員一天跑多個案家，交通事故是最常見的職災，也是最容易因為「怕麻煩」而放棄權益的一種。',
steps:['先確認自己與案主有沒有受傷；有人受傷或不確定就打 119，任何事故都打 110 請警方到場做紀錄（後續職災、保險都需要）。','車輛不要移動（除非在危險處），開雙黃燈、放三角警示。','拍照：現場全景、雙方車輛與車損、車牌、路口號誌，並記下對方姓名、電話、車號與保險公司。','不要當場談和解或簽任何文件，不要說「是我的錯」。','立即電話通報督導；陪同案主外出時，同時通知家屬並記錄案主狀況。','當天就醫（即使覺得沒事，隔天才痛的很多），告知醫師是工作途中受傷，取得診斷書。','向單位填職災通報，向警方申請「道路交通事故初步分析研判表」，依勞工職業災害保險申請給付；若你騎乘自己的車，也向自己的保險公司通報。'],
no:['不要以為騎自己的機車出事就不算職災——上下班與案家之間合理路線的交通事故都算。','不要為了趕下一個案家離開現場。','不要收對方現金私了。'],
rep:'110／119 → 督導（陪同案主時加通知家屬）→ 職災通報。',
ref:'勞工職業災害保險及保護法（通勤及因公外出之交通事故）；道路交通事故處理辦法；長照給付及支付基準 BA13 陪同外出、BA14 陪同就醫。',
ask:'我騎機車從案家到下一個案家途中被撞，對方要私下和解給我 5000 元，我該怎麼判斷、後續要準備哪些文件？'});

add({db:'law',cat:'金錢與財產',t:'案主或家屬向我推銷（直銷、保險、宗教、保健食品）',s:'一律婉拒、不購買、不入會、不留個資、不介紹別人；回報督導記錄，讓單位協助設定界線。',tags:['推銷','直銷','保險','宗教','人情'],
why:'買一次通常不會只買一次；一旦有金錢往來，服務關係就變成人情關係，之後要拒絕更困難，也容易衍生糾紛。',
steps:['用「單位規定」當理由，簡短堅定：「我們單位規定服務期間不能跟案家有買賣或金錢往來，請見諒。」','不填任何資料、不加 LINE 群組、不收試用品或型錄。','對方持續推銷或以「不買就不讓你服務」施壓 → 當天回報督導，由單位出面說明。','若推銷內容疑似詐騙或案主本身被推銷而大量花錢，觀察並回報，必要時依疏忽或財物侵占通報。','記錄推銷的內容、時間與你的回應。'],
no:['不要「先買一次表示支持」。','不要幫忙轉介同事、其他案家或家人。','不要因為是宗教就覺得可以參加聚會或捐獻。'],
rep:'督導；案主疑似被詐騙或財物受損 → 165／113。',
ref:'單位倫理與收受饋贈規範；多層次傳銷管理法（違法多層次傳銷之檢舉）；老人福利法第 43 條（財物侵占屬通報範圍）。',
ask:'案主的女兒是直銷商，每次都要我買保健食品並說案主也在吃，請給我兩種可以維持關係又明確拒絕的說法。'});

add({db:'law',cat:'服務界線',t:'我自己向案主推銷或銷售',s:'利用服務關係向案主推銷任何產品、直銷、保險、宗教、募款，都違反單位規範與職業倫理，可能被解約，宣稱療效或賣藥還會觸法。',tags:['推銷','銷售','直銷','保健食品','療效','倫理'],
why:'案主與家屬信任你，這種信任讓他們很難拒絕；法律與倫理都認定這是「利用弱勢地位的不當得利」，出事時你沒有任何保障。',
steps:['原則：服務期間與結案後合理期間內，不向案主或家屬銷售、推薦或代購任何自己有利益的商品、服務或組織。','案主主動問「你有沒有推薦的保健食品」：只提供一般衛教資訊，建議諮詢醫師、藥師或營養師，不給品牌、不代購。','保健食品或用品不得宣稱治療、預防疾病的效果；販售藥品需要藥商許可，居服員不得為之。','推銷保險、投資、宗教捐獻，若造成案主損失，可能涉及民事賠償甚至詐欺、背信。','單位發現通常直接終止契約，並可能通報主管機關。','有想推廣的產品或副業，與案主完全切開，不在服務時間、不對案家。'],
no:['不要說「這個我自己也在吃、很有效」——這就是療效宣稱。','不要用「我幫你買比較便宜」代購自己有抽成的商品。','不要邀請案主或家屬參加你的直銷、宗教或投資聚會。'],
rep:'單位倫理規範；被檢舉時由主管機關與單位處理。',
ref:'食品安全衛生管理法第 28 條（食品不得宣稱醫療效能）；藥事法第 27 條（販賣藥品須領有藥商許可執照）；刑法第 339 條詐欺、第 342 條背信；單位服務契約與倫理守則。',
ask:'我平常有在做保健食品的副業，案主主動問我能不能買，我可以怎麼回應才不違反規定？'});

add({db:'law',cat:'責任與免責',t:'服務紀錄不實（時間不對、沒做寫有做）＝偽造文書',s:'紀錄寫錯要當天更正並註明，不塗改不補寫；把沒做的寫成有做、把時間寫長，可能構成業務登載不實與詐欺，被追回款項並負刑責。',tags:['偽造文書','登載不實','紀錄','詐領','申報','督導要求'],
why:'服務紀錄是政府核銷長照給付的憑證，不是單位內部的小事；「大家都這樣寫」在法律上不是理由。',
steps:['正確做法：每次服務當場或當日記錄，寫實際到達與離開時間、實際執行的項目。','發現寫錯（時間、項目、日期）：不塗黑、不用修正液，畫一條線保留原字、旁邊寫正確內容、簽名與日期；電子系統則依系統更正流程並通報督導。','漏記：盡快補記並註明「補記」與實際補記日期，不要寫成當天寫的。','未遇、提早結束、案主拒絕的時段，照實寫，不登載為服務時數。','被要求「多寫一點」「時間拉長」「幫忙把上週的補寫」：明確拒絕，保留對話紀錄，可向單位主管、地方衛生局或 1966 反映；檢舉人身分受保護。','被查核時：如實說明，不要臨時改紀錄，可請單位陪同。'],
no:['不要事後補寫一整週的紀錄並寫成當天日期。','不要為了配合 APP 打卡而在案家外先打卡再進去。','不要幫同事代打卡或代簽。','不要因為督導說「不會有事」就照做——刑責是個人的。'],
rep:'紀錄錯誤 → 督導更正；被要求不實登載 → 拒絕並向衛生局或 1966 檢舉。',
ref:'刑法第 215 條業務上登載不實（處 3 年以下）、第 210 條偽造私文書、第 339 條詐欺取財；長期照顧服務法第 47 條以下之罰則（虛偽申報得追回並處罰）；單位紀錄與核銷規範。',
ask:'我昨天忘記在系統上完成紀錄，今天才想到，請告訴我正確的補記方式以及不能做的事。'});

add({db:'care',cat:'生活協助',t:'協助備餐（餐食照顧）',s:'依案主的牙口、吞嚥與疾病調整質地與口味，讓案主參與能做的步驟；廚房安全（瓦斯、刀具、油鍋）先確認。',tags:['備餐','煮飯','BA05','質地','糖尿病','廚房'],
why:'備餐不是「幫他煮一餐」，而是讓他吃得夠、吃得安全，同時保留他在廚房裡還能做的事。',
steps:['服務前確認：核定的是案主本人的餐食、家中有沒有限制（低鹽、低糖、限水、軟質、剁碎、糊狀）。','食材處理：生熟分開，砧板刀具用完清潔；長者免疫力差，隔夜菜要徹底加熱。','質地：牙口不好改軟質（蒸、燉），吞嚥困難依語言治療或護理指示剁碎、泥狀或加增稠劑；不要只給稀飯配醬瓜。','每餐至少一份蛋白質（蛋、豆腐、魚、絞肉）、一份蔬菜、一份主食；分量用案主的拳頭估。','讓案主參與：洗菜、剝蒜、擺碗筷、決定菜色，坐著做也可以。','離開前：瓦斯關、爐火熄、刀具收、剩菜標日期放冰箱，並告訴案主下一餐在哪裡。'],
no:['不要用案主家的食材煮給家屬或自己吃。','不要在案主獨處時留著爐火燉煮。','不要因為「他只想吃粥」就長期只供應澱粉。','糖尿病者不要用大量勾芡與含糖飲料。'],
rep:'案主一週以上明顯吃不下、體重下降、反覆嗆咳 → 通報督導，建議營養或吞嚥評估。',
ref:'長照給付及支付基準 BA05 餐食照顧；衛福部長者飲食指南「我的餐盤」。',
ask:'案主獨居、有糖尿病、只有一個電鍋，請幫我設計 5 道 20 分鐘內能完成、可分裝兩餐的菜。'});

add({db:'care',cat:'生活協助',t:'協助購物與代購',s:'先列清單並拿錢、依單告知價格、發票與找零當面點交並記錄；能一起去就一起去，讓案主自己選。',tags:['購物','代購','BA16','發票','找零','清單'],
why:'購物是最容易產生金錢糾紛的項目，也是最容易被剝奪的「自主」——很多長者其實只是需要人陪，不是需要人代買。',
steps:['出門前與案主（或家屬）一起寫清單，確認預算，拿取現金並記錄金額；不用自己的錢先墊。','代購限案主本人生活必需品，依核定範圍；藥品憑處方，菸酒依單位規定通常不代購。','購買時保留發票或收據，一張都不能少。','回來後當面點交商品、發票、找零，請案主或家屬確認並在紀錄上簽名或註記。','案主能走：改成陪同購物，讓他自己選、自己付，你負責安全與提重物。','記錄：日期、品項、金額、找零、確認人。'],
no:['不要收案主的提款卡去領錢代購。','不要順便幫自己或其他案家買東西一起結帳。','不要接受「零錢不用找了」。'],
rep:'金額對不上或被質疑 → 立即通報督導，提供發票與紀錄。',
ref:'長照給付及支付基準 BA16 代購或代領或代送服務；單位金錢往來規範；刑法第 335 條侵占罪。',
ask:'案主每次代購都堅持不收找零、還要塞小費給我，請給我一句話婉拒的說法與正確的紀錄方式。'});

add({db:'care',cat:'生活協助',t:'協助穿脫衣物（照顧技巧）',s:'坐著穿、患側先穿後脫、拉整不拖拉、注意保暖與隱私；每一件衣服都先問「你想穿哪一件」。',tags:['穿衣','脫衣','偏癱','隱私','保暖'],
why:'穿脫衣是每天兩次的親密接觸，做得好是尊嚴，做不好是肩膀拉傷與皮膚撕裂傷。',
steps:['準備：關窗、拉簾，衣物依穿的順序疊好，鬆緊、前後、正反先確認。','姿勢：能坐就坐（床緣或有扶手的椅子），臥床者側臥分段穿。','上衣：患側或較弱側的手先穿進袖子，拉到肩膀，再穿另一側；脫時相反。套頭衣先套手臂再套頭。','褲子：坐姿先把兩腳套進褲管拉到膝上，扶穩站起（或側翻交替）再拉到腰。','穿襪與鞋：用襪子輔助器或把襪口捲起再套；鞋子選後跟包覆、魔鬼氈。','皮膚薄的長者：拉袖子時撐開袖口套過手，不要抓皮膚往裡塞。','留給案主做他能做的部分（拉拉鍊、扣中間的扣子）。'],
no:['不要抓手腕硬把手拉出袖子（皮膚撕裂）。','不要為了省時間把所有衣服一次脫光再穿。','不要幫案主決定他要穿什麼而不問。'],
rep:'發現穿脫時肩關節疼痛、皮膚撕裂、明顯瘀青 → 通報督導。',
ref:'長照給付及支付基準 BA02 基本日常照顧；職能治療 ADL 協助原則。',
ask:'案主雙手關節變形、手指伸不直，穿一般襯衫很困難，有哪些衣物改良與協助技巧？'});

add({db:'care',cat:'生活協助',t:'協助行走與扶持技巧',s:'站在弱側稍後方，手放腰後或腰帶，讓他自己控制平衡；走前確認鞋、地面、輔具，走時看臉色與呼吸。',tags:['行走','扶持','移位腰帶','陪走','跌倒'],
why:'「扶著走」多半是拉著手臂走，案主一滑你會反射性往上拉，結果一起倒；正確的扶持是在旁邊保護，不是拉。',
steps:['出發前：鞋子包覆防滑、褲管不拖地、地面乾、路線清空、輔具檢查。','起身後先站穩 10–20 秒，問有沒有頭暈。','你的位置：案主弱側、稍後方半步；一手輕托腰後或抓移位腰帶，另一手可在前方預備。','口令：「先站好，再出腳」，讓他走自己的速度，不要拉、不要推。','轉彎與門檻先停下再轉，慢慢來。','要跌時：不要硬撐，順勢護住頭部與髖部，讓他沿著你身體滑到地面或坐下。','走完坐下休息，記錄距離與狀況。'],
no:['不要拉著手臂或手肘走。','不要邊走邊聊到分心，或邊走邊拿東西。','不要走到累到不行才回頭，去程只走一半的體力。'],
rep:'走路突然變得明顯不穩、單側拖行、每次走都喘 → 通報督導，建議轉介復能或就醫。',
ref:'長照給付及支付基準 BA02 基本日常照顧、BA13 陪同外出；照顧服務員訓練：行走協助。',
ask:'案主有帕金森氏症，走路會突然定住（凍結），我陪走時可以用哪些口令或技巧幫他起步？'});

add({db:'care',cat:'生活協助',t:'送餐服務（營養餐飲服務）注意事項',s:'送餐是「營養餐飲服務」，由送餐單位志工或人員執行，不是居服員的項目；送餐時要親手交餐、確認案主狀況、有異狀立即通報。',tags:['送餐','營養餐飲','OT01','志工','關懷','獨居'],
why:'長照確實有送餐這項服務，但它與居家服務是不同的給付項目；居服員要知道它的規則，才能與送餐單位合作、也才知道自己的角色在哪裡。',
steps:['是哪一項：長照的「營養餐飲服務」（居家式或社區式，給付代碼 OT01），由縣市衛生局委託的送餐單位提供，由送餐人員或志工送到家；居服員對應的是 BA05 餐食照顧（在家備餐）與 BA16 代購。','誰可以用：經照管中心評估符合長照需要等級且符合資格、無法外出共餐者；有吞嚥困難、僅能管灌或需特殊餐食者通常不適用，聘有外籍看護者亦不適用（各縣市略有差異）。','送餐人員要做的事：親手把餐交給案主本人（不放門口就走）、確認案主在家且狀況正常、簡短關懷、填送餐關懷紀錄；發現案主無回應、跌倒、生病、環境異常，立即通報送餐單位與相關單位。','餐盒要在規定時間內送達（各縣市多為中午 12:30 前、晚間 18:30 前），不得無故中斷；天災或春節可用替代方式。','食安：餐盒保溫或保冷、不繞路過久；案主餐後不適要記錄並通報。','居服員的角色：若案主同時有送餐，服務時可協助加熱、分裝、觀察有沒有吃、剩餘放冰箱標日期，並把觀察到的進食狀況回報督導。'],
no:['居服員不要自行承諾「我幫你送餐」——不在核定項目內，也沒有保障。','送餐人員不要把餐掛在門把就離開而沒確認案主。','不要因為案主連續幾天沒吃完就只是丟掉而不回報。'],
rep:'送餐時案主未應門或有異狀 → 送餐單位立即通報，依失聯與異常事件流程處理；居服員發現送餐狀況異常 → 回報督導，由個管員與送餐單位聯繫。',
ref:'長期照顧服務申請及給付辦法 營養餐飲服務（OT01）；衛福部營養餐飲服務使用者資格核定原則；各縣市營養餐飲服務需求說明書（送餐關懷紀錄、送達時限）。',
ask:'案主有長照送餐，但我每次去都看到餐盒沒吃完放在桌上，我應該怎麼觀察、記錄與回報？'});

/* ---------- 補充：口腔照護 ---------- */
add({db:'care',cat:'口腔照護',t:'假牙清潔',s:'每餐後取下沖洗、每天用假牙刷與清水刷、睡前取下泡清水；不用牙膏、不泡熱水、不整夜戴。',tags:['假牙','活動假牙','清潔錠','口腔'],
why:'假牙表面有細菌與真菌膜，整夜戴著不清潔會造成口腔黏膜炎與吸入性肺炎；用牙膏刷會刮出細紋讓細菌更容易附著。',
steps:['取下：上顎假牙從後方輕壓讓空氣進入再取下，下顎假牙前後輕搖取出；在裝水的洗手台上操作以免摔破。','沖：先用清水沖掉食物殘渣。','刷：用假牙專用刷或軟毛牙刷加清水或假牙清潔劑，刷內外面與貼合面。','泡：睡前取下，泡在清水或假牙清潔錠溶液中，不要泡熱水（會變形）。','口腔本身也要清潔：牙齦、上顎、舌頭用軟牙刷或紗布擦。','戴回前檢查有無裂痕、鬆脫、磨破黏膜；假牙要對應正確（上下、左右）。'],
no:['不要用牙膏刷假牙。','不要整夜戴著睡。','不要用漂白水或熱水浸泡。','鬆脫的假牙不要用黏著劑硬撐，要請牙醫調整。'],
rep:'假牙鬆脫磨破、口腔黏膜白斑或潰瘍超過兩週 → 通報督導，建議牙科就診。',
ref:'衛福部口腔健康指引；長者口腔照護原則。',
ask:'案主失智，取假牙時會抗拒，有哪些讓他願意配合的引導方式？'});

add({db:'care',cat:'口腔照護',t:'牙刷使用（貝氏刷牙法）',s:'軟毛小頭牙刷、刷毛斜 45 度對牙齦、兩顆兩顆短距離來回刷，每區 10 下，內外咬合面都要，最後刷舌頭。',tags:['刷牙','貝氏刷牙法','牙齦','含氟牙膏'],
why:'長者牙齦萎縮、牙根外露，用力橫刷會刷壞牙根；貝氏刷牙法是清潔牙齦溝最有效又不傷牙的方式。',
steps:['準備：軟毛小頭牙刷、豆子大小的含氟牙膏、水杯、盆子或痰盂、毛巾。','姿勢：坐著或床頭抬高，頭略前傾，不要仰頭。','角度：刷毛斜 45 度朝牙齦，刷毛一半在牙齒一半在牙齦。','動作：一次兩顆牙，短距離水平來回刷 10 下，再往下一區；順序固定（右上外→左上外→左上內→右上內，下排同）。','咬合面：來回刷；前牙內側：牙刷直立上下刷。','最後刷舌頭由後往前輕刷 3–5 下，漱口或用紗布擦乾淨。','手抖或握不住：把牙刷握柄纏厚（泡棉、毛巾）或改電動牙刷。'],
no:['不要用硬毛或大頭牙刷。','不要用力大範圍橫刷。','不要讓案主躺平刷牙。','牙刷用 3 個月或刷毛開花就換。'],
rep:'刷牙時牙齦持續出血、牙齒搖動、口臭明顯 → 通報督導，建議牙科。',
ref:'衛福部國民口腔健康指引（貝氏刷牙法）。',
ask:'案主右手偏癱只能用左手刷牙，請給我可以讓他自己刷的握柄改良與刷牙順序。'});

add({db:'care',cat:'口腔照護',t:'牙線使用',s:'取 45 公分繞在中指，拇指食指控制 1–2 公分，呈 C 字貼著牙面上下刮，每個牙縫兩側都要；牙縫大或手不靈活改用牙線棒或牙間刷。',tags:['牙線','牙縫','牙線棒','牙周'],
why:'牙刷清不到牙縫，牙縫的牙菌斑是牙周病與蛀牙的主因；長者牙縫變大，更需要清。',
steps:['取約 45 公分牙線，兩端繞在兩手中指上，中間留 3–5 公分。','用拇指與食指撐住，前後鋸拉輕輕滑進牙縫，不要「彈」進去。','牙線貼著一顆牙的牙面彎成 C 形，往牙齦方向再往上刮 2–3 次；換另一側牙面重複。','每換一個牙縫就換一段乾淨牙線。','後牙難操作或案主手不靈活：用牙線棒（Y 形較好用）或改牙間刷。','使用後漱口，觀察是否出血。'],
no:['不要用力壓進牙齦。','假牙固定橋下方用牙線穿引器或牙間刷，不硬拉。','不要與案主共用牙線棒。'],
rep:'牙線每次都卡住或斷裂在同一處、牙齦持續出血 → 建議牙科。',
ref:'衛福部國民口腔健康指引。',
ask:'案主牙縫很大又有牙周病，牙線和牙間刷哪個比較適合？怎麼挑尺寸？'});

add({db:'care',cat:'口腔照護',t:'牙間刷使用',s:'依牙縫大小選尺寸（能輕鬆放入、有一點阻力剛好），沾濕後水平輕輕進出 2–3 次，每天一次，用後沖洗晾乾。',tags:['牙間刷','牙縫','尺寸','牙周'],
why:'牙間刷是長者最實用的牙縫清潔工具：比牙線容易操作，對牙縫大、牙周病、植牙與固定假牙都適用。',
steps:['選尺寸：從最小號試起，能輕鬆放入且刷毛接觸兩側牙面最好；太緊就換小號，同一口可能需要兩種尺寸。','沾濕（可沾少量含氟牙膏或漱口水），不要乾刷。','從牙齦邊緣水平放入牙縫，輕輕來回 2–3 次，不要旋轉、不要硬塞。','後牙：把牙間刷金屬桿彎成 L 形較好操作，或選有角度的款式。','每天一次，晚上刷牙前做最好。','用後沖乾淨、甩乾、直立晾；刷毛變形或金屬露出就換。'],
no:['不要硬塞不合尺寸的牙間刷（會傷牙齦、壓壞金屬桿刺傷）。','不要多人共用。','有出血先繼續輕柔使用一週，若仍出血就建議牙科。'],
rep:'牙縫持續出血、腫痛、有膿 → 建議牙科。',
ref:'衛福部國民口腔健康指引；牙周病照護原則。',
ask:'案主有植牙與固定假牙，請問牙間刷要怎麼用、哪些地方特別要清？'});

/* ---------- 補充：身體照顧技巧 ---------- */
add({db:'care',cat:'清潔與皮膚',t:'洗頭技巧（坐姿與床上）',s:'水溫 38–40℃、先護耳護眼、指腹不指甲、快洗快乾；臥床者用洗頭槽或洗頭盆，洗完 5 分鐘內吹乾。',tags:['洗頭','床上洗頭','洗頭槽','BA23','失溫'],
why:'頭皮油脂與汗垢會造成搔癢與毛囊炎，但洗頭是長者最容易著涼與頭暈的清潔項目。',
steps:['準備：毛巾 2–3 條、洗髮精、水杯或蓮蓬頭、耳塞或棉球、吹風機，關窗保暖。','坐姿（浴室）：坐沐浴椅，頭稍前傾，一手護住額頭與眼睛，從後往前沖，避免水進眼耳。','床上：肩下墊防水布與毛巾，頭放洗頭槽或充氣洗頭盆，耳塞棉球，接水桶放床下。','洗：先沖濕再用洗髮精，用指腹畫圈按摩頭皮，不用指甲抓；沖到沒有泡沫。','乾：毛巾按壓吸水，5 分鐘內吹乾（吹風機保持 15 公分、不停留同一處），順便看頭皮有無傷口、紅疹、頭蝨。','整個過程控制在 10 分鐘內，中間問有沒有頭暈、冷。'],
no:['不要仰頭沖水太久（頭暈、頸椎不適）。','不要用熱水直接沖頭頂。','剛吃飽或血壓不穩時不洗。','不要留著濕髮就離開。'],
rep:'頭皮傷口、大片紅疹、頭蝨、洗頭時明顯頭暈 → 通報督導。',
ref:'長照給付及支付基準 BA23 協助洗頭、BA07 協助沐浴及洗頭；照顧服務員訓練：頭髮清潔。',
ask:'案主臥床、頸椎不能後仰，家裡沒有洗頭槽，有哪些替代的床上洗頭方法？'});

add({db:'care',cat:'清潔與皮膚',t:'床上擦澡（洗身體技巧）',s:'一區一區洗、洗完馬上蓋，順序臉→手臂→胸腹→背→腿→會陰，水換 2–3 次，全程 15–20 分鐘。',tags:['擦澡','床上擦澡','洗身體','保暖','隱私'],
why:'臥床者的皮膚清潔靠擦澡，做得好可以預防壓傷與感染，做不好會失溫與暴露太久失去尊嚴。',
steps:['準備：兩盆溫水（38–40℃）、兩條毛巾（一擦一乾）、浴巾、乳液、乾淨衣物，關窗拉簾。','脫衣只露出要洗的部位，其餘用浴巾蓋著。','順序：眼（由內眼角往外，一眼一面）→臉→耳頸→手臂（由遠往近）→腋下→胸腹（女性乳下皺褶要擦乾）→背與臀（側翻，同時看皮膚）→腿與腳→會陰最後。','每洗一區立刻擦乾並蓋回；毛巾髒了或水髒了就換。','擦背時可順便輕拍或按摩促進循環，看骶骨與肩胛。','乾燥處薄擦乳液；腳趾間、皺褶處保持乾。','穿上乾淨衣物，整理床單，更換濕的床單。'],
no:['不要把整個人脫光再開始擦。','不要一條毛巾從頭用到腳。','不要用力搓皮膚薄的部位。','有管路的案主注意管路不要拉扯。'],
rep:'發現新的紅斑、水泡、破皮、不明瘀青 → 通報督導。',
ref:'長照給付及支付基準 BA01 基本身體清潔；照顧服務員訓練：床上擦澡。',
ask:'案主臥床又很怕冷，擦澡時一直發抖，請給我保暖與縮短流程的方法。'});

add({db:'care',cat:'清潔與皮膚',t:'會陰與生殖器官清潔',s:'戴手套、由前往後、由內往外、一擦一換面；女性分開陰唇、男性退包皮清潔後推回；先說明再動作，尊重隱私。',tags:['會陰','生殖器','包皮','隱私','尿路感染','導尿管'],
why:'會陰清潔做得好是預防尿路感染最重要的一步，也是案主最敏感、最容易感到羞恥的照顧；技巧與態度一樣重要。',
steps:['準備：手套、溫水、無酒精濕巾或紗布、乾毛巾，拉簾關門，只露出會陰部。','先說明：「我現在幫你清潔下面，會有一點涼。」','女性：仰臥屈膝雙腿分開，一手分開陰唇，另一手用濕紗布由前（尿道口）往後（肛門）擦，一擦一換面，不來回；再擦兩側大腿內側。','男性：一手扶陰莖，將包皮往後退露出龜頭，由尿道口向外畫圈清潔，沖淨或擦淨後把包皮推回原位（很重要，否則會腫脹嵌頓）；再清潔陰囊與腹股溝。','肛門：側翻，由前往後擦拭，看有無痔瘡、破皮。','擦乾，觀察分泌物、異味、紅腫、破皮，有導尿管者另清潔尿道口與管路近端。','整理衣物，脫手套洗手，記錄異常。'],
no:['不要由後往前擦（把肛門細菌帶到尿道）。','男性清潔後不要忘記把包皮推回。','不要用肥皂或含酒精濕巾直接清潔黏膜。','不要在家屬或其他人在場時未拉簾就進行。'],
rep:'分泌物異常有臭味、紅腫、破皮、包皮無法推回、排尿疼痛 → 通報督導，建議就醫。',
ref:'長照給付及支付基準 BA01 基本身體清潔、BA24 協助排泄；照顧服務員訓練：會陰清潔。',
ask:'案主是男性、我是女性居服員，他對會陰清潔很抗拒，有哪些做法可以減少雙方的尷尬？'});

add({db:'care',cat:'移位與擺位',t:'關節活動的手法與順序（照顧面）',s:'一手固定關節上方、一手托住下方，慢、穩、到底、停 3 秒；由近端到遠端，每個方向 5–10 次，看表情不看次數。',tags:['關節活動','ROM','手法','攣縮','BA11'],
why:'同樣是「動關節」，手托的位置與速度決定是幫他還是傷他。（訓練面的動作清單請看復能資料庫「關節活動運動」。）',
steps:['先溫熱：可先用溫毛巾敷或輕按摩，肌肉放鬆再動。','握法：托住關節的兩端，不抓在關節上、不抓手指尖；手掌整面接觸，不用指尖捏。','速度：一個動作 3–5 秒到底，停 3 秒，再 3–5 秒回來；不彈震、不快甩。','順序：肩→肘→腕→手指；髖→膝→踝→腳趾。每個方向 5–10 次。','偏癱側：肩關節活動時要托住上臂避免脫臼，不要只拉手腕舉高。','邊做邊看表情與肌肉張力，皺眉、抵抗就退回一點並放慢。','做完擺回舒適位置，記錄哪個關節變緊或疼痛。'],
no:['不要把關節硬壓到超過他能到的角度。','骨折未癒、關節急性紅腫、剛手術的部位不做。','不要在案主抗拒或痙攣加強時硬做。'],
rep:'關節腫痛、活動範圍明顯變小、有攣縮進展 → 通報督導，建議轉介復能。',
ref:'長照給付及支付基準 BA11 肢體關節活動；照顧服務員訓練：關節活動。',
ask:'案主中風後手臂張力很高、一動就更緊，關節活動時要怎麼做才不會誘發痙攣？'});

add({db:'care',cat:'移位與擺位',t:'移位板、滑墊與兩人移位',s:'完全無法承重、體重大、或有管路的案主用移位板／滑墊／兩人法，不用抱的；口令一致、同時出力，保護自己的腰。',tags:['移位板','滑墊','兩人移位','腰傷','無法承重'],
why:'一個人抱移位是居服員腰傷第一名，而且案主被抓腋下、拖拉皮膚也會受傷；用對工具，一個人也能安全完成。',
steps:['判斷：案主能扶站→用站轉移位；不能站但能坐穩→移位板；不能坐穩、臥床→滑墊或兩人法（或移位機）。','移位板（床↔輪椅）：兩者同高、輪椅拆扶手鎖煞車、板子一端放案主臀下、一端放輪椅座面，案主身體前傾，你扶腰帶，讓他一段一段挪過去。','滑墊（床上往上移或翻身）：滑墊放身下，兩人各站一側抓滑墊邊緣，口令「一、二、三」同時往頭側或側邊拉，不抬。','兩人移位：一人負責上半身（雙手從腋下環抱到胸前交叉）、一人負責雙腿，同時口令，膝蓋彎腰挺直。','你的姿勢：雙腳一前一後、與案主靠近、用腿不用腰、不扭轉身體。','移位後檢查坐姿與管路，記錄。'],
no:['不要抓腋下往上提。','不要一個人移動超過自己體重又完全無法承重的案主。','不要在床輪未鎖、輪椅未鎖時操作。','不要扭腰轉身搬人。'],
rep:'移位時案主疼痛或跌坐、你自己閃到腰 → 依異常事件通報；反覆困難 → 建議督導評估移位機或輔具補助。',
ref:'職業安全衛生法雇主應提供安全作業方法；長照輔具補助（移位板、移位滑墊、移位機）。',
ask:'案主 90 公斤臥床、家裡只有我一個人，請幫我判斷該申請哪種移位輔具，以及在申請下來前的替代做法。'});

add({db:'care',cat:'移位與擺位',t:'輪椅坐姿擺位',s:'屁股坐到底、髖膝踝約 90 度、腳踩踏板、背靠背墊、骨盆不歪；坐一小時就要換姿勢或減壓。',tags:['輪椅','坐姿','擺位','減壓','骨盆','滑落'],
why:'坐姿歪掉會造成骶骨壓傷、身體滑落、脊椎變形，也讓案主吃飯呼吸都不順。',
steps:['先把臀部推到底：讓案主身體前傾、你從後方扶骨盆往後拉，或用滑墊。','檢查三個 90 度：髖、膝、踝；腳踏板高度讓大腿平放，膝蓋不高於髖。','骨盆左右對稱：兩邊坐骨都有壓到坐墊；歪一側可在該側放楔形墊。','背部：靠墊支撐腰部，頭不往前垂。','偏癱側手臂：放在桌板或枕頭上，不要垂在輪子旁。','減壓：每 30–60 分鐘協助前傾或側傾 1 分鐘，或用氣墊、減壓坐墊。','綁安全帶時扣在骨盆，不是肚子；並非約束，是防滑落。'],
no:['不要讓案主長時間身體滑到坐墊前緣（骶骨受壓）。','不要把腳踏板拆掉讓腳懸空。','不要用甜甜圈坐墊。'],
rep:'坐後骶骨或坐骨紅斑不褪、坐不穩反覆滑落 → 通報督導，建議輔具評估（擺位輪椅、減壓坐墊）。',
ref:'長照輔具服務（輪椅擺位配件、減壓坐墊）；壓傷預防原則。',
ask:'案主坐輪椅總是往一邊歪、半小時就滑下去，家裡輪椅是一般型，我可以先怎麼調整？'});

/* ---------- 補充：外出與陪伴 ---------- */
add({db:'care',cat:'外出與陪伴',t:'協助上下長照接送車與復康巴士',s:'輪椅上下升降板要鎖煞車、面向車內、扣好固定帶；能走的案主一步一步扶上車、先坐再收腳；上下車前後都確認安全帶與隨身物。',tags:['接送車','復康巴士','升降板','輪椅固定','外出','BD03'],
why:'上下車是外出過程中最容易跌倒與夾傷的時刻，也是最需要與司機分工的動作。',
steps:['預約與確認：復康巴士或長照交通接送（BD03）需事先預約，告知輪椅型式、陪同人數、目的地、有無氧氣。','出發前：案主如廁、帶健保卡藥單、輪椅檢查煞車與腳踏板、案主穿好安全的鞋。','輪椅上升降板：煞車鎖住、輪椅面向車內或依司機指示，你站在輪椅後方扶把手，上升時不要碰升降板邊緣。','車內固定：輪椅四點固定帶與案主安全帶都扣好，你坐在能看到案主的位置。','能走的案主：一手扶車門把、一手你托腰後，先坐進座椅再收腳（轉身坐入）；下車先腳落地再站起。','抵達後：確認隨身物（拐杖、藥、健保卡），再讓車離開。'],
no:['不要在升降板上鬆開煞車或轉動輪椅。','不要抱著案主上下車。','不要讓案主單獨留在車上。','車輛未停穩、升降板未放平不要上下。'],
rep:'上下車時受傷、夾傷、跌坐 → 通報督導與家屬，記錄；車輛安全問題反映接送單位。',
ref:'長照給付及支付基準 BD03 交通接送服務；復康巴士乘車規定；長照交通接送單位作業規範。',
ask:'案主坐電動輪椅要搭復康巴士，預約時要提供哪些資訊、上車要注意什麼？'});

add({db:'care',cat:'外出與陪伴',t:'陪同就醫技巧',s:'出發前帶齊證件藥單與問題清單，看診時協助案主說清楚主訴、把醫囑記下來，回來後交接給家屬與督導。',tags:['就醫','陪診','BA14','醫囑','藥單','問題清單'],
why:'陪同就醫不只是「陪他去」，而是讓案主的問題被醫師聽到、醫師的指示被帶回家；這中間居服員是唯一的橋樑。',
steps:['出發前：健保卡、身分證、藥單或藥袋、以往檢查報告、家屬寫的問題清單、輪椅或拐杖、水與小點心（糖尿病者尤其）。','把要問的事先寫好：這次為什麼來、最近症狀（何時開始、多久一次）、有沒有跌倒、血壓血糖紀錄。','看診時：先讓案主自己說，他說不清楚再補充；不替他做治療決定，不代簽同意書（由家屬）。','記下醫囑：新藥、停藥、回診日、檢查項目、注意事項；聽不懂當場問。','領藥時核對藥袋姓名與數量，向藥師確認新藥吃法。','回程：案主是否不適、有沒有吃飯；回到家把醫囑、回診日、藥物變更告知家屬並記錄，回報督導。'],
no:['不要替案主決定要不要做手術、要不要住院——這是家屬與案主的決定。','不要代簽手術、麻醉等同意書。','不要在候診時離開案主去辦自己的事。','不要把案主病情告訴不相關的人。'],
rep:'就醫途中病情惡化依急症流程處理；醫師交代的重要事項（住院、停藥）當天回報督導與家屬。',
ref:'長照給付及支付基準 BA14 陪同就醫；醫療法手術同意書簽署規定；個人資料保護法。',
ask:'案主明天要去看神經內科，家屬只說「他最近怪怪的」，請幫我列出一份可以帶去給醫師的觀察清單。'});

add({db:'care',cat:'外出與陪伴',t:'陪伴運動技巧',s:'你的角色是安全網與節拍器：先檢查再開始、示範一次、跟著做、數拍子、看臉色、適時停；不代替他做，也不當教練逼他。',tags:['陪伴運動','陪運動','鼓勵','安全','示範'],
why:'案主多半不缺運動知識，缺的是「有人陪」；陪伴運動的效果來自關係與節奏，不是動作多難。',
steps:['開始前：問今天狀況（睡、吃、痛、藥），量血壓，穿包鞋，清空地面，水放旁邊。','用他喜歡的方式開場：放老歌、聊天、從他昨天做過的動作開始。','示範一次，然後一起做，你數拍子（「一、二、三……」）並口頭提示動作重點（「腳踩穩」「吐氣」）。','每 3–5 分鐘看臉色、問「還好嗎」，出現停止指標就停。','做得到就具體稱讚（「今天比昨天多兩下」），做不到就降級不勉強。','結束：緩和伸展、喝水、記錄做了什麼、幾次、感受。','把復能資料庫的動作當菜單，每次挑 3–4 個，不需要全部做完。'],
no:['不要在案主不舒服時「加油撐一下」。','不要自己做得很起勁而沒有看他。','不要用手機計時盯著螢幕而不看人。'],
rep:'運動中出現胸痛、明顯喘、頭暈、跌倒 → 依急症與跌倒流程；持續拒絕運動 → 回報督導討論調整。',
ref:'長照給付及支付基準 BA02 基本日常照顧之活動協助；復能資料庫「運動前檢查與停止指標」。',
ask:'案主說「我這麼老了運動也沒用」，請給我三種不同切入點的回應，讓他願意跟我動一下。'});

add({db:'care',cat:'外出與陪伴',t:'陪伴服務與陪同外出技巧',s:'陪伴不是坐著滑手機：有目的（安全看視、談話、活動），有觀察（情緒、行為、環境），有紀錄；陪同外出先規劃路線、休息點與廁所。',tags:['陪伴','陪同外出','BA13','安全看視','BA22','談話'],
why:'陪伴是最容易被做成「人在心不在」的項目；做得好，它是發現異狀、維持功能與情緒支持最好的時間。',
steps:['先確認核定的是哪一項：安全看視（BA22，主要是看顧安全）或陪同外出（BA13，含購物、散步、社交活動），內容依核定。','在家陪伴：安排一件一起做的事（摺衣、聊老照片、聽廣播、玩紙牌），同時觀察精神、飲食、環境；不要讓案主整段時間看電視你在旁邊滑手機。','談話技巧：開放式問句（「今天早上做了什麼？」）、專注聽、不急著給建議、不談政治宗教與他人是非。','陪同外出：先確認目的地、路線、交通方式、有無廁所與休息點、天氣與藥物時間；帶水、藥、健保卡、聯絡卡。','外出中：走在弱側、過馬路走斑馬線、人多處手輕扶腰帶、每 15–20 分鐘問是否需要休息。','回家後：記錄去了哪裡、走多久、案主狀況、談話中值得注意的事（心情低落、提到想死、家中衝突）。'],
no:['不要帶案主去核定以外的地方（自己的家、廟會人潮擁擠處）而未經單位同意。','不要在外出時讓案主脫離視線（例如你去停車讓他自己站路邊）。','不要答應案主「不要跟家屬說」的祕密要求，先告知會依規定回報。'],
rep:'談話中案主表達想死、被虐、財物被拿 → 當天通報督導（想死的念頭同時提供 1925 安心專線）；外出跌倒或走失依異常事件流程。',
ref:'長照給付及支付基準 BA13 陪同外出、BA22 安全看視；單位陪同外出規範。',
ask:'案主獨居且很少講話，我每週有兩小時陪伴，請設計四週不重複、不需要材料的陪伴活動。'});

/* ---------- 補充：復能對應 ---------- */
add({db:'move',cat:'生活功能訓練',t:'一起備餐：廚房裡的復能',s:'把備餐拆成坐著能做的步驟（洗菜、剝蒜、打蛋、擺盤）交給案主，你負責火與刀；目標是他能為自己準備一餐。',tags:['備餐','廚房','手部功能','認知','自立'],
why:'備餐同時練手部精細、站立耐力、順序記憶與決策，是最完整的日常訓練，而且成果可以吃。',
steps:['先分工：案主做哪些（決定菜色、洗菜、剝、撕、攪拌、擺盤），你做哪些（開火、切、端熱鍋）。','設定站立耐力：從坐著做開始，逐週增加站在流理台前的時間（1→3→5 分鐘）。','認知：讓案主說出步驟順序、找出需要的器具、算分量（幾顆蛋、幾杯米）。','手部：慣用手無力就用防滑墊固定碗、用大握柄工具；偏癱者用患側手壓住食材、好側操作。','安全：刀具用完立刻收、瓦斯由你開關，案主站立時旁邊有穩固支撐。','記錄他這週多做了哪一步。'],
no:['不要為了效率把所有事做完只讓他「看」。','不要讓他單獨站在爐火前。'],
rep:'備餐時反覆忘記步驟、燙傷、切傷 → 回報督導評估認知與安全。',
ref:'長照復能服務生活功能訓練；BA05 餐食照顧。',
ask:'案主以前很會煮菜，現在輕度失智常忘記步驟，請幫我設計一道菜的「分工表」讓她可以參與八成。'});

add({db:'move',cat:'生活功能訓練',t:'出門買東西當復能（購物訓練）',s:'從到巷口買一樣東西開始：走路耐力、找商品、算錢、付款、提回家，每週往前推一點。',tags:['購物','社區行走','算錢','耐力','外出'],
why:'購物包含走、認、算、說、提，是最生活化的多重任務訓練，也是重建社會參與的起點。',
steps:['第一週：一起走到最近的商店，只買一樣東西，你付錢；記錄來回走了幾分鐘、休息幾次。','第二週：讓案主自己找商品、自己拿到櫃台。','第三週：讓案主自己算錢付款（先用現金，數硬幣就是認知訓練）。','第四週：讓案主提一袋輕的東西回家（提重物訓練上肢與平衡）。','進階：加長距離、加多品項、換一家店、自己寫清單。','每次出門前確認鞋子、天氣、水與休息點。'],
no:['不要一開始就去大賣場（太遠太吵太多選擇）。','不要在案主算錢時搶著幫忙，等一等。'],
rep:'走路耐力明顯下降、外出後極度疲勞或跌倒 → 回報督導。',
ref:'長照復能服務社區參與訓練；BA13 陪同外出。',
ask:'案主中風後三個月都沒出過門，請幫我設計四週從家門口到便利商店的漸進外出計畫。'});

add({db:'move',cat:'認知與口腔',t:'自己刷牙：口腔自我照顧訓練',s:'把刷牙拆成拿牙刷→擠牙膏→刷→漱口→放回，找出他能做的步驟，用改良握柄與固定順序，每天練兩次。',tags:['刷牙','口腔','自理','握柄','偏癱'],
why:'自己刷牙是最容易恢復的自理能力之一，每天有兩次練習機會，而且直接減少肺炎風險。',
steps:['先觀察：他卡在哪一步？拿不穩（握力）、擠不出牙膏（雙手協調）、刷不到某一側（忽略或手不到）、忘記順序（認知）。','握力：牙刷握柄加粗（套泡棉管、纏毛巾），或改電動牙刷。','雙手協調：牙膏改按壓式，或你先擠好。','刷不到：鏡子前示範，或你用手輕引導他的手到那一側（手把手），再慢慢放開。','順序：貼一張圖示在鏡子旁（右上→左上→左下→右下→舌頭）。','你只補刷他刷不到的地方，不要重刷全口。'],
no:['不要因為他刷得不乾淨就整個接手。','不要一次要求全部自己做。'],
rep:'口腔狀況變差（出血、口臭、潰瘍）→ 通報督導，建議牙科。',
ref:'職能治療 ADL 訓練；衛福部口腔健康指引。',
ask:'案主右手偏癱、左手不靈活，請給我讓他自己刷牙的三種輔具與訓練步驟。'});

add({db:'move',cat:'平衡與步行',t:'社區行走與搭車訓練',s:'從家門口到巷口、到公車站、到搭一站公車；練的是路面變化、過馬路、上下車與人群中的平衡。',tags:['社區行走','公車','過馬路','戶外','平衡'],
why:'室內走得好不代表外面走得好：斜坡、人行道高低差、綠燈秒數、公車煞車都是新的挑戰。',
steps:['第一階：家門口到巷口平路，來回，記錄時間與休息次數。','第二階：加上高低差（人行道、門檻）與斜坡；練「先停、看、再跨」。','第三階：過馬路——在綠燈剛亮時出發、走斑馬線、中途看號誌秒數。','第四階：到公車站等車、上車（先抓扶手再抬腳）、坐穩、按鈴、下車（等車停穩、先腳後身）。','每階做到不需你扶、案主不緊張再進下一階。','天氣、體力、藥物時間都要配合。'],
no:['不要一開始就挑尖峰時段。','不要邊走邊看手機導航。','人多處不要讓案主離開你手可以碰到的範圍。'],
rep:'戶外行走跌倒、明顯恐懼不敢再出門 → 回報督導，評估輔具或心理支持。',
ref:'長照復能服務社區參與；BA13 陪同外出。',

/* ===================== 狀態與渲染 ===================== */
const $ = s=>document.querySelector(s);
const main=$('#main'), nav=$('#nav'), q=$('#q'), clearBtn=$('#clear'), toast=$('#toast');
let view='home', cat='全部', query='';
let favs=new Set();
try{ favs=new Set(JSON.parse(localStorage.getItem('hc_favs')||'[]')); }catch(e){}
function saveFavs(){ try{ localStorage.setItem('hc_favs',JSON.stringify([...favs])); }catch(e){} }
try{ const t=localStorage.getItem('hc_theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
E.forEach((e,i)=>e.id=e.db+'-'+i);
const dbOf=id=>DBS.find(d=>d.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showToast(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toast.classList.remove('show'),1600); }
function copy(t){ navigator.clipboard?.writeText(t).then(()=>showToast('已複製，可以貼到 AI 對話框'),()=>showToast('複製失敗，請手動選取')); }

function renderNav(){
  const items=[{id:'home',name:'首頁',color:'var(--ink2)'},...DBS,{id:'fav',name:'我的收藏',color:'var(--amber)'},{id:'ai',name:'AI 協作',color:'var(--ink2)'}];
  nav.innerHTML=items.map(i=>`<button style="--c:${i.color}" data-v="${i.id}" aria-current="${view===i.id}"><span class="dot"></span>${i.name}${i.icon?'':''}</button>`).join('');
}
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; go(b.dataset.v);});
$('#home').addEventListener('click',()=>go('home'));
function go(v){ view=v; cat='全部'; if(v!=='search'){query='';q.value='';clearBtn.hidden=true;} render(); window.scrollTo({top:0}); }

function match(e,qq){
  const hay=[e.t,e.s,e.cat,...(e.tags||[]),e.why,...(e.steps||[]),...(e.no||[]),e.rep,e.ref].join(' ').toLowerCase();
  return qq.split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}

function card(e){
  const d=dbOf(e.db); const on=favs.has(e.id);
  const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
  return `<details class="card" style="--c:${d.color}" id="${e.id}">
    <summary><span class="bar"></span><div><div class="ttl">${esc(e.t)}</div><div class="sub">${esc(e.s)}</div>
      <div class="meta"><span class="db">${d.name}</span><span>${esc(e.cat)}</span>${(e.tags||[]).slice(0,4).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><span class="tog" aria-hidden="true">＋</span></summary>
    <div class="body">
      <div class="sec why"><h4>為什麼重要</h4><p>${esc(e.why)}</p></div>
      <div class="sec"><h4>怎麼做</h4><ol>${li(e.steps)}</ol></div>
      <div class="sec no"><h4>不要這樣做</h4><ul>${li(e.no)}</ul></div>
      <div class="sec rep"><h4>通報與轉介</h4><p>${esc(e.rep)}</p></div>
      <div class="sec ref"><h4>依據</h4><p>${esc(e.ref)}</p></div>
      <div class="ask"><b>想再問 AI，可以這樣問（記得去掉案主姓名、地址等個資）</b><p>${esc(e.ask)}</p></div>
      <div class="acts">
        <button data-act="fav" data-id="${e.id}" class="${on?'on':''}">${on?'★ 已收藏':'☆ 收藏'}</button>
        <button data-act="ask" data-id="${e.id}">複製 AI 提問</button>
        <button data-act="print" data-id="${e.id}">列印這一則</button>
      </div>
    </div></details>`;
}

function render(){
  renderNav();
  if(query){ return renderSearch(); }
  if(view==='home') return renderHome();
  if(view==='fav') return renderFav();
  if(view==='ai') return renderAI();
  renderDb(view);
}

function renderHome(){
  const strip=`<div class="strip"><h3>任何異常，先做這六步</h3><ol><li>確保自己與案主安全</li><li>依情況初步處置；有生命危險直接 119</li><li>電話通報督導（不是只傳訊息）</li><li>離開案家前完成紀錄（5W1H、只寫事實）</li><li>交接需要繼續觀察的事</li><li>與督導檢討，依單位時限填通報單</li></ol></div>`;
  main.innerHTML=`<div class="hero"><h1>把專業放進口袋。</h1><p>四個資料庫，${E.length} 則現場用得上的做法、禁忌、通報時機與法規依據。用上方搜尋框一次查全部，或點進主題慢慢學。</p></div>
  <div class="tiles">${DBS.map(d=>{const n=E.filter(e=>e.db===d.id).length;return `<button class="tile" style="--c:${d.color}" data-v="${d.id}"><div class="n">${n}<small>則</small></div><h2>${d.icon} ${d.full}</h2><p>${d.desc}</p><div class="cats">${d.cats.map(c=>`<span>${c}</span>`).join('')}</div></button>`;}).join('')}</div>
  ${strip}
  <p class="note">本資料庫為居家服務員之學習與查詢輔助工具，內容依台灣現行長照制度與相關法規之原則整理，不取代單位標準作業、督導指示、醫療專業判斷或法律諮詢。法規可能修訂，重要事項請以主管機關最新公告為準。緊急狀況請直接撥打 119／110。</p>`;
  main.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>go(t.dataset.v)));
}

function renderDb(id){
  const d=dbOf(id);
  const all=E.filter(e=>e.db===id);
  const items=cat==='全部'?all:all.filter(e=>e.cat===cat);
  main.innerHTML=`<div class="dbhead" style="--c:${d.color}"><div><h1>${d.icon} ${d.full}</h1><p>${d.desc}</p></div></div>
  <div class="chips">${['全部',...d.cats].map(c=>`<button aria-pressed="${cat===c}" data-c="${c}" style="--c:${d.color}">${c}${c==='全部'?` ${all.length}`:` ${all.filter(e=>e.cat===c).length}`}</button>`).join('')}</div>
  <p class="count">${items.length} 則，點標題展開</p>
  <div class="list">${items.map(card).join('')}</div>`;
  main.querySelectorAll('.chips button').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.c;render();}));
}

function renderSearch(){
  const qq=query.toLowerCase();
  const items=E.filter(e=>match(e,qq));
  main.innerHTML=`<div class="dbhead" style="--c:var(--ink2)"><div><h1>搜尋「${esc(query)}」</h1><p>跨四個資料庫，共 ${items.length} 則</p></div></div>
  ${items.length?`<div class="list">${items.map(card).join('')}</div>`:`<div class="empty"><b>沒有找到相符的資料</b>試試更短的關鍵字，例如「跌倒」「灌食」「性騷擾」「坐站」。</div>`}`;
}

function renderFav(){
  const items=E.filter(e=>favs.has(e.id));
  main.innerHTML=`<div class="dbhead" style="--c:var(--amber)"><div><h1>我的收藏</h1><p>存在這台裝置的瀏覽器裡，換裝置不會同步</p></div></div>
  ${items.length?`<div class="list">${items.map(card).join('')}</div>`:`<div class="empty"><b>還沒有收藏</b>展開任何一則，按「☆ 收藏」，常用的做法就會集中在這裡。</div>`}`;
}

function renderAI(){
  const tpl=(h,body)=>`<div class="tpl"><h3>${h}</h3><pre>${esc(body)}</pre><button data-copy="${esc(body)}">複製這段提問</button></div>`;
  main.innerHTML=`<div class="dbhead" style="--c:var(--ink2)"><div><h1>AI 協作：怎麼問，才專業又安全</h1><p>每一則資料下方都有「複製 AI 提問」，這裡是通用的問法與規則。</p></div></div>
  <div class="ai">
  <div class="card"><h2>三條不能破的規則</h2><ul>
   <li>不貼案主姓名、地址、電話、身分證、照片。用「案主 A、80 歲女性、左側偏癱」這種描述就夠。</li>
   <li>AI 的回答是「參考」，不是督導指示，也不是醫療或法律判斷。涉及用藥、管路、法律責任，回頭問督導、護理師、藥師或法扶。</li>
   <li>緊急狀況不要先問 AI。先 119，再通報，事後才用 AI 整理紀錄。</li></ul></div>
  <div class="card"><h2>四種最常用的問法</h2>
   ${tpl('把口語變成客觀紀錄','你是長照服務紀錄的協助者。請把下面這段口語描述改寫成客觀的異常事件紀錄，依 5W1H 排列，只保留事實、去掉推測與情緒字眼，引述對方的話用引號，最後列出「需要繼續觀察的事項」。\n\n描述：（貼上你的口語描述，不含個資）')}
   ${tpl('照顧做法的細節與替代方案','你是資深居家職能治療師。案主是（年齡、性別、主要診斷、目前能力，例如：78 歲男性、中風左側偏癱、可扶物站立）。我在（描述照顧情境與遇到的困難）。請給我：1) 可能原因 2) 三個居家可行的做法，每個列步驟 3) 哪些狀況要停止並通報。用台灣長照居服員看得懂的白話。')}
   ${tpl('把運動拆成漸進計畫','請幫我為（案主描述，不含個資）設計 4 週的居家復能運動計畫，目標是（例如：能自己從椅子站起來去廁所）。每週列出動作、次數、進階條件與安全停止指標，動作以不需器材或只用椅子、毛巾為主，並用「不代勞」的原則說明我在旁邊該做什麼、不該做什麼。')}
   ${tpl('確認法律與通報責任','請以台灣現行法規回答。我是居家服務員，遇到（描述情境，不含個資）。請說明：1) 這涉及哪些法律與條文 2) 我有沒有通報義務、時限與對象 3) 我應該做與不應該做的事 4) 哪些地方你不確定、需要向主管機關或律師確認。請不要編造條號，不確定就說不確定。')}
  </div>
  <div class="card"><h2>判斷 AI 回答可不可信</h2><ul>
   <li>它引用的法條號碼，去全國法規資料庫查一次；查不到就不要用。</li>
   <li>它說的照顧做法，跟這個資料庫或單位 SOP 衝突時，以 SOP 為準並請教督導。</li>
   <li>它給的數字（血壓、血糖、劑量）超出你受訓的範圍時，不要照做。</li>
   <li>把它當作幫你「想得更完整」的同事，而不是幫你「做決定」的主管。</li></ul></div>
  </div>`;
  main.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.copy)));
}

main.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const id=b.dataset.id, en=E.find(x=>x.id===id);
  if(b.dataset.act==='fav'){ favs.has(id)?favs.delete(id):favs.add(id); saveFavs(); b.classList.toggle('on',favs.has(id)); b.textContent=favs.has(id)?'★ 已收藏':'☆ 收藏'; showToast(favs.has(id)?'已加入收藏':'已取消收藏'); if(view==='fav'&&!favs.has(id)) render(); }
  if(b.dataset.act==='ask'){ copy(en.ask); }
  if(b.dataset.act==='print'){ printOne(en); }
});

  <script>window.onload=()=>window.print()<\/script></body></html>`);
